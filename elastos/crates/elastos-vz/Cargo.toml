[package]
name = "elastos-vz"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ElastOS Apple Virtualization.framework Compute Provider for macOS microVM capsules"

[dependencies]
elastos-common = { path = "../elastos-common" }
elastos-compute = { path = "../elastos-compute" }

tokio = { version = "1.0", features = ["full", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
url = "2.5"
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1.0"
libc = "0.2"

# Apple Virtualization.framework bindings are fetched and linked only on macOS.
# On Linux the crate compiles as an unavailable backend (`is_supported()`
# returns false and VM entry points fail closed), so workspace builds stay green
# without silently downgrading capsule isolation.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-virtualization = "0.3"
objc2-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
tempfile = "3.10"
# Used by platform-aware data-dir resolution in macOS/Linux integration tests.
# Linux follows $XDG_DATA_HOME (default ~/.local/share); macOS follows
# ~/Library/Application Support, matching `elastos setup` install paths.
# Pinned to 5.0 to match elastos-server / elastos-storage / elastos-compute.
dirs = "5.0"
