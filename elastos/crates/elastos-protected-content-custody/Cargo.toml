[package]
name = "elastos-protected-content-custody"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Source-only protected-content custody crypto helpers"

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
ctr = "0.9"
ed25519-dalek = "2.1"
elastos-protected-content-contracts = { path = "../elastos-protected-content-contracts" }
elastos-protected-content-provider-contracts = { path = "../elastos-protected-content-provider-contracts" }
ghash = { version = "0.5", features = ["zeroize"] }
hkdf = "0.12"
hpke = { version = "0.13.0", default-features = false, features = ["std", "x25519"] }
nix = { version = "0.29", features = ["fs", "user"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"
# hpke 0.13 and vsss-rs 6.0.1 depend on different rand_core generations.
rand09 = { package = "rand", version = "0.9.5" }
rand10 = { package = "rand", version = "0.10" }
sha2 = "0.10"
subtle = "2.6"
thiserror = "1.0"
x-wing = { version = "=0.1.0", features = ["getrandom", "zeroize"] }
vsss-rs = { version = "6.0.1", default-features = false, features = ["std", "zeroize"] }
zeroize = "1.9"

[dev-dependencies]
elastos-auth = { path = "../elastos-auth" }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
tempfile = "3.12"
x-wing = { version = "=0.1.0", features = ["getrandom", "hazmat", "zeroize"] }
