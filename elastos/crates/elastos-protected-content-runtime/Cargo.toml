[package]
name = "elastos-protected-content-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Internal protected-content Runtime coordination state and provider seams"

[dependencies]
async-trait = "0.1"
elastos-protected-content-provider-contracts = { path = "../elastos-protected-content-provider-contracts" }
elastos-protected-content-contracts = { path = "../elastos-protected-content-contracts" }
elastos-wallet-contract = { path = "../elastos-wallet-contract" }
hex = "0.4"
nix = { version = "0.29", features = ["fs", "user"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
elastos-auth = { path = "../elastos-auth" }
ed25519-dalek = "2.1"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
tempfile = "3.12"
tokio = { version = "1.0", features = ["full", "test-util"] }
x-wing = { version = "=0.1.0", features = ["hazmat", "zeroize"] }
