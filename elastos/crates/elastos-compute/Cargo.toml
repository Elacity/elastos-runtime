[package]
name = "elastos-compute"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compute abstraction layer for ElastOS"

[dependencies]
elastos-common = { path = "../elastos-common" }
async-trait = "0.1"
tokio = { version = "1.0", features = ["sync", "rt-multi-thread"] }
# wasmtime / wasmtime-wasi 36.x is the current stable line and closes a large
# cluster of CVEs surfaced against the 17.x family (RUSTSEC-2026-0085..0096
# and friends). The 17 → 36 migration is significant — `wasmtime_wasi::sync`
# was removed in 24.x in favour of `wasmtime_wasi::preview1::WasiP1Ctx`, and
# the fd-injection carrier-bridge transport (which depended on
# `WasiCtx::insert_file`) had to be replaced with a FIFO-based transport
# (see `providers/wasm.rs` for the new shape). `wasi-common` is no longer
# pulled in directly; the preview1 host functions come from
# `wasmtime_wasi::preview1::add_to_linker_sync`.
wasmtime = "36"
wasmtime-wasi = "36"
uuid = { version = "1.0", features = ["v4"] }
dirs = "5.0"
libc = "0.2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
tempfile = "3.0"
