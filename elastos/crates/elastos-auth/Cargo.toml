[package]
name = "elastos-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ElastOS shared authority primitives for proof-bound sessions"

[lib]
name = "elastos_auth"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
sha3 = "0.10"

[dev-dependencies]
serde_json = "1.0"
