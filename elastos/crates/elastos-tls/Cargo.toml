[package]
name = "elastos-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TLS certificate management for ElastOS"

[dependencies]
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio-rustls = "0.26"
# PEM parsing uses `rustls_pki_types::pem::PemObject` from the active Rustls
# stack; keep `rustls-pemfile` out of the direct dependency tree.
time = "0.3"
tokio = { version = "1.0", features = ["net", "io-util", "rt", "macros", "time"] }
elastos-logger = { path = "../elastos-logger" }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.0", features = ["full", "test-util"] }
