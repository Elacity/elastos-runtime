[package]
name = "elastos-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ElastOS Server - HTTP API, CLI, and orchestration"

[[bin]]
name = "elastos"
path = "src/main.rs"

[dependencies]
elastos-runtime = { path = "../elastos-runtime" }
elastos-namespace = { path = "../elastos-namespace" }
elastos-common = { path = "../elastos-common" }
elastos-storage = { path = "../elastos-storage" }
elastos-compute = { path = "../elastos-compute" }
elastos-tls = { path = "../elastos-tls" }
elastos-identity = { path = "../elastos-identity" }
elastos-crosvm = { path = "../elastos-crosvm" }

# HTTP server
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }

# TLS (ring crypto provider)
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# HTTP client (for IPFS operations)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }

# CLI
clap = { version = "4.0", features = ["derive"] }
# crossterm + ratatui were declared here historically but never used in
# elastos-server src. They pulled in unmaintained transitives (lru 0.12.5 etc.)
# that surfaced in `cargo audit`. The chat capsule declares its own optional
# ratatui/crossterm under the `tui` feature, unaffected by this removal.

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async trait support
async-trait = "0.1"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto (for content hashing in publish/sign commands)
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
aes-gcm = "0.10"
hkdf = "0.12"
argon2 = "0.5"

# URL parsing (used by identity HTTP handlers)
url = "2.5"
qrcodegen = "1.8"

# CID validation (for share URI parsing)
cid = "0.11"

# DID key encoding (base58)
bs58 = "0.5"

# Base64 encoding (for ipfs-provider bridge)
base64 = "0.22"

# Ed25519 signing (for provenance attestations)
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
# ed25519-dalek 3.x needed by distributed-topic-tracker for DHT record signing.
# Cargo resolves both versions; we convert between them via raw key bytes.
ed25519-dalek3 = { package = "ed25519-dalek", version = "=3.0.0-pre.1" }

# Directory helpers
dirs = "5.0"

# Configuration file
toml = "0.8"

# Temp files (for CID preparation)
tempfile = "3.10"

# Archive extraction (for capsule artifacts)
flate2 = "1.0"
tar = "0.4"
libc = "0.2"

# Built-in Carrier transport (P2P for updates, gossip messaging, DHT discovery).
#
# Four load-bearing pins all serve the same root cause: distributed-topic-tracker
# (DTT) was published against pre-release versions of three RustCrypto crates,
# and each of those crates has since released its final 1.0/3.0 with breaking
# API changes. Any cargo update that touches the chain rolls forward into the
# released versions and breaks DTT's transitive ed25519-dalek 3.0.0-pre.1.
#
# 1. distributed-topic-tracker = "=0.2.7"
#    0.2.8 (2026-03-18) silently bumped its iroh dep from ^0.96 to ^0.97,
#    clashing with our direct iroh 0.96 pin (two `iroh_gossip::Gossip` types
#    in the dep tree → hard E0308/E0599). 0.2.7 is the last 0.2.x on iroh ^0.96.
#    Migrating elastos-server to iroh 0.97 is tracked separately.
#
# 2/3/4. ed25519 / pkcs8 / signature pre-release chain
#    DTT → ed25519-dalek 3.0.0-pre.1 was built against:
#      - ed25519  ^3.0.0-rc.X
#      - pkcs8    ^0.11.0-rc.X
#      - signature ^3.0.0-rc.X
#    The released ed25519 3.0.0 / pkcs8 0.11.0 / signature 3.0.0 are
#    API-incompatible with those pre-releases (pkcs8::Error variants moved,
#    etc.), causing compile errors inside cargo's own registry source. Holding
#    all three at the rc versions v0.3.0 shipped keeps the graph buildable
#    until ed25519-dalek itself releases a 3.x-stable.
iroh = { version = "0.96", features = ["address-lookup-mdns"] }
iroh-gossip = "0.96"
distributed-topic-tracker = "=0.2.7"
ed25519 = "=3.0.0-rc.4"
pkcs8 = "=0.11.0-rc.11"
signature = "=3.0.0-rc.10"
futures-lite = "2.6"
getrandom = "0.2"
data-encoding = "2.6"

# Apple Virtualization.framework substrate — only compiled into the
# server on macOS hosts. On Linux/Windows the server keeps its
# Linux/crosvm-only behaviour byte-for-byte. Anchored in
# docs/vz-backend/PLAN.md (Linux-untouched gate).
[target.'cfg(target_os = "macos")'.dependencies]
elastos-vz = { path = "../elastos-vz" }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
tempfile = "3.10"
tower = { version = "0.5", features = ["util"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"

[features]
default = []
