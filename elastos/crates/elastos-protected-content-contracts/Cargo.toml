[package]
name = "elastos-protected-content-contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Canonical source-only protected-content v1 contracts"

[dependencies]
curve25519-dalek = { version = "5.0", default-features = false }
ed25519-dalek = "2.1"
elastos-auth = { path = "../elastos-auth" }
elastos-identity = { path = "../elastos-identity" }
k256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
sha3 = "0.10"
thiserror = "1.0"

[dev-dependencies]
hex = "0.4"
