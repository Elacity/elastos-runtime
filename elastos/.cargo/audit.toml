[advisories]
# Iroh 1.0.2 reaches quick-xml 0.41.0 only on Apple targets through
# netwatch -> netdev -> plist. netdev reads local SystemConfiguration plist
# files, and plist 1.10 uses quick-xml's plain Reader without NsReader or
# attribute iteration, so neither affected parser path is reached. plist 1.10
# also constrains quick-xml below the patched 0.42 line. Remove these
# exceptions as soon as that upstream constraint moves; do not broaden them.
ignore = [
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]
