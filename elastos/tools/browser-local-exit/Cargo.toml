[package]
name = "browser-local-exit"
version = "0.1.0"
edition = "2021"
description = "ElastOS Browser local Exit relay"
license = "MIT"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
