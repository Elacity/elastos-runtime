[package]
name = "browser-vm-guest-control-bridge"
version = "0.1.0"
edition = "2021"
description = "ElastOS Browser VM guest control bridge"
license = "MIT"

[workspace]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
