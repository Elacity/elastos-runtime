[package]
name = "browser-native-proxy-engine"
version = "0.1.0"
edition = "2021"
description = "ElastOS native browser proxy engine wrapper"
license = "MIT"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
