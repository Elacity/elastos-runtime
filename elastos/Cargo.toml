[workspace]
members = [
    "crates/elastos-common",
    "crates/elastos-storage",
    "crates/elastos-compute",
    "crates/elastos-crosvm",
    "crates/elastos-vz",
    "crates/elastos-tls",
    "crates/elastos-identity",
    "crates/elastos-namespace",
    "crates/elastos-auth",
    "crates/elastos-wallet-contract",
    "crates/elastos-runtime",
    "crates/elastos-server",
    "crates/elastos-guest",
    "capsules/shell",
    "capsules/localhost-provider",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/elacity/elastos-runtime"
rust-version = "1.89"

[profile.dev]
opt-level = 0
debug = "line-tables-only"    # Enough for backtraces, ~60% less artifact size

[profile.dev.package."*"]
opt-level = 1                 # Optimize deps (compiled once, run many times)

# Full debug info for the gateway/runtime binary only (the rest of the workspace stays
# "line-tables-only" for build size). Lets a debugger (lldb/CodeLLDB) inspect locals/params in
# elastos-server without bloating every crate. Provider capsules are separate crates and already
# build with full debug info in dev, so they need no override here.
[profile.dev.package.elastos-server]
debug = 2

[profile.test]
opt-level = 0
debug = "line-tables-only"

# Release tuning for the main binaries (elastos-server, runtime, …). Without this they shipped
# with rustc defaults (no LTO, codegen-units=16, unstripped). `lto = "thin"` lands most of LTO's
# size/speed win without the build-time blow-up of fat LTO + codegen-units=1 (which would slow the
# CI `build-release` job); `strip` removes symbols but KEEPS panic messages. To dial up later:
# `lto = true` + `codegen-units = 1` (slower build, a few % smaller/faster).
# `panic` deliberately stays "unwind": elastos-identity's WebAuthn handler relies on
# std::panic::catch_unwind for its fail-closed DoS bounds-check (PRINCIPLE 11) — "abort" would
# break it. The size-tuned `tools/*` set `panic = "abort"` locally where that's safe.
[profile.release]
opt-level = 3
lto = "thin"
strip = true
