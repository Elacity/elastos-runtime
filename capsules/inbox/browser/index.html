<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbox · ElastOS</title>
  <script src="./elastos-theme.js"></script>
  <link rel="stylesheet" href="./elastos-ui.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: var(--el-bg);
      --sidebar-bg: rgba(22, 24, 29, 0.78);
      --toolbar-bg: rgba(22, 24, 29, 0.78);
      --panel: var(--el-surface-raised);
      --panel-strong: var(--el-surface-raised);
      --panel-soft: var(--el-inset);
      --line: var(--el-hairline);
      --line-strong: var(--el-hairline-strong);
      --ink: var(--el-text);
      --muted: var(--el-muted);
      --brand: var(--el-brand);
      --accent: var(--el-accent);
      --accent-soft: var(--el-accent-soft);
      --danger: var(--el-danger);
      --shadow: none;
      --border: var(--line);
      --border-strong: var(--line-strong);
      --text: var(--ink);
      --radius-lg: 8px;
      --radius-md: 6px;
      font-family: var(--el-font);
    }

    :root[data-el-theme="light"] {
      color-scheme: light;
      --sidebar-bg: #f9f9f9;
      --toolbar-bg: #fafafa;
    }

    :root[data-el-theme="light"] body {
      background: var(--bg);
    }

    :root[data-el-theme="light"] .entry-action:hover,
    :root[data-el-theme="light"] .entry-action:focus-visible {
      background: #f9fafb;
    }


    :root[data-el-theme="light"] .entry-action.primary {
      background: var(--text);
      color: #f8fbff;
    }

    :root[data-el-theme="light"] .entry-action.danger {
      border-color: rgba(177, 76, 90, 0.24);
      background: rgba(177, 76, 90, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0) 320px) var(--bg);
      color: var(--text);
    }

    button {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    .locked-shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .locked-card,
    .sidebar,
    .main {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .locked-card {
      max-width: 500px;
      padding: 30px;
    }

    .shell {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr);
      gap: 0;
      overflow: hidden;
      background: var(--panel);
    }

    .sidebar,
    .main {
      min-width: 0;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 20px;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: var(--sidebar-bg);
      box-shadow: none;
    }

    .main {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: var(--panel);
      box-shadow: none;
    }

    .eyebrow {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.2;
    }

    h2 {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .subtitle,
    .muted {
      color: var(--muted);
      line-height: 1.5;
    }

    .sidebar-title {
      margin: 15px 0 16px;
      color: var(--muted);
      font-size: 19px;
      font-weight: 700;
    }

    .summary-stack {
      display: grid;
      gap: 4px;
    }

    .summary-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 34px;
      padding: 7px 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .summary-card:hover {
      background: var(--line);
    }

    /* The active mailbox row carries the accent, like Mail's sidebar. */
    .summary-card.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .summary-card.active strong {
      color: var(--accent);
    }

    .summary-card strong {
      order: 2;
      min-width: 28px;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .summary-card span {
      overflow: hidden;
      font-size: 14px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 49px;
      padding: 6px 10px 6px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--toolbar-bg);
    }

    .toolbar-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .toolbar-title h1 {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      min-height: 1.4em;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .action-secondary,
    .entry-action {
      min-height: 30px;
      border-radius: 6px;
      border: 1px solid var(--border);
      padding: 5px 10px;
      background: var(--el-inset);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .action-secondary:hover,
    .action-secondary:focus-visible,
    .entry-action:hover,
    .entry-action:focus-visible {
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.1);
      outline: none;
    }

    /* Mail anatomy: a compact selectable list on the left, the full request
       with its actions in a reading pane on the right. */
    .entry-split {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: minmax(220px, 300px) minmax(0, 1fr);
      min-height: 0;
    }

    .entry-rows {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-height: 0;
      overflow: auto;
      padding: 8px;
      border-right: 1px solid var(--line);
    }

    .entry-row {
      display: grid;
      gap: 2px;
      padding: 9px 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .entry-row:hover {
      background: var(--panel-soft);
    }

    .entry-row.active {
      background: var(--accent-soft);
    }

    .entry-row-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .entry-row-title {
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .entry-row-time {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 11px;
    }

    .entry-row-snippet {
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .entry-row-unread .entry-row-title::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 6px;
      border-radius: 50%;
      background: var(--accent);
      vertical-align: 1px;
    }

    .entry-detail {
      display: block;
      min-height: 0;
      overflow: auto;
      padding: 18px 20px;
    }

    .entry-detail-placeholder {
      display: grid;
      place-items: center;
      height: 100%;
      color: var(--muted);
      font-size: 13px;
    }

    .entry-title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .entry-title {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0;
    }

    .entry-badge {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 7px;
      border-radius: 5px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .entry-time {
      color: var(--muted);
      font-size: 12px;
    }

    .entry-body {
      margin-top: 10px;
      color: var(--ink);
      font-size: 13.5px;
      line-height: 1.55;
    }

    .entry-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .entry-action.primary {
      background: var(--text);
      border-color: var(--text);
      color: #0b0d10;
    }

    .entry-action.danger {
      color: var(--danger);
      border-color: rgba(255, 143, 143, 0.32);
      background: rgba(255, 143, 143, 0.1);
    }

    .entry-action:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .empty-state {
      min-height: 0;
      flex: 1 1 auto;
      display: grid;
      place-items: center;
      margin: 12px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      text-align: center;
    }

    @media (max-width: 900px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .summary-stack {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .shell {
        height: 100vh;
        height: 100dvh;
      }

      .locked-shell {
        padding: 4px;
      }

      .locked-card,
      .sidebar,
      .main {
        border-radius: 0;
        box-shadow: none;
      }

      .toolbar {
        display: flex;
        gap: 8px;
      }

      /* Phone: list over detail, stacked. */
      .entry-split {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(120px, 40%) minmax(0, 1fr);
      }

      .entry-rows {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .summary-stack {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <section id="locked-shell" class="locked-shell hidden">
    <div class="locked-card">
      <p class="eyebrow">ElastOS</p>
      <h1>Open from Home</h1>
      <p class="subtitle">Review Home requests.</p>
    </div>
  </section>

  <section id="inbox-shell" class="shell hidden">
    <aside class="sidebar">
      <div class="sidebar-title">Inbox</div>
      <div class="summary-stack" role="group" aria-label="Inbox filters">
        <button class="summary-card active" type="button" data-filter="all" aria-pressed="true">
          <strong id="pending-count">0</strong>
          <span>Pending</span>
        </button>
        <button class="summary-card" type="button" data-filter="review" aria-pressed="false">
          <strong id="review-count">0</strong>
          <span>Review</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="toolbar-title">
          <h1 id="list-title">Requests</h1>
          <p id="status-text" class="status">Loading...</p>
        </div>
        <button id="refresh" class="action-secondary" type="button">Refresh</button>
      </div>

      <div class="entry-split">
        <section id="entry-rows" class="entry-rows" role="listbox" aria-label="Requests"></section>
        <section id="entry-detail" class="entry-detail" aria-live="polite"></section>
      </div>
      <section id="empty-state" class="empty-state hidden">
        <div>
          <h2>No requests</h2>
        </div>
      </section>
    </main>
  </section>

  <script>
    const INBOX_SAFETY_REFRESH_MS = 5 * 60 * 1000;

    const state = {
      homeToken: new URLSearchParams(window.location.search).get("home_token") || "",
      entries: [],
      refreshInFlight: null,
      filter: "all",
      selectedId: "",
      lastNotifications: {},
    };

    const elements = {
      lockedShell: document.getElementById("locked-shell"),
      inboxShell: document.getElementById("inbox-shell"),
      statusText: document.getElementById("status-text"),
      pendingCount: document.getElementById("pending-count"),
      reviewCount: document.getElementById("review-count"),
      refresh: document.getElementById("refresh"),
      entryRows: document.getElementById("entry-rows"),
      entryDetail: document.getElementById("entry-detail"),
      emptyState: document.getElementById("empty-state"),
      entrySplit: document.querySelector(".entry-split"),
      listTitle: document.getElementById("list-title"),
      filterButtons: [...document.querySelectorAll(".summary-card[data-filter]")],
    };

    function showLocked() {
      elements.lockedShell.classList.remove("hidden");
      elements.inboxShell.classList.add("hidden");
    }

    function showInbox() {
      elements.lockedShell.classList.add("hidden");
      elements.inboxShell.classList.remove("hidden");
    }

    function setStatus(text) {
      elements.statusText.textContent = text;
    }

    function notifyHome() {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: "home:refresh-summary",
          homeToken: state.homeToken,
        }, window.location.origin);
      }
    }

    function runtimeEventIsRelevant(event) {
      const kind = String(event && event.kind || "");
      const scope = String(event && event.scope || "");
      return scope === "inbox" || scope === "wallet" || kind.startsWith("inbox.") || kind.startsWith("wallet.");
    }

    function onRuntimeEvents(event) {
      if (event.origin !== window.location.origin) {
        return;
      }
      const message = event.data || {};
      if (message.type !== "elastos:runtime-events" || !Array.isArray(message.events)) {
        return;
      }
      if (message.events.some(runtimeEventIsRelevant)) {
        requestInboxRefresh().catch(() => {});
      }
    }

    async function api(path, options) {
      const request = Object.assign({ method: "GET" }, options || {});
      request.headers = Object.assign({}, request.headers || {}, {
        "x-elastos-home-token": state.homeToken,
      });
      if (request.body && !request.headers["content-type"]) {
        request.headers["content-type"] = "application/json";
      }
      const response = await fetch(path, request);
      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || "Request failed: " + response.status);
      }
      return response.json();
    }

    async function requestFreshPasskeyHomeToken() {
      if (!window.PublicKeyCredential) {
        throw new Error("Passkey verification is unavailable in this browser.");
      }
      const begin = await passkeyJson("/api/auth/passkey/authenticate/begin", { method: "POST" });
      const credential = await navigator.credentials.get(toRequestOptions(begin.options));
      if (!credential) {
        throw new Error("Passkey verification was cancelled.");
      }
      const complete = await passkeyJson("/api/auth/passkey/authenticate/complete", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          ceremony_id: begin.ceremony_id,
          response: serializeAssertionCredential(credential),
        }),
      });
      const homeToken = typeof complete.home_token === "string" ? complete.home_token.trim() : "";
      if (!homeToken) {
        throw new Error("Fresh passkey token was not issued.");
      }
      return homeToken;
    }

    async function passkeyJson(path, options) {
      const response = await fetch(path, options);
      if (!response.ok) {
        const text = await response.text().catch(() => "");
        throw new Error(text || "Passkey verification failed.");
      }
      return response.json();
    }

    function toRequestOptions(options) {
      const publicKey = Object.assign({}, options && options.publicKey ? options.publicKey : {});
      publicKey.challenge = base64UrlToBuffer(publicKey.challenge);
      publicKey.allowCredentials = (publicKey.allowCredentials || []).map((credential) => Object.assign({}, credential, {
        id: base64UrlToBuffer(credential.id),
      }));
      return { publicKey };
    }

    function serializeAssertionCredential(credential) {
      return {
        id: credential.id,
        rawId: bufferToBase64Url(credential.rawId),
        type: credential.type,
        response: {
          clientDataJson: bufferToBase64Url(credential.response.clientDataJSON),
          authenticatorData: bufferToBase64Url(credential.response.authenticatorData),
          signature: bufferToBase64Url(credential.response.signature),
          userHandle: credential.response.userHandle
            ? bufferToBase64Url(credential.response.userHandle)
            : null,
        },
      };
    }

    function base64UrlToBuffer(value) {
      const base64 = String(value || "").replace(/-/g, "+").replace(/_/g, "/");
      const padded = base64.padEnd(Math.ceil(base64.length / 4) * 4, "=");
      const raw = window.atob(padded);
      const bytes = new Uint8Array(raw.length);
      for (let index = 0; index < raw.length; index += 1) {
        bytes[index] = raw.charCodeAt(index);
      }
      return bytes.buffer;
    }

    function bufferToBase64Url(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = "";
      for (const byte of bytes) {
        binary += String.fromCharCode(byte);
      }
      return window.btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    async function inboxAction(actionId, fields = {}) {
      return api("/api/apps/inbox/actions", {
        method: "POST",
        body: JSON.stringify(Object.assign({ action_id: actionId }, fields)),
      });
    }

    async function loadInbox() {
      const payload = await api("/api/apps/inbox/summary");
      const notifications = payload.notifications || {};
      state.entries = Array.isArray(notifications.entries) ? notifications.entries : [];
      renderInbox(notifications);
      markVisibleRead(notifications);
      notifyHome();
    }

    function requestInboxRefresh() {
      if (state.refreshInFlight) {
        return state.refreshInFlight;
      }
      state.refreshInFlight = loadInbox()
        .catch((error) => {
          setStatus(error.message || "Could not refresh inbox.");
          throw error;
        })
        .finally(() => {
          state.refreshInFlight = null;
        });
      return state.refreshInFlight;
    }

    function filteredEntries() {
      if (state.filter === "review") {
        return state.entries.filter((entry) => entry && entry.severity === "attention");
      }
      return state.entries;
    }

    function setFilter(filter) {
      state.filter = filter === "review" ? "review" : "all";
      for (const button of elements.filterButtons) {
        const active = button.dataset.filter === state.filter;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", active ? "true" : "false");
      }
      elements.listTitle.textContent = state.filter === "review" ? "Review" : "Requests";
      renderInbox(state.lastNotifications);
    }

    function renderInbox(notifications) {
      state.lastNotifications = notifications || {};
      const entries = filteredEntries();
      const attentionCount = Number((notifications || {}).attention_count || 0);
      elements.pendingCount.textContent = String(state.entries.length);
      elements.reviewCount.textContent = String(attentionCount);

      // Keep the selection when it survives the refresh; otherwise pick the
      // first entry so the reading pane is never pointlessly empty.
      if (!entries.some((entry) => entry.id === state.selectedId)) {
        state.selectedId = entries.length ? entries[0].id || "" : "";
      }

      elements.entryRows.replaceChildren();
      for (const entry of entries) {
        elements.entryRows.appendChild(createRow(entry));
      }
      renderDetail(entries.find((entry) => entry.id === state.selectedId) || null);

      const empty = entries.length === 0;
      elements.emptyState.classList.toggle("hidden", !empty);
      elements.entrySplit.classList.toggle("hidden", empty);
      setStatus(state.entries.length === 0 ? "" : `${state.entries.length} pending.`);
    }

    function createRow(entry) {
      const row = document.createElement("button");
      row.type = "button";
      row.className = "entry-row";
      row.setAttribute("role", "option");
      row.setAttribute("aria-selected", entry.id === state.selectedId ? "true" : "false");
      row.classList.toggle("active", entry.id === state.selectedId);
      row.classList.toggle("entry-row-unread", !entry.read);

      const top = document.createElement("div");
      top.className = "entry-row-top";
      const title = document.createElement("span");
      title.className = "entry-row-title";
      title.textContent = entry.title || "Request";
      const time = document.createElement("span");
      time.className = "entry-row-time";
      time.textContent = entry.created_at ? formatInboxTime(entry.created_at) : "";
      top.append(title, time);

      const snippet = document.createElement("span");
      snippet.className = "entry-row-snippet";
      snippet.textContent = entry.body || "";

      row.append(top, snippet);
      row.addEventListener("click", () => {
        state.selectedId = entry.id || "";
        renderInbox(state.lastNotifications);
      });
      return row;
    }

    function renderDetail(entry) {
      elements.entryDetail.replaceChildren();
      if (!entry) {
        const placeholder = document.createElement("div");
        placeholder.className = "entry-detail-placeholder";
        placeholder.textContent = "Select a request";
        elements.entryDetail.appendChild(placeholder);
        return;
      }

      const titleRow = document.createElement("div");
      titleRow.className = "entry-title-row";
      const title = document.createElement("div");
      title.className = "entry-title";
      title.textContent = entry.title || "Request";
      titleRow.appendChild(title);
      if (entry.severity === "attention") {
        const badge = document.createElement("span");
        badge.className = "entry-badge";
        badge.textContent = "Review";
        titleRow.appendChild(badge);
      }
      if (!entry.read) {
        const badge = document.createElement("span");
        badge.className = "entry-badge";
        badge.textContent = "New";
        titleRow.appendChild(badge);
      }

      const time = document.createElement("time");
      time.className = "entry-time";
      if (entry.created_at) {
        time.dateTime = new Date(entry.created_at * 1000).toISOString();
        time.textContent = formatInboxTime(entry.created_at);
      }

      const body = document.createElement("p");
      body.className = "entry-body";
      body.textContent = entry.body || "";

      const actions = document.createElement("div");
      actions.className = "entry-actions";
      if (typeof entry.source_app === "string" && entry.source_app.trim()) {
        actions.appendChild(createButton("Open", () => openSource(entry.source_app)));
      }

      const actionId = entry.action_ref && entry.action_ref.action_id;
      if (typeof actionId === "string" && actionId.startsWith("room-approve-request:")) {
        actions.appendChild(createActionButton("Approve", actionId, "primary"));
        actions.appendChild(createActionButton("Deny", "room-deny-request:" + actionId.slice("room-approve-request:".length), "danger"));
      } else if (typeof actionId === "string" && actionId.startsWith("wallet-approve-request:")) {
        const requestId = actionId.slice("wallet-approve-request:".length);
        actions.appendChild(createButton("Approve", (button) => approveWalletRequest(button, requestId), "primary"));
        actions.appendChild(createButton("Review in Wallet", () => openSource("wallet", { wallet_request: requestId })));
        actions.appendChild(createActionButton("Reject", "wallet-reject-request:" + actionId.slice("wallet-approve-request:".length), "danger"));
      } else if (typeof actionId === "string" && actionId.startsWith("capability-approve-request:")) {
        actions.appendChild(createActionButton("Approve", actionId, "primary"));
        actions.appendChild(createActionButton("Deny", "capability-deny-request:" + actionId.slice("capability-approve-request:".length), "danger"));
      } else if (typeof actionId === "string" && actionId.startsWith("inspect-approve-request:")) {
        const requestId = actionId.slice("inspect-approve-request:".length);
        const approveButton = createButton("Approve", (button) => approveInspectRequest(button, requestId), "primary");
        approveButton.dataset.actionId = actionId;
        actions.appendChild(approveButton);
        actions.appendChild(createActionButton("Deny", "inspect-deny-request:" + actionId.slice("inspect-approve-request:".length), "danger"));
      } else if (typeof actionId === "string" && actionId.startsWith("wallet-price-http-approve:")) {
        actions.appendChild(createActionButton("Approve", actionId, "primary"));
        actions.appendChild(createActionButton("Reject", "wallet-price-http-deny:" + actionId.slice("wallet-price-http-approve:".length), "danger"));
      }

      if (entry.kind !== "wallet_approval_request" && entry.kind !== "capability_request" && entry.kind !== "inspect_action_request" && entry.kind !== "external_http_request") {
        actions.appendChild(createActionButton("Dismiss", "notification-dismiss:" + entry.id));
      }
      elements.entryDetail.append(titleRow, time, body, actions);
    }

    function createButton(label, onClick, className) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "entry-action" + (className ? " " + className : "");
      button.textContent = label;
      button.addEventListener("click", () => {
        Promise.resolve(onClick(button)).catch((error) => {
          setStatus(error.message || "Action failed.");
        });
      });
      return button;
    }

    function createActionButton(label, actionId, className) {
      const button = createButton(label, () => runAction(actionId), className);
      button.dataset.actionId = actionId;
      return button;
    }

    async function runAction(actionId) {
      setButtonsDisabled(true);
      try {
        await inboxAction(actionId);
        await loadInbox();
      } finally {
        setButtonsDisabled(false);
      }
    }

    async function approveWalletRequest(button, requestId) {
      if (!requestId) {
        return;
      }
      setButtonsDisabled(true);
      button.disabled = true;
      setStatus("Confirm with your passkey to sign.");
      try {
        const homeToken = await requestFreshPasskeyHomeToken();
        await inboxAction("wallet-approve-request:" + requestId, {
          home_token: homeToken,
        });
        setStatus("Request signed.");
        await loadInbox();
        notifyHome();
      } finally {
        setButtonsDisabled(false);
      }
    }

    async function approveInspectRequest(button, requestId) {
      if (!requestId) {
        return;
      }
      setButtonsDisabled(true);
      button.disabled = true;
      setStatus("Confirm with your passkey to approve this Inspector action.");
      try {
        const homeToken = await requestFreshPasskeyHomeToken();
        await inboxAction("inspect-approve-request:" + requestId, {
          home_token: homeToken,
        });
        setStatus("Inspector action approved.");
        await loadInbox();
        notifyHome();
      } finally {
        setButtonsDisabled(false);
      }
    }

    function setButtonsDisabled(disabled) {
      for (const button of elements.entryDetail.querySelectorAll("button")) {
        button.disabled = disabled;
      }
      elements.refresh.disabled = disabled;
    }

    function openSource(sourceApp, query = {}) {
      const target = typeof sourceApp === "string" ? sourceApp.trim() : "";
      if (!target || !window.parent || window.parent === window) {
        return;
      }
      window.parent.postMessage({
        type: "home:open-target",
        target,
        query,
        homeToken: state.homeToken,
      }, window.location.origin);
    }

    function markVisibleRead(notifications) {
      const unreadIds = state.entries
        .filter((entry) => entry && entry.id && !entry.read && entry.kind !== "wallet_approval_request")
        .map((entry) => entry.id);
      if (unreadIds.length === 0) {
        return;
      }
      Promise.all(
        unreadIds.map((id) => inboxAction("notification-read:" + id).catch(() => null)),
      ).then(() => {
        const unreadIdSet = new Set(unreadIds);
        for (const entry of state.entries) {
          if (unreadIdSet.has(entry.id)) {
            entry.read = true;
          }
        }
        const unreadCount = Math.max(0, Number(notifications.unread_count || 0) - unreadIds.length);
        renderInbox(Object.assign({}, notifications, { unread_count: unreadCount }));
        notifyHome();
      });
    }

    function formatInboxTime(createdAt) {
      const ageSeconds = Math.max(0, Math.floor(Date.now() / 1000) - Number(createdAt || 0));
      if (ageSeconds < 60) {
        return "just now";
      }
      if (ageSeconds < 3600) {
        return Math.floor(ageSeconds / 60) + "m ago";
      }
      if (ageSeconds < 86400) {
        return Math.floor(ageSeconds / 3600) + "h ago";
      }
      return new Intl.DateTimeFormat([], {
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
      }).format(new Date(Number(createdAt) * 1000));
    }

    elements.refresh.addEventListener("click", () => {
      setButtonsDisabled(true);
      loadInbox()
        .catch((error) => setStatus(error.message || "Could not refresh."))
        .finally(() => setButtonsDisabled(false));
    });

    for (const button of elements.filterButtons) {
      button.addEventListener("click", () => setFilter(button.dataset.filter));
    }

    if (!state.homeToken) {
      showLocked();
    } else {
      showInbox();
      requestInboxRefresh().catch(() => {});
      window.addEventListener("message", onRuntimeEvents);
      window.setInterval(() => {
        if (document.hidden) {
          return;
        }
        requestInboxRefresh().catch(() => {});
      }, INBOX_SAFETY_REFRESH_MS);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          return;
        }
        requestInboxRefresh().catch(() => {});
      });
    }
  </script>
</body>
</html>
