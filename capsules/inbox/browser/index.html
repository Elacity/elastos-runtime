<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbox · ElastOS</title>
  <script src="./elastos-theme.js"></script>
  <link rel="stylesheet" href="./elastos-ui.css">
  <style>
    /* Inbox's own names map onto the shared tokens, so its layout rules below
       stay as they are and the whole app follows the theme. Nothing here picks
       a colour of its own. */
    :root {
      --bg: var(--el-bg);
      --sidebar-bg: var(--el-surface);
      --toolbar-bg: var(--el-surface);
      --panel: var(--el-surface-raised);
      --panel-strong: var(--el-surface-raised);
      --panel-soft: var(--el-inset);
      --line: var(--el-hairline);
      --line-strong: var(--el-hairline-strong);
      --ink: var(--el-text);
      --muted: var(--el-muted);
      --brand: var(--el-brand);
      --accent: var(--el-accent);
      --accent-soft: var(--el-accent-soft);
      --danger: var(--el-danger);
      --shadow: var(--el-shadow-1);
      --border: var(--line);
      --border-strong: var(--line-strong);
      --text: var(--ink);
      --radius-lg: var(--el-radius-lg);
      --radius-md: var(--el-radius-md);
      font-family: var(--el-font);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
    }

    button {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    .locked-shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .locked-card,
    .sidebar,
    .main {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .locked-card {
      max-width: 500px;
      padding: 30px;
    }

    .shell {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr);
      gap: 0;
      overflow: hidden;
      background: var(--panel);
    }

    .sidebar,
    .main {
      min-width: 0;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 4px;
      /* Unified-sidebar chrome paints the traffic lights over the first 52px;
         capsule-local value on purpose (see home-entropy-check: Chat/Inbox). */
      padding: 52px 12px 16px;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: var(--sidebar-bg);
      box-shadow: none;
    }

    .main {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: var(--panel);
      box-shadow: none;
    }

    .eyebrow {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.2;
    }

    h2 {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .subtitle,
    .muted {
      color: var(--muted);
      line-height: 1.5;
    }

    .sidebar-title {
      margin: 15px 0 16px;
      color: var(--muted);
      font-size: 19px;
      font-weight: 700;
    }

    .summary-stack {
      display: grid;
      gap: 4px;
    }

    .summary-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 34px;
      padding: 7px 10px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .summary-card:hover {
      background: var(--line);
    }

    .summary-card.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .summary-card.active strong {
      color: var(--accent);
    }

    .summary-card strong {
      order: 2;
      min-width: 28px;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .summary-card span {
      overflow: hidden;
      font-size: 14px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 49px;
      padding: 6px 10px 6px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--toolbar-bg);
    }

    .toolbar-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .toolbar-title h1 {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      min-height: 1.4em;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .action-secondary,
    .entry-action {
      min-height: 30px;
      border-radius: 6px;
      border: 1px solid var(--border);
      padding: 5px 10px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      transition: background 150ms ease, border-color 150ms ease;
    }

    .action-secondary:hover,
    .action-secondary:focus-visible,
    .entry-action:hover,
    .entry-action:focus-visible {
      border-color: var(--border-strong);
      background: var(--panel-soft);
      outline: none;
    }

    .entry-split {
      display: grid;
      grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
      min-height: 0;
      flex: 1 1 auto;
    }

    .entry-rows {
      display: grid;
      align-content: start;
      gap: 2px;
      overflow: auto;
      padding: 12px;
      border-right: 1px solid var(--line);
    }

    .entry-row {
      display: grid;
      gap: 6px;
      padding: 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .entry-row:hover,
    .entry-row:focus-visible {
      background: var(--panel-soft);
      outline: none;
    }

    .entry-row.active {
      background: var(--accent-soft);
    }

    .entry-row-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .entry-row-title {
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entry-row-time {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0;
    }

    .entry-row-snippet {
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entry-row-unread .entry-row-title::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 6px;
      border-radius: 50%;
      background: var(--accent);
      vertical-align: 1px;
    }

    .entry-detail {
      display: block;
      min-height: 0;
      overflow: auto;
      padding: 18px 20px;
    }

    .entry-detail-placeholder {
      display: grid;
      place-items: center;
      height: 100%;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0;
    }

    .entry-title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .entry-title {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0;
    }

    .entry-badge {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 7px;
      border-radius: 5px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .entry-time {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0;
    }

    .entry-body {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .entry-facts {
      display: grid;
      gap: 6px;
      white-space: normal;
    }

    .entry-fact {
      display: grid;
      grid-template-columns: minmax(96px, 30%) minmax(0, 1fr);
      gap: 12px;
    }

    .entry-fact-value {
      color: var(--text);
    }

    .entry-fact-note {
      margin: 0;
    }

    @media (max-width: 520px) {
      .entry-fact {
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
      }
    }

    .entry-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .entry-action.primary {
      background: var(--text);
      border-color: var(--text);
      color: var(--bg);
    }

    .entry-action.danger {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 24%, transparent);
      background: color-mix(in srgb, var(--danger) 8%, transparent);
    }

    .entry-action:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .empty-state {
      min-height: 0;
      flex: 1 1 auto;
      display: grid;
      place-items: center;
      margin: 12px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-soft);
      text-align: center;
    }

    html[data-inbox-presentation="rail"] .sidebar {
      display: none;
    }

    html[data-inbox-presentation="rail"] .shell {
      grid-template-columns: 1fr;
    }

    html[data-inbox-presentation="rail"] .toolbar {
      display: none;
    }

    html[data-inbox-presentation="rail"] .entry-split {
      grid-template-columns: 1fr;
    }

    html[data-inbox-presentation="rail"] .entry-detail {
      display: none;
    }

    html[data-inbox-presentation="rail"] .entry-rows {
      gap: 8px;
      border-right: 0;
    }

    html[data-inbox-presentation="rail"] .entry-rail-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
    }

    html[data-inbox-presentation="rail"] .entry-rail-card .entry-row-title {
      white-space: normal;
    }

    html[data-inbox-presentation="rail"] .entry-rail-card .entry-row-snippet {
      display: -webkit-box;
      white-space: normal;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }

    html[data-inbox-presentation="rail"] .entry-rail-card .entry-actions {
      margin-top: 8px;
      padding-top: 10px;
    }

    @media (max-width: 900px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .summary-stack {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .shell {
        height: 100vh;
        height: 100dvh;
      }

      .locked-shell {
        padding: 4px;
      }

      .locked-card,
      .sidebar,
      .main {
        border-radius: 0;
        box-shadow: none;
      }

      .toolbar {
        display: flex;
        gap: 8px;
      }

      .entry-split {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(160px, 42%) minmax(0, 1fr);
      }

      .entry-rows {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .summary-stack {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <section id="locked-shell" class="locked-shell hidden">
    <div class="locked-card">
      <p class="eyebrow">ElastOS</p>
      <h1>Open from Home</h1>
      <p class="subtitle">Review Home requests.</p>
    </div>
  </section>

  <section id="inbox-shell" class="shell hidden">
    <aside class="sidebar">
      <div class="sidebar-title">Inbox</div>
      <div class="summary-stack" role="group" aria-label="Inbox filters">
        <button class="summary-card active" type="button" data-filter="all" aria-pressed="true">
          <strong id="pending-count">0</strong>
          <span>Pending</span>
        </button>
        <button class="summary-card" type="button" data-filter="review" aria-pressed="false">
          <strong id="review-count">0</strong>
          <span>Needs Review</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="toolbar-title">
          <h1 id="list-title">Requests</h1>
          <p id="status-text" class="status">Loading...</p>
        </div>
        <button id="refresh" class="action-secondary" type="button">Refresh</button>
      </div>

      <div id="entry-split" class="entry-split">
        <section id="entry-rows" class="entry-rows" role="listbox" aria-label="Requests"></section>
        <section id="entry-detail" class="entry-detail" aria-live="polite"></section>
      </div>
      <section id="empty-state" class="empty-state hidden">
        <div>
          <h2 id="empty-title">No requests</h2>
        </div>
      </section>
    </main>
  </section>

  <script src="./inbox.js"></script>
</body>
</html>
