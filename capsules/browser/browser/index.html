<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ElastOS Browser</title>
    <script src="./elastos-theme.js"></script>
    <link rel="stylesheet" href="./elastos-ui.css">
    <link rel="stylesheet" href="./style.css?v=browser-20260819a" />
    <link rel="modulepreload" href="./browser.js?v=browser-20260915b" />
    <link rel="modulepreload" href="./browser-location.js?v=browser-20260523b" />
    <link rel="modulepreload" href="./browser-runtime-api.js?v=browser-20260907c" />
    <link rel="modulepreload" href="./browser-clipboard.js?v=browser-20260725b" />
    <link rel="modulepreload" href="./browser-page-cleanup.js?v=browser-20260727a" />
    <link rel="modulepreload" href="./browser-input.js?v=browser-20260520e" />
    <link rel="modulepreload" href="./browser-input-surface.js?v=browser-20260725b" />
    <link rel="modulepreload" href="./browser-status.js?v=browser-20260907c" />
    <link rel="modulepreload" href="./browser-remote-display.js?v=browser-20260915d" />
    <link rel="modulepreload" href="./browser-service-selection.js?v=browser-20260907c" />
    <link rel="modulepreload" href="./browser-operator-approval.js" />
    <link rel="modulepreload" href="./browser-history.js?v=browser-20260520e" />
    <link rel="modulepreload" href="./browser-webrtc.js?v=browser-20260913h" />
    <link rel="modulepreload" href="/apps/home/home-clipboard-client.js?v=home-20260726a" />
    <script src="./browser-restore-boot.js?v=browser-20260915c"></script>
  </head>
  <body data-shell-window-fit="fixed">
    <main class="browser-shell">
      <section class="browser-chrome" aria-label="Browser controls">
        <div class="browser-nav-group" role="group" aria-label="History">
          <button id="browser-back" class="browser-nav-button" type="button" aria-label="Back" disabled>
            &larr;
          </button>
          <span class="browser-nav-divider" aria-hidden="true"></span>
          <button id="browser-forward" class="browser-nav-button" type="button" aria-label="Forward" disabled>
            &rarr;
          </button>
        </div>
        <button id="browser-refresh" class="browser-nav-button browser-nav-lone" type="button" aria-label="Refresh" disabled>
          &#8635;
        </button>
        <form id="browser-form" class="browser-address-row">
          <label class="sr-only" for="browser-url">Web address</label>
          <input
            id="browser-url"
            disabled
            class="browser-address"
            aria-label="Web address"
            autocomplete="url"
            inputmode="url"
            spellcheck="false"
            value="https://ela.city/"
          />
        </form>
        <div class="browser-util-group" role="group" aria-label="Browser tools">
          <button id="browser-settings" class="browser-nav-button" type="button" aria-label="Browser settings" title="Browser settings" aria-controls="browser-settings-panel" aria-expanded="false">
            &#9881;
          </button>
        </div>
      </section>
      <section id="browser-settings-panel" class="browser-settings-panel" aria-label="Browser settings" hidden>
        <div class="browser-settings-head">
          <strong>Settings</strong>
          <button id="browser-settings-close" class="browser-settings-close" type="button" aria-label="Close Browser settings">
            &times;
          </button>
        </div>
        <label class="browser-settings-label" for="browser-engine">Browser engine</label>
        <select id="browser-engine" class="browser-select" aria-label="Browser engine" title="Browser engine">
          <option value="">Automatic</option>
        </select>
        <p id="browser-engine-summary" class="browser-settings-hint">Use the best Browser Engine available.</p>
        <label class="browser-settings-label browser-settings-label-spaced" for="browser-exit">Exit node</label>
        <select id="browser-exit" class="browser-exit-select" aria-label="Browser exit node" title="Browser exit node">
          <option value="">This device</option>
        </select>
        <p id="browser-exit-summary" class="browser-settings-hint">Use this device's Exit Node for Browser traffic.</p>
        <button id="browser-profile-reset" class="browser-settings-action browser-settings-danger" type="button" aria-label="Reset Browser profile" title="Reset Browser profile">
          Reset profile
        </button>
      </section>

      <section class="browser-stage" aria-label="Web page">
        <div id="browser-render-panel" class="browser-render-panel" tabindex="0">
          <div id="browser-render-empty" class="browser-render-empty" hidden></div>
          <textarea
            id="browser-keyboard-capture"
            class="browser-keyboard-capture"
            aria-label="Browser keyboard and clipboard capture"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          ></textarea>
          <video
            id="browser-remote-display"
            class="browser-remote-display"
            autoplay
            playsinline
            muted
            hidden
          ></video>
        </div>
        <div id="browser-metrics" class="browser-metrics" hidden></div>
        <div id="browser-status" class="browser-status" role="status"></div>
      </section>
    </main>

    <script type="module" src="./browser.js?v=browser-20260915b"></script>
  </body>
</html>
