<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player · ElastOS</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="./elastos-theme.js"></script>
  <link rel="stylesheet" href="./elastos-ui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <script>
    const accessMode = new URLSearchParams(window.location.search).has("home_token")
      ? "shell"
      : "gateway";
    const hostMode = window.self === window.top ? "standalone" : "embedded";
    document.body.setAttribute("data-player-access-mode", accessMode);
    document.body.setAttribute("data-player-host-mode", hostMode);
  </script>
  <main id="app-shell" class="shell">
    <section class="player-card">
      <div class="video-frame">
        <video id="video" playsinline preload="metadata"></video>
        <div id="overlay" class="overlay" aria-live="polite">
          <div class="overlay-copy">
            <div class="icon" aria-hidden="true">&#9654;</div>
            <p id="overlay-text">Opening protected stream…</p>
          </div>
        </div>
        <div id="transport" class="transport" data-visible="true" aria-label="Playback controls">
          <button id="transport-play" class="transport-button transport-play" type="button" data-state="paused" aria-label="Play"></button>
          <span id="transport-time" class="transport-time">0:00 / 0:00</span>
          <input id="transport-seek" class="transport-seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek" />
          <button id="transport-mute" class="transport-button transport-mute" type="button" data-state="on" aria-label="Mute"></button>
          <input id="transport-volume" class="transport-volume" type="range" min="0" max="100" step="1" value="100" aria-label="Volume" />
          <button id="transport-fullscreen" class="transport-button transport-fullscreen" type="button" aria-label="Enter full screen"></button>
        </div>
      </div>
      <p id="status" class="status" aria-live="polite" hidden></p>
    </section>
  </main>
  <script type="module" src="player.js?v=20260618-audiocard"></script>
  <script type="module" src="transport.js?v=20260717a"></script>
  <script>
    // Shell menu bar: a Playback menu driving the SAME <video> element the
    // native controls use. No open/new-window entries — a protected viewer
    // must never offer a menu side door into a dKMS open.
    (function () {
      const homeToken = new URLSearchParams(window.location.search).get("home_token") || "";
      if (!homeToken || window.parent === window) {
        return;
      }
      window.parent.postMessage({
        type: "home:menu-manifest",
        homeToken,
        menus: [
          {
            title: "File",
            items: [
              { label: "Close Window", cmd: "__close-window" },
            ],
          },
          {
            title: "Playback",
            items: [
              { label: "Play / Pause", cmd: "play-pause" },
              "-",
              { label: "Enter Full Screen", cmd: "fullscreen" },
            ],
          },
        ],
      }, window.location.origin);
      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin) {
          return;
        }
        const message = event.data;
        if (message?.type !== "elastos:menu-command" || typeof message.cmd !== "string") {
          return;
        }
        const video = document.getElementById("video");
        if (!video) {
          return;
        }
        if (message.cmd === "play-pause") {
          if (video.paused) {
            video.play().catch(() => {});
          } else {
            video.pause();
          }
        } else if (message.cmd === "fullscreen") {
          video.requestFullscreen?.().catch(() => {});
        }
      });
    })();
  </script>
</body>
</html>
