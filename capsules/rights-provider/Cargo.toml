[package]
name = "rights-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS rights provider capsule"
license = "MIT"

[[bin]]
name = "rights-provider"
path = "src/main.rs"

[features]
# Phase B (dev profile): turn the on-chain ownership answer into a typed rights
# decision. rights-provider does NO chain RPC itself (that authority lives in
# chain-provider); the runtime core calls `chain-provider::has_access_by_content_id`
# and injects the typed attestation here, which this provider binds to the request
# and renders into a `RightsDecisionReceiptV1`. OFF by default -> the rights checks
# stay fail-closed (`not_configured`). See docs/dkms/history/SYSTEM_ARCHITECTURE_MAP.md.
chain-rights = []

[dependencies]
elastos-common = { path = "../../elastos/crates/elastos-common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]

[profile.release]
opt-level = "s"
lto = true

[workspace]
