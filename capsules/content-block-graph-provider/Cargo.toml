[package]
name = "content-block-graph-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS content block-graph provider contract"
license = "MIT"

[[bin]]
name = "content-block-graph-provider"
path = "src/main.rs"

[dependencies]
base64 = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true

[workspace]
