<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>People · ElastOS</title>
  <script src="./elastos-theme.js"></script>
  <link rel="stylesheet" href="./elastos-ui.css">
  <link rel="stylesheet" href="./style.css?v=people-20261028b">
</head>
<body>
  <section id="locked-shell" class="locked-shell hidden">
    <div class="locked-card">
      <p class="eyebrow">ElastOS</p>
      <h1>Open from Home</h1>
      <p>Open People from Home.</p>
    </div>
  </section>

  <main id="people-shell" class="people-shell hidden" aria-label="People">
    <nav id="people-sidebar" class="people-sidebar" aria-label="People pages">
      <button class="people-sidebar-item active" type="button" data-section-target="people">
        <span class="people-sidebar-icon people-sidebar-icon-people" aria-hidden="true"></span>
        <span>People</span>
      </button>
      <button class="people-sidebar-item" type="button" data-section-target="profile">
        <span class="people-sidebar-icon people-sidebar-icon-profile" aria-hidden="true"></span>
        <span>Profile</span>
      </button>
      <button class="people-sidebar-item" type="button" data-section-target="discovery">
        <span class="people-sidebar-icon people-sidebar-icon-public" aria-hidden="true"></span>
        <span>Public</span>
      </button>
    </nav>

    <section class="people-main">
      <div class="people-content">
        <div class="people-content-inner">
          <h1 class="people-page-title">People</h1>
          <div id="people-status" class="people-status" role="status" hidden></div>

          <section id="people" class="people-section" aria-label="People">
            <form id="add-contact-form" class="people-form" hidden>
              <label for="add-contact-id">Add by DID</label>
              <div class="people-field-row">
                <input id="add-contact-id" type="text" placeholder="Paste a DID" autocomplete="off" autocapitalize="none" spellcheck="false" required>
                <button id="add-contact-submit" type="submit">Send request</button>
              </div>
              <p id="add-contact-result" role="status"></p>
              <button id="add-contact-inbox" type="button" data-action="open-inbox" hidden>Open Inbox</button>
            </form>
            <div id="people-requests" class="people-requests" hidden>
              <p id="people-requests-count"></p>
              <button type="button" data-action="open-inbox">Open Inbox</button>
            </div>
            <div class="people-list-section">
              <div class="people-section-head">
                <h2>Contacts</h2>
                <span id="people-count" class="people-section-count" aria-live="polite">0</span>
              </div>
              <div id="people-list" class="people-list"></div>
            </div>
          </section>

          <section id="profile" class="people-section" aria-label="Profile" hidden>
            <form id="profile-form" class="people-form">
              <h2 id="profile-title" hidden></h2>
              <p id="profile-description" hidden></p>
              <label for="profile-name">Display name</label>
              <div class="people-field-row">
                <input id="profile-name" type="text" maxlength="32" autocomplete="nickname" placeholder="Your name">
                <button id="profile-submit" type="submit">Create Profile</button>
              </div>
            </form>
            <div id="profile-id" class="people-form" hidden>
              <span class="people-label">Your DID</span>
              <div class="people-field-row">
                <code id="profile-id-value"></code>
                <button id="profile-id-copy" type="button">Copy</button>
              </div>
            </div>
          </section>

          <section id="discovery" class="people-section" aria-label="Public" hidden>
            <div class="public-head">
              <p id="discovery-status"></p>
              <div class="public-actions">
                <button id="discovery-toggle" type="button" data-action="discovery-toggle">Turn On</button>
                <button id="discovery-refresh" type="button" data-action="discovery-refresh">Refresh</button>
              </div>
            </div>
            <div id="discovery-people" class="people-list-section" hidden>
              <div class="people-section-head">
                <h2>Public now</h2>
                <span id="discovery-visible-count" class="people-section-count" aria-live="polite">0</span>
              </div>
              <div id="discovery-list" class="people-list"></div>
            </div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./people.js?v=people-20261028b"></script>
</body>
</html>
