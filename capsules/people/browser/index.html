<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>People · ElastOS</title>
  <script src="./elastos-theme.js"></script>
  <link rel="stylesheet" href="./elastos-ui.css">
  <link rel="stylesheet" href="./style.css?v=people-20260812a">
</head>
<body>
  <section id="locked-shell" class="locked-shell hidden">
    <div class="locked-card">
      <p class="eyebrow">ElastOS</p>
      <h1>Open from Home</h1>
      <p>Open People from Home.</p>
    </div>
  </section>

  <main id="people-shell" class="people-shell hidden" aria-label="People">
    <aside class="people-sidebar" aria-label="People sections">
      <button class="people-sidebar-item active" type="button" data-section-target="people">
        <span class="people-sidebar-icon people-sidebar-icon-people" aria-hidden="true"></span>
        <span>People</span>
      </button>
      <button class="people-sidebar-item" type="button" data-section-target="discovery">
        <span class="people-sidebar-icon people-sidebar-icon-discovery" aria-hidden="true"></span>
        <span>Discovery</span>
      </button>
    </aside>

    <section class="people-main">
      <div class="people-content">
        <div class="people-content-inner">
          <h1 class="people-page-title">People</h1>
          <div id="people-status" class="people-status" role="status" hidden></div>

          <section id="people" class="people-section" aria-label="People">
            <section class="profile-card" aria-labelledby="profile-title">
              <div>
                <h2 id="profile-title">Create your Profile</h2>
                <p id="profile-description">Your Profile is your signed identity for People and Chat.</p>
              </div>
              <form id="profile-form" class="profile-form">
                <label for="profile-name">Display name</label>
                <input id="profile-name" type="text" maxlength="32" autocomplete="nickname" placeholder="Your name">
                <button id="profile-submit" type="submit">Create Profile</button>
              </form>
            </section>
            <div class="people-section-head">
              <h3 id="people-list-title">Contacts</h3>
              <span id="people-count" class="people-section-count" aria-live="polite">0 contacts</span>
            </div>
            <div id="people-list" class="people-list"></div>
          </section>

          <section id="discovery" class="people-section" aria-label="Discovery" hidden>
            <div class="discovery-header">
              <div>
                <p>Choose whether other people can find you and send connection requests.</p>
              </div>
              <div class="discovery-actions">
                <button id="discovery-toggle" type="button" data-action="discovery-toggle">Turn On</button>
                <button id="discovery-refresh" type="button" data-action="discovery-refresh">Refresh</button>
              </div>
            </div>
            <section class="profile-card" aria-labelledby="discovery-status-title">
              <div>
                <h3 id="discovery-status-title">Status</h3>
                <p id="discovery-status"></p>
              </div>
            </section>
            <div class="discovery-grid">
              <section class="people-list-section" aria-labelledby="discovery-visible-title">
                <div class="people-section-head">
                  <h3 id="discovery-visible-title">Visible people</h3>
                  <span id="discovery-visible-count" class="people-section-count" aria-live="polite">0 visible</span>
                </div>
                <div id="discovery-list" class="people-list"></div>
              </section>
              <section class="people-list-section" aria-labelledby="discovery-requests-title">
                <div class="people-section-head">
                  <h3 id="discovery-requests-title">Requests</h3>
                  <span id="discovery-requests-count" class="people-section-count" aria-live="polite">0 requests</span>
                </div>
                <div id="discovery-requests-list" class="people-list"></div>
              </section>
            </div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./people.js?v=people-20260805a"></script>
</body>
</html>
