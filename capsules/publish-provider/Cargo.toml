[package]
name = "publish-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS dDRM publish provider capsule — assembles the on-chain content mint (unsigned), capability-clean"
license = "MIT"

[[bin]]
name = "publish-provider"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]

[profile.release]
opt-level = "s"
lto = true

[workspace]
