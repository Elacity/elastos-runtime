[package]
name = "protected-content-decrypt-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS protected-content decrypt provider capsule"
license = "MIT"

[[bin]]
name = "protected-content-decrypt-provider"
path = "src/main.rs"

[dependencies]
elastos-protected-content-contracts = { path = "../../elastos/crates/elastos-protected-content-contracts" }
elastos-protected-content-custody = { path = "../../elastos/crates/elastos-protected-content-custody" }
elastos-protected-content-provider-contracts = { path = "../../elastos/crates/elastos-protected-content-provider-contracts" }
getrandom = "0.2"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
elastos-auth = { path = "../../elastos/crates/elastos-auth" }
ed25519-dalek = "2.1"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
tempfile = "3.12"
zeroize = "1"

[profile.release]
opt-level = "s"
lto = true

[workspace]
