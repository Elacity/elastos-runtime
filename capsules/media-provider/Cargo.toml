[package]
name = "media-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS protected-content media preparation provider capsule"
license = "MIT"

[[bin]]
name = "media-provider"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
elastos-protected-content-provider-contracts = { path = "../../elastos/crates/elastos-protected-content-provider-contracts" }
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true

[workspace]
