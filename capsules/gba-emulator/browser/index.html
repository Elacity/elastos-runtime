<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'none'; connect-src 'self'; img-src 'self' data:; style-src 'self'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>GBA Emulator - ElastOS</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=gba-20260724a">
</head>
<body>
  <main id="app-shell" class="shell">
    <section id="emulator-card" class="emulator-card">
      <section class="screen-card">
        <div id="screen-bezel" class="screen-frame">
          <div id="screen-container">
            <canvas id="canvas" width="240" height="160" tabindex="0" aria-label="Game screen"></canvas>
            <div id="drop-zone" role="button" tabindex="0" aria-label="Open Library to choose a GBA game">
              <div class="drop-zone-copy">
                <div class="icon">&#127918;</div>
                <p id="drop-zone-copy">Choose a game from Library</p>
              </div>
              <div id="rom-library" class="rom-library" hidden>
                <div class="rom-library-head">
                  <span>Installed ROMs</span>
                </div>
                <div id="rom-library-list" class="rom-library-list"></div>
              </div>
            </div>
          </div>
          <span id="power-led" class="off" aria-hidden="true"></span>
          <p id="status" class="screen-status" aria-live="polite" hidden></p>
        </div>

        <div id="controls-bar" class="touch-controls">
          <div class="shoulder-buttons">
            <button id="btn-l" class="shoulder-btn" data-key="l" aria-label="L button, keyboard A">
              <span class="button-label">L</span>
              <span class="key-hint">A</span>
            </button>
            <button id="btn-r" class="shoulder-btn" data-key="r" aria-label="R button, keyboard S">
              <span class="button-label">R</span>
              <span class="key-hint">S</span>
            </button>
          </div>

          <div class="controls-row">
            <div class="control-group">
              <button id="btn-dpad-up" class="dpad-btn" data-key="up" aria-label="D-pad up, keyboard Arrow Up">
                <span class="arrow">&#9650;</span>
              </button>
              <div class="dpad-row">
                <button id="btn-dpad-left" class="dpad-btn" data-key="left" aria-label="D-pad left, keyboard Arrow Left">
                  <span class="arrow">&#9664;</span>
                </button>
                <button id="btn-dpad-center" class="dpad-btn dpad-center" type="button" tabindex="-1" aria-hidden="true"></button>
                <button id="btn-dpad-right" class="dpad-btn" data-key="right" aria-label="D-pad right, keyboard Arrow Right">
                  <span class="arrow">&#9654;</span>
                </button>
              </div>
              <button id="btn-dpad-down" class="dpad-btn" data-key="down" aria-label="D-pad down, keyboard Arrow Down">
                <span class="arrow">&#9660;</span>
              </button>
            </div>

            <div class="center-buttons">
              <button id="btn-select" class="small-btn" data-key="select" aria-label="Select button, keyboard Backspace">
                <span class="button-label">Select</span>
                <span class="key-hint">Back</span>
              </button>
              <button id="btn-start" class="small-btn" data-key="start" aria-label="Start button, keyboard Enter">
                <span class="button-label">Start</span>
                <span class="key-hint">Enter</span>
              </button>
            </div>

            <div class="action-buttons">
              <button id="btn-b" class="action-btn" data-key="b" aria-label="B button, keyboard Z">
                <span class="button-label">B</span>
                <span class="key-hint">Z</span>
              </button>
              <button id="btn-a" class="action-btn" data-key="a" aria-label="A button, keyboard X">
                <span class="button-label">A</span>
                <span class="key-hint">X</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <aside class="utility-card">
        <div class="utility-card-head">
          <h2 class="utility-title">Options</h2>
        </div>
        <div id="utility-panel" class="utility-panel">
          <section class="utility-section">
            <div id="emulator-controls">
              <button id="btn-pause" class="icon-button" type="button" aria-label="Pause" title="Pause" disabled>
                <span class="icon-glyph" aria-hidden="true">❚❚</span>
              </button>
              <button id="btn-ff" class="icon-button" type="button" aria-label="Fast Forward" title="Fast Forward" disabled>
                <span class="icon-glyph" aria-hidden="true">≫</span>
              </button>
              <button id="btn-fullscreen" class="icon-button" type="button" aria-label="Fullscreen" title="Fullscreen">
                <span class="icon-glyph" aria-hidden="true">⛶</span>
              </button>
            </div>
            <div id="volume-group">
              <label for="volume-slider">Volume</label>
              <input type="range" id="volume-slider" min="0" max="100" value="50" aria-label="Volume">
            </div>
          </section>

          <section class="utility-section">
            <h2>States</h2>
            <div class="state-grid">
              <div class="state-slot">
                <div class="state-slot-head">
                  <span class="state-slot-name">Slot 1</span>
                  <span id="slot-status1" class="state-slot-status">Empty</span>
                </div>
                <div class="state-actions">
                  <button id="btn-save1" aria-label="Save state slot 1" disabled>Save</button>
                  <button id="btn-load1" aria-label="Load state slot 1" disabled>Load</button>
                </div>
              </div>
              <div class="state-slot">
                <div class="state-slot-head">
                  <span class="state-slot-name">Slot 2</span>
                  <span id="slot-status2" class="state-slot-status">Empty</span>
                </div>
                <div class="state-actions">
                  <button id="btn-save2" aria-label="Save state slot 2" disabled>Save</button>
                  <button id="btn-load2" aria-label="Load state slot 2" disabled>Load</button>
                </div>
              </div>
              <div class="state-slot">
                <div class="state-slot-head">
                  <span class="state-slot-name">Slot 3</span>
                  <span id="slot-status3" class="state-slot-status">Empty</span>
                </div>
                <div class="state-actions">
                  <button id="btn-save3" aria-label="Save state slot 3" disabled>Save</button>
                  <button id="btn-load3" aria-label="Load state slot 3" disabled>Load</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </aside>
    </section>
  </main>

  <script type="module" src="emulator.js?v=gba-20260724a"></script>
</body>
</html>
