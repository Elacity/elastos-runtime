[package]
name = "act-emitter"
version = "0.1.0"
edition = "2021"
description = "ElastOS spend/audit verification fixture: emits exactly N metered carrier_invoke acts"
license = "MIT"

[[bin]]
name = "act-emitter"
path = "src/main.rs"

[dependencies]
elastos-guest = { path = "../../elastos/crates/elastos-guest" }
serde_json = "1.0"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true

[workspace]
