<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive - ElastOS</title>
  <script src="./elastos-theme.js"></script>
  <link rel="stylesheet" href="./elastos-ui.css">
  <style>
    :root {
      --bg: var(--el-bg);
      --panel: var(--el-surface-raised);
      --panel-soft: var(--el-inset);
      --line: var(--el-hairline);
      --line-strong: var(--el-hairline-strong);
      --ink: var(--el-text);
      --muted: var(--el-muted);
      --accent: var(--el-accent);
      --accent-soft: var(--el-accent-faint);
      --brand: var(--el-brand);
      --good: var(--el-ok);
      --warn: var(--el-brand-strong);
      --danger: var(--el-danger);
      --mono: var(--el-font-mono);
      --archive-list-columns: 30px minmax(280px, 1fr) 92px 150px;
      font-family: var(--el-font);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--ink);
      background: var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    [hidden] {
      display: none !important;
    }

    .empty-state {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 28px;
      background: var(--bg);
    }

    .empty-card {
      width: min(380px, 100%);
      display: grid;
      justify-items: center;
      gap: 9px;
      padding: 18px;
      border: 0;
      border-radius: 0;
      background: var(--panel);
    }

    .empty-card p,
    .muted {
      color: var(--muted);
      line-height: 1.45;
    }

    .empty-actions {
      width: 100%;
      display: grid;
      gap: 9px;
      margin-top: 4px;
    }

    .journey-button {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
    }

    .journey-button strong {
      font-size: 0.94rem;
    }

    .journey-button span {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1;
    }

    .journey-button:hover {
      border-color: color-mix(in srgb, var(--accent) 45%, transparent);
      background: var(--accent-soft);
    }

    .shell {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      background: var(--panel);
    }

    .topbar {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .title-group,
    .top-actions {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-group {
      flex: 1 1 auto;
    }

    .top-actions {
      justify-content: flex-end;
      flex: 0 1 auto;
    }

    h1 {
      max-width: min(55vw, 720px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 1.34rem;
      letter-spacing: 0;
      line-height: 1.2;
    }

    h2 {
      font-size: 1rem;
      letter-spacing: 0;
    }

    h3 {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .search,
    .destination-input,
    .select {
      min-width: 0;
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--el-inset);
      padding: 7px 12px;
      color: var(--ink);
      outline: none;
      font-size: 0.84rem;
    }

    .search {
      width: 230px;
    }

    .search:focus,
    .destination-input:focus,
    .select:focus {
      border-color: color-mix(in srgb, var(--accent) 48%, transparent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--el-inset);
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      border-color: transparent;
      background: var(--el-lift);
    }

    .btn-primary {
      border-color: transparent;
      background: var(--el-accent);
      color: var(--el-accent-ink);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--el-accent-strong);
    }

    .btn:disabled {
      cursor: default;
      opacity: 0.48;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 25px;
      max-width: 190px;
      padding: 3px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-chip.safe {
      border-color: color-mix(in srgb, var(--good) 30%, transparent);
      background: color-mix(in srgb, var(--good) 12%, transparent);
      color: var(--good);
    }

    .status-chip.blocked {
      border-color: color-mix(in srgb, var(--warn) 30%, transparent);
      background: color-mix(in srgb, var(--warn) 14%, transparent);
      color: var(--warn);
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      overflow: hidden;
    }

    .list-panel {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border-right: 0.5px solid var(--line-strong);
    }

    .list-toolbar {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
      background: var(--bg);
    }

    .list-title {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .list-title strong {
      font-size: 0.92rem;
    }

    .list-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .content-pane {
      min-height: 0;
      overflow: auto;
      background: #fff;
    }

    .entry-head,
    .entry-row {
      display: grid;
      grid-template-columns: var(--archive-list-columns);
      align-items: center;
      min-width: 760px;
    }

    .entry-head {
      position: sticky;
      top: 0;
      z-index: 1;
      height: 30px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .entry-head span,
    .entry-row > * {
      min-width: 0;
      padding: 0 9px;
    }

    .entry-list {
      min-width: 760px;
    }

    .entry-row {
      min-height: 39px;
      border-bottom: 1px solid var(--line);
      background: transparent;
      cursor: default;
      user-select: none;
    }

    .entry-row:hover {
      background: var(--el-lift);
    }

    .entry-row.selected {
      background: var(--accent-soft);
    }

    .entry-row.blocked {
      color: var(--muted);
      background: color-mix(in srgb, var(--warn) 8%, transparent);
    }

    .entry-row:focus {
      outline: 2px solid var(--el-focus);
      outline-offset: -2px;
    }

    .entry-check {
      width: 15px;
      height: 15px;
      margin: 0;
    }

    .entry-name {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
    }

    .entry-icon {
      width: 16px;
      height: 16px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--panel-soft);
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 800;
    }

    .entry-title,
    .entry-cell,
    .value {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entry-title {
      font-size: 0.88rem;
    }

    .entry-cell {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .entry-row .status-chip {
      justify-self: start;
      min-height: 23px;
      padding: 3px 8px;
    }

    .entry-empty {
      margin: 0;
      min-width: 760px;
      padding: 52px 24px;
    }

    .archive-empty-list {
      display: grid;
      justify-items: center;
      gap: 8px;
      color: var(--muted);
      line-height: 1.45;
      text-align: center;
    }

    .archive-empty-list strong {
      color: var(--ink);
      font-size: 0.96rem;
    }

    .side-panel {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
      background: var(--bg);
    }

    .side-scroll {
      min-height: 0;
      display: grid;
      align-content: start;
      gap: 10px;
      padding: 10px;
      overflow: auto;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
      padding: 10px;
    }

    .card h2 {
      margin-bottom: 8px;
    }

    .preview-empty {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px dashed var(--line-strong);
      border-radius: 6px;
      background: var(--panel-soft);
    }

    .preview-body {
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.45;
    }

    .preview-body strong {
      color: var(--ink);
    }

    .preview-body pre {
      max-height: 260px;
      margin: 8px 0 0;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: var(--mono);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .extract-card {
      display: grid;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid var(--line);
      background: var(--panel-soft);
    }

    .root-picker {
      min-height: 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .root-picker button {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      padding: 4px 9px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .extract-controls {
      display: grid;
      gap: 7px;
    }

    .extract-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .details-grid {
      display: grid;
      gap: 8px;
    }

    .label {
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .value {
      font-family: var(--mono);
      font-size: 0.8rem;
    }

    @media (max-width: 980px) {
      .shell {
        overflow: auto;
      }

      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .title-group,
      .top-actions {
        width: 100%;
      }

      .search {
        width: 100%;
      }

      .workspace {
        grid-template-columns: 1fr;
        overflow: visible;
      }

      .list-panel {
        min-height: 60vh;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .side-panel {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <section id="empty-state" class="empty-state" hidden>
    <div class="empty-card">
      <p id="empty-status" class="muted" role="status"></p>
      <div class="empty-actions" aria-label="Archive actions">
        <button id="open-existing-archive" class="journey-button" type="button">
          <strong>Open archive</strong>
          <span aria-hidden="true">-></span>
        </button>
        <button id="make-new-archive" class="journey-button" type="button">
          <strong>New ZIP</strong>
          <span aria-hidden="true">-></span>
        </button>
      </div>
    </div>
  </section>

  <main id="archive-workspace" class="shell" hidden>
    <header class="topbar">
      <div class="title-group">
        <h1 id="title">Archive</h1>
      </div>
      <div class="top-actions">
        <button id="open-archive-button" class="btn" type="button">Open</button>
        <button id="new-archive-button" class="btn btn-primary" type="button">New ZIP</button>
        <input id="entry-search" class="search" type="search" placeholder="Search files" autocomplete="off">
      </div>
    </header>

    <section class="workspace">
      <section class="list-panel">
        <div class="list-toolbar">
          <div class="list-title">
            <strong>Files</strong>
          </div>
          <div class="list-actions">
            <button id="select-all-safe" class="btn" type="button" disabled>Select visible</button>
            <button id="clear-selection" class="btn" type="button" disabled>Clear</button>
            <span id="entries-pill" class="status-chip">Not loaded</span>
          </div>
        </div>
        <section class="content-pane" aria-label="Archive contents">
          <div class="entry-head" aria-hidden="true">
            <span></span>
            <span>Name</span>
            <span>Size</span>
            <span>Modified</span>
          </div>
          <div id="entry-list" class="entry-list">
            <p class="entry-empty">Archive files load when this format is supported.</p>
          </div>
        </section>
      </section>

      <aside class="side-panel">
        <div class="side-scroll">
          <section class="card" aria-live="polite">
            <h2>Preview</h2>
            <div id="entry-preview" class="preview-body">
              <div class="preview-empty">
                <strong>Select a file</strong>
                <span>Preview appears here.</span>
              </div>
            </div>
          </section>
        </div>

        <section class="extract-card">
          <h2>Extract</h2>
          <div id="destination-roots" class="root-picker" aria-label="Destination roots"></div>
          <div class="extract-controls">
            <input id="destination-uri" class="destination-input" type="text" placeholder="Extract to Library URI">
            <select id="conflict-policy" class="select" aria-label="If a file already exists">
              <option value="keep_both">Keep both if file exists</option>
              <option value="replace">Replace existing file</option>
              <option value="skip">Skip existing file</option>
            </select>
            <div class="extract-actions">
              <button id="extract-selected" class="btn btn-primary" type="button" disabled>Extract selected</button>
              <button id="extract-all" class="btn btn-primary" type="button" disabled>Extract all</button>
            </div>
          </div>
          <p id="extract-status" class="muted">Select files to extract.</p>
        </section>
      </aside>
    </section>
  </main>

  <script type="module" src="./archive-manager.js"></script>
</body>
</html>
