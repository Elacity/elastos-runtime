<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat Room</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body data-room-session-active="false">
  <script>
    const accessMode = new URLSearchParams(window.location.search).has("home_token")
      ? "shell"
      : "gateway";
    document.body.setAttribute("data-room-access-mode", accessMode);
  </script>
  <main id="app-shell" class="shell">
    <section id="chat-card" class="card chat-card chat-room-shell">
      <div id="participant-scrim" class="participant-scrim" hidden></div>
      <button id="participant-toggle" type="button" class="secondary participant-toggle chat-room-toggle">People</button>
      <section class="conversation-card">
        <section id="browser-access-stage" class="browser-access-stage">
          <div id="browser-access-status-row" class="status-row browser-access-status" hidden>
            <span id="status-badge" class="badge"></span>
            <span id="status-detail" class="detail"></span>
          </div>
          <div class="browser-access-copy">
            <h2>Join Chat Room</h2>
            <p class="copy">Enter your name to ask the room to let this browser in.</p>
          </div>
          <form id="browser-access-form" class="stack browser-access-form">
            <label>
              <span>Name</span>
              <input id="display-name" type="text" maxlength="48" autocomplete="nickname" placeholder="Guest" required />
            </label>
            <div class="browser-access-actions">
              <button id="browser-access-submit" type="submit">Ask to join</button>
              <button id="reset-button" type="button" class="secondary" hidden>Start over</button>
            </div>
          </form>
        </section>
        <p id="error-text" class="error" hidden></p>
        <ol id="message-list" class="messages"></ol>
        <div class="emoji-strip" aria-label="Quick emoji">
          <button id="emoji-wave" type="button" class="emoji-chip" aria-label="Wave" disabled>👋</button>
          <button id="emoji-fire" type="button" class="emoji-chip" aria-label="Fire" disabled>🔥</button>
          <button id="emoji-party" type="button" class="emoji-chip" aria-label="Party" disabled>🎉</button>
          <button id="emoji-clap" type="button" class="emoji-chip" aria-label="Clap" disabled>👏</button>
          <button id="emoji-heart" type="button" class="emoji-chip" aria-label="Heart" disabled>❤️</button>
          <button id="emoji-eyes" type="button" class="emoji-chip" aria-label="Eyes" disabled>👀</button>
        </div>
        <form id="composer-form" class="composer">
          <input id="message-input" type="text" maxlength="2000" autocomplete="off" placeholder="Say something" disabled />
          <div class="composer-actions">
            <button id="attach-button" type="button" class="secondary" disabled>Attach</button>
            <button id="send-button" type="submit" disabled>Send</button>
          </div>
        </form>
      </section>
      <section class="presence-card">
        <div class="roster-head">
          <h3 id="participant-count" class="roster-title">Opening room</h3>
          <div class="roster-actions">
            <button id="room-access-toggle" type="button" class="secondary room-access-toggle" aria-label="Access settings" title="Access settings" hidden>⚙</button>
            <button id="participant-close" type="button" class="secondary roster-close" hidden>Close</button>
          </div>
        </div>
        <ol id="participant-list" class="participants"></ol>
        <section id="browser-access-section" class="browser-access" hidden>
          <div class="browser-access-head">
            <h3 id="browser-access-count" class="browser-access-title">Join Requests · 0</h3>
          </div>
          <ol id="browser-access-list" class="browser-access-list"></ol>
        </section>
        <section id="room-access-section" class="room-access" hidden>
          <div class="room-access-head">
            <h3 class="room-access-title">Access</h3>
          </div>
          <div id="room-policy-list" class="room-policy-list"></div>
          <form id="node-invite-form" class="node-invite-form">
            <input id="node-did-input" type="text" autocomplete="off" placeholder="Runtime DID" aria-label="Runtime DID" />
            <button id="node-invite-submit" type="submit">Add</button>
          </form>
          <ol id="node-list" class="node-list"></ol>
        </section>
      </section>
    </section>
  </main>
  <script type="module">
    import init from "./chat_room_ui.js?v=chat-room-ui-20260426g";
    init(new URL("./chat_room_ui_bg.wasm?v=chat-room-ui-20260426g", import.meta.url));
  </script>
</body>
</html>
