<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat</title>
  <script src="./elastos-theme.js"></script>
  <link rel="stylesheet" href="./elastos-ui.css" />
  <link rel="stylesheet" href="./style.css?v=chat-room-20260930c" />
</head>
<body data-room-session-active="false">
  <script src="./chat-access.js"></script>
  <div id="participant-scrim" class="participant-scrim" hidden></div>
  <div id="chat-card" class="chat-shell chat-room-shell">
    <aside class="chat-sidebar" aria-label="Conversations">
      <div class="conversation-list-head">
        <h2>Chats</h2>
      </div>
      <nav id="conversation-selector" class="conversation-selector" aria-label="Conversations" hidden></nav>
    </aside>

    <main class="chat-thread">
      <header class="conversation-head">
        <div class="active-conversation">
          <span id="conversation-avatar" class="conversation-avatar" aria-hidden="true">#</span>
          <div class="active-conversation-copy">
            <h2 id="conversation-title">Community</h2>
            <p id="conversation-detail">Shared room</p>
          </div>
        </div>
        <button id="participant-toggle" type="button" class="secondary participant-toggle" aria-expanded="false">People</button>
      </header>
      <section class="conversation-surface">
        <section id="browser-access-stage" class="browser-access-stage">
          <div id="browser-access-status-row" class="status-row browser-access-status" hidden>
            <span id="status-badge" class="badge"></span>
            <span id="status-detail" class="detail"></span>
          </div>
          <div class="browser-access-copy">
            <h2>Open Chat from Home</h2>
            <p class="copy">Sign in to Home, then open Chat.</p>
          </div>
          <a id="chat-open-home" href="/home/" target="_self">Open Home</a>
        </section>
        <p id="error-text" class="error" hidden></p>
        <button id="reconnect-button" type="button" class="secondary reconnect" hidden>Reconnect</button>
        <ol id="message-list" class="messages"></ol>
        <form id="composer-form" class="composer">
          <button id="attach-button" type="button" class="composer-icon" aria-label="Attach" title="Attach" hidden disabled>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
          <div class="composer-field">
            <button id="emoji-toggle" type="button" class="composer-icon composer-emoji-toggle" aria-label="Emoji" aria-expanded="false" aria-controls="emoji-popover" title="Emoji">
              <span aria-hidden="true">😊</span>
            </button>
            <textarea id="message-input" rows="1" maxlength="2000" autocomplete="off" placeholder="Say something" disabled></textarea>
            <div id="emoji-popover" class="emoji-popover" hidden role="dialog" aria-label="Quick emoji">
              <button id="emoji-wave" type="button" class="emoji-chip" aria-label="Wave" disabled>👋</button>
              <button id="emoji-thumbsup" type="button" class="emoji-chip" aria-label="Thumbs up" disabled>👍</button>
              <button id="emoji-heart" type="button" class="emoji-chip" aria-label="Heart" disabled>❤️</button>
              <button id="emoji-joy" type="button" class="emoji-chip" aria-label="Joy" disabled>😂</button>
              <button id="emoji-fire" type="button" class="emoji-chip" aria-label="Fire" disabled>🔥</button>
              <button id="emoji-party" type="button" class="emoji-chip" aria-label="Party" disabled>🎉</button>
              <button id="emoji-clap" type="button" class="emoji-chip" aria-label="Clap" disabled>👏</button>
              <button id="emoji-eyes" type="button" class="emoji-chip" aria-label="Eyes" disabled>👀</button>
              <button id="emoji-pray" type="button" class="emoji-chip" aria-label="Thanks" disabled>🙏</button>
              <button id="emoji-sad" type="button" class="emoji-chip" aria-label="Sad" disabled>😢</button>
              <button id="emoji-think" type="button" class="emoji-chip" aria-label="Thinking" disabled>🤔</button>
              <button id="emoji-elephant" type="button" class="emoji-chip" aria-label="Elephant" disabled>🐘</button>
            </div>
          </div>
          <button id="send-button" type="submit" class="composer-send" disabled>Send</button>
        </form>
      </section>
    </main>

    <aside id="presence-card" class="chat-people presence-card" aria-label="Conversation details">
      <div class="roster-head">
        <h3 id="participant-count" class="roster-title">Opening conversation</h3>
        <div class="roster-actions">
          <button id="room-access-toggle" type="button" class="secondary room-access-toggle" aria-label="Access settings" title="Access settings" hidden>⚙</button>
          <button id="participant-close" type="button" class="secondary roster-close" hidden>Close</button>
        </div>
      </div>
      <ol id="participant-list" class="participants"></ol>
      <section id="participant-card" class="participant-card" role="dialog" aria-labelledby="participant-card-name" hidden>
        <button id="participant-card-close" type="button" class="participant-card-close" aria-label="Close">×</button>
        <div id="participant-card-avatar" class="participant-avatar participant-card-avatar" aria-hidden="true"></div>
        <h3 id="participant-card-name" class="participant-card-name"></h3>
        <p id="participant-card-state" class="participant-card-state" role="status"></p>
        <button id="participant-card-action" type="button" class="participant-card-action" hidden></button>
      </section>
      <section id="browser-access-section" class="browser-access" hidden>
        <div class="browser-access-head">
          <h3 id="browser-access-count" class="browser-access-title">Join Requests · 0</h3>
        </div>
        <ol id="browser-access-list" class="browser-access-list"></ol>
      </section>
      <section id="room-access-section" class="room-access" hidden>
        <div class="room-access-head">
          <h3 class="room-access-title">Access</h3>
        </div>
        <div id="room-policy-list" class="room-policy-list"></div>
        <section class="join-link-card">
          <div class="join-link-copy">
            <h4>Invite another person</h4>
            <p>Create a short-lived link that lets another ElastOS profile join this conversation.</p>
          </div>
          <button id="conversation-invite-create" type="button">Create join link</button>
          <div id="conversation-invite-output-row" class="join-link-output" hidden>
            <input id="conversation-invite-output" type="text" readonly aria-label="Conversation join link" />
            <button id="conversation-invite-copy" type="button" class="secondary">Copy</button>
          </div>
        </section>
        <ol id="node-list" class="node-list"></ol>
      </section>
    </aside>
  </div>
  <script type="module" src="./chat-room.js"></script>
  <script src="./chat-emoji.js"></script>
  <script src="./chat-chrome.js"></script>
</body>
</html>
