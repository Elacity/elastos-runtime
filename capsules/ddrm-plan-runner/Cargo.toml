[package]
name = "ddrm-plan-runner"
version = "0.1.0"
edition = "2021"
publish = false

# The runtime-core dDRM open-plan EXECUTOR (not a capability capsule, never shipped to
# wasm). Given a `DrmOpenPlanV1` emitted by drm-provider, it walks the declared steps in
# order, threads each binding edge (which step's artifact feeds which next-step field),
# and fails closed if a step runs out of order or fails to produce its declared artifact.
# It holds NO authority: the only thing that can touch a provider is the `StepRunner` the
# runtime injects. The CEK never appears here. See docs/convergence/SYSTEM_ARCHITECTURE_MAP.md.

[lib]
name = "ddrm_plan_runner"
path = "src/lib.rs"

[dependencies]
serde_json = "1.0"
