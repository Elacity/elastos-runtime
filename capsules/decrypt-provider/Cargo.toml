[package]
name = "decrypt-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS protected-content decrypt/render provider capsule"
license = "MIT"

[[bin]]
name = "decrypt-provider"
path = "src/main.rs"

[features]
# rail-prep: compile (and test) the in-boundary composition the Hybrid decrypt rail
# will wire once Anders confirms the CEK-transport rail
# (docs/convergence/DDRM_DECRYPT_RAIL.md): upstream CEK-sealing envelope unwrap ->
# decrypt-step cenc engine, colocated in this boundary. OFF by default (Parallel
# Change) so the live dispatch and the default test surface stay unchanged.
rail-prep = []
# pq-envelope: de-risking island for the runtime PQ-hybrid CEK-seal profile
# (x25519 + ml-kem-768 KEM -> AEAD-wrapped CEK; ml-dsa-65 signature behind an
# abstraction). The PQ analogue of the classical src/envelope.rs, proven to
# recover a CEK in Zeroizing and build to wasm32-wasip1. OFF by default; pulls the
# PQ crates only when enabled. See docs/convergence/DDRM_DECRYPT_RAIL.md §PQ.
pq-envelope = ["dep:ml-kem", "dep:x25519-dalek", "dep:aes-gcm", "dep:sha2"]
# pq-rail-prep: the full pre-rail dDRM data path proven end to end — PQ-hybrid
# unwrap (pq-envelope) -> cenc decrypt -> scoped output, CEK in Zeroizing
# throughout. Unifies the rail-prep composition (Day 18), in-boundary keygen
# (Day 19) and the PQ envelope (Day 20) into one cross-engine proof. OFF by
# default; enables pq-envelope. See docs/convergence/DDRM_DECRYPT_RAIL.md §PQ.
pq-rail-prep = ["pq-envelope"]
# rail-shim: the transport adapter from a sealed-CEK carrier (rail Option A) to
# the already-proven unwrap->cenc engines, for BOTH profiles (classical + PQ).
# A tested island, NOT wired into OpenSession/dispatch — the day Anders confirms
# the rail (DDRM_DECRYPT_RAIL.md) it becomes a flag flip. OFF by default.
rail-shim = ["rail-prep", "pq-rail-prep"]
# pq-mldsa: plug the REAL ML-DSA-65 (FIPS 204) signature primitive into the
# CekSealVerifier slot, replacing the test stub on the PQ rail. Verify-only in the
# decrypt boundary (the VM verifies the key authority's seal signature before
# unwrap). Pure-Rust, rng-free verify path -> builds to wasm32-wasip1. OFF by
# default (separate axis): the default build + base ladder stay byte-stable.
pq-mldsa = ["pq-envelope", "dep:ml-dsa"]
# vectors: replay the committed portable golden vectors (tests/vectors/) through
# the engines — substrate-independent proof that survives refactor/rebase/port and
# is replayable against PC2 (classical path is byte-identical to ddrm-decrypt).
# Enables pq-rail-prep so both classical and PQ paths compile. OFF by default.
vectors = ["pq-rail-prep"]
# gen-vectors: regenerate the committed golden vectors (writes tests/vectors/).
# Run manually: `cargo test --features gen-vectors emit_`. OFF by default.
gen-vectors = ["vectors"]

[dependencies]
elastos-common = { path = "../../elastos/crates/elastos-common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes = "0.8"
ctr = "0.9"
base64 = "0.22"
# dDRM CEK-sealing envelope (P-256 ECDH unwrap, AES-256-CBC) — see src/envelope.rs.
# Mirrors PC2 ddrm-decrypt so CEK recovery + content decryption stay colocated in
# this provider's wasm boundary (CEK never crosses FFI).
p256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic"] }
elliptic-curve = { version = "0.13", default-features = false, features = ["sec1"] }
cbc = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
zeroize = "1"
# PQ-hybrid CEK-seal profile (feature `pq-envelope`, optional). ml-kem (FIPS 203
# ML-KEM-768) + x25519 form the hybrid KEM; aes-gcm wraps the CEK; sha2 is the KDF
# that binds both shared secrets. Versions match the Day-15 wasm-viability proof.
ml-kem = { version = "0.2.3", optional = true }
x25519-dalek = { version = "2", features = ["static_secrets"], optional = true }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
# ML-DSA-65 (FIPS 204) signature — the shipped PQ-rail seal-signature primitive
# behind CekSealVerifier (feature `pq-mldsa`). Same RustCrypto family as ml-kem
# (consistent provenance/maintenance); deterministic from-seed keygen keeps the
# committed KAT reproducible. default-features off (no pkcs8/getrandom) — the
# decrypt boundary only verifies, so no RNG is pulled into the wasm build.
ml-dsa = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"

[profile.release]
opt-level = "s"
lto = true

[workspace]
