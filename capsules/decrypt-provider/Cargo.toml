[package]
name = "decrypt-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS protected-content decrypt/render provider capsule"
license = "MIT"

[[bin]]
name = "decrypt-provider"
path = "src/main.rs"

[dependencies]
elastos-common = { path = "../../elastos/crates/elastos-common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes = "0.8"
ctr = "0.9"
base64 = "0.22"

[dev-dependencies]

[profile.release]
opt-level = "s"
lto = true

[workspace]
