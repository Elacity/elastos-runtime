[package]
name = "decrypt-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS protected-content decrypt/render provider capsule"
license = "MIT"

[[bin]]
name = "decrypt-provider"
path = "src/main.rs"

[features]
# rail-prep: compile (and test) the in-boundary composition the Hybrid decrypt rail
# will wire once Anders confirms the CEK-transport rail
# (docs/convergence/DDRM_DECRYPT_RAIL.md): upstream CEK-sealing envelope unwrap ->
# decrypt-step cenc engine, colocated in this boundary. OFF by default (Parallel
# Change) so the live dispatch and the default test surface stay unchanged.
rail-prep = []

[dependencies]
elastos-common = { path = "../../elastos/crates/elastos-common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes = "0.8"
ctr = "0.9"
base64 = "0.22"
# dDRM CEK-sealing envelope (P-256 ECDH unwrap, AES-256-CBC) — see src/envelope.rs.
# Mirrors PC2 ddrm-decrypt so CEK recovery + content decryption stay colocated in
# this provider's wasm boundary (CEK never crosses FFI).
p256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic"] }
elliptic-curve = { version = "0.13", default-features = false, features = ["sec1"] }
cbc = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
zeroize = "1"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"

[profile.release]
opt-level = "s"
lto = true

[workspace]
