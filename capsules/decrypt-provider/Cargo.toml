[package]
name = "decrypt-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS protected-content decrypt/render provider capsule"
license = "MIT"

[[bin]]
name = "decrypt-provider"
path = "src/main.rs"

[features]
# rail-prep: compile (and test) the in-boundary composition the Hybrid decrypt rail
# will wire once Anders confirms the CEK-transport rail
# (docs/convergence/DDRM_DECRYPT_RAIL.md): upstream CEK-sealing envelope unwrap ->
# decrypt-step cenc engine, colocated in this boundary. OFF by default (Parallel
# Change) so the live dispatch and the default test surface stay unchanged.
rail-prep = []
# pq-envelope: de-risking island for the runtime PQ-hybrid CEK-seal profile
# (x25519 + ml-kem-768 KEM -> AEAD-wrapped CEK; ml-dsa-65 signature behind an
# abstraction). The PQ analogue of the classical src/envelope.rs, proven to
# recover a CEK in Zeroizing and build to wasm32-wasip1. OFF by default; pulls the
# PQ crates only when enabled. See docs/convergence/DDRM_DECRYPT_RAIL.md §PQ.
pq-envelope = ["dep:ml-kem", "dep:x25519-dalek", "dep:aes-gcm", "dep:sha2"]

[dependencies]
elastos-common = { path = "../../elastos/crates/elastos-common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes = "0.8"
ctr = "0.9"
base64 = "0.22"
# dDRM CEK-sealing envelope (P-256 ECDH unwrap, AES-256-CBC) — see src/envelope.rs.
# Mirrors PC2 ddrm-decrypt so CEK recovery + content decryption stay colocated in
# this provider's wasm boundary (CEK never crosses FFI).
p256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic"] }
elliptic-curve = { version = "0.13", default-features = false, features = ["sec1"] }
cbc = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
zeroize = "1"
# PQ-hybrid CEK-seal profile (feature `pq-envelope`, optional). ml-kem (FIPS 203
# ML-KEM-768) + x25519 form the hybrid KEM; aes-gcm wraps the CEK; sha2 is the KDF
# that binds both shared secrets. Versions match the Day-15 wasm-viability proof.
ml-kem = { version = "0.2.3", optional = true }
x25519-dalek = { version = "2", features = ["static_secrets"], optional = true }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"

[profile.release]
opt-level = "s"
lto = true

[workspace]
