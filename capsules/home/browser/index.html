<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="application-name" content="ElastOS Home" />
    <meta name="theme-color" content="#050608" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ElastOS Home" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Home · ElastOS</title>
    <link rel="manifest" href="./manifest.webmanifest?v=home-20260701c" />
    <link rel="icon" href="./elastos-home-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./elastos-home-icon-192.png" />
    <link
      rel="preload"
      href="./assets/fonts/Inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./style.css?v=home-20260701c" />
  </head>
  <body data-home-status="booting">
    <div class="desktop-shell">
      <div class="desktop-backdrop" data-overlay="false" aria-hidden="true"></div>

      <header class="toolbar" aria-label="System bar">
        <button id="toolbar-home" class="toolbar-btn toolbar-brand" type="button" aria-label="Go Home" title="ElastOS">
          <img src="./elastos-logo.svg" alt="" draggable="false" />
        </button>
        <span id="toolbar-active-title" class="toolbar-active-title">Home</span>
        <div class="toolbar-spacer"></div>
        <button
          id="toolbar-inbox"
          class="toolbar-btn inbox-btn"
          type="button"
          aria-label="Open inbox"
          title="Inbox"
        >
          <span id="toolbar-inbox-count" class="toolbar-inbox-count" hidden></span>
        </button>
        <div id="toolbar-identity" class="toolbar-identity" hidden>
          <button
            id="toolbar-identity-btn"
            class="toolbar-identity-btn"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="toolbar-identity-menu"
          >
            <span id="toolbar-identity-avatar" class="toolbar-identity-avatar" aria-hidden="true"></span>
            <span id="toolbar-identity-name" class="toolbar-identity-name"></span>
          </button>
          <div
            id="toolbar-identity-menu"
            class="toolbar-identity-menu"
            role="menu"
            aria-label="Account"
            hidden
          >
            <div class="toolbar-identity-header" role="presentation">
              Signed in as <strong id="toolbar-identity-menu-name"></strong>
            </div>
            <button id="identity-menu-fullscreen" class="toolbar-identity-item" type="button" role="menuitem">
              Enter fullscreen
            </button>
            <button id="identity-menu-system" class="toolbar-identity-item" type="button" role="menuitem">
              System
            </button>
            <div class="toolbar-identity-divider" role="separator"></div>
            <button id="identity-menu-sign-out" class="toolbar-identity-item" type="button" role="menuitem">
              Sign out
            </button>
          </div>
        </div>
        <div id="clock" class="toolbar-clock">--:--</div>
      </header>

      <main class="desktop-workspace">
        <section id="desktop" class="desktop" aria-live="polite">
          <section
            id="desktop-shortcuts"
            class="desktop-shortcuts"
            role="listbox"
            aria-label="Home items"
            aria-multiselectable="false"
            tabindex="0"
          ></section>
          <div id="window-snap-preview" class="window-snap-preview" aria-hidden="true" hidden></div>
        </section>
      </main>

      <footer class="taskbar" aria-label="Home taskbar">
        <div class="taskbar-inner">
          <div class="taskbar-primary">
            <button
              id="launcher-toggle"
              class="taskbar-item taskbar-item-launcher"
              type="button"
              aria-label="Open launcher"
              aria-controls="launcher"
              aria-expanded="false"
              data-label="Launcher"
            >
              <span class="taskbar-icon taskbar-icon-launcher"></span>
            </button>
            <div id="taskbar-targets" class="taskbar-sortable" aria-label="Taskbar items"></div>
          </div>
        </div>
      </footer>

      <aside id="launcher" class="launcher" aria-hidden="true" data-open="false" hidden>
        <div class="launcher-popover hide-scrollbar" role="dialog" aria-modal="true" aria-label="Home launcher">
          <button id="close-launcher" class="launcher-close" type="button" aria-label="Close launcher">
            <img src="./close.svg" alt="" draggable="false" />
          </button>
          <div class="launcher-search-wrap">
            <input
              id="launcher-search"
              class="launcher-search-field"
              type="search"
              autocomplete="off"
              placeholder="Search Home"
              spellcheck="false"
            />
          </div>
          <h1 class="launcher-heading">Open</h1>
          <div id="launcher-grid" class="launcher-sections"></div>
          <p id="launcher-empty-state" class="launcher-empty" hidden>No matching items</p>
        </div>
      </aside>

      <div id="desktop-context-menu" class="context-menu" role="menu" aria-label="Home actions" hidden></div>

      <section
        id="home-notification-toast"
        class="home-notification-toast"
        role="status"
        aria-live="assertive"
        aria-hidden="true"
        hidden
      >
        <div class="home-notification-copy">
          <strong id="home-notification-title">Wallet approval request</strong>
          <span id="home-notification-body">A capsule requests wallet approval.</span>
        </div>
        <div class="home-notification-actions">
          <button id="home-notification-action" class="home-notification-action" type="button">Review</button>
          <button
            id="home-notification-dismiss"
            class="home-notification-dismiss"
            type="button"
            aria-label="Dismiss notification"
          ></button>
        </div>
      </section>

      <section id="home-unlock" class="home-unlock" aria-labelledby="home-unlock-title" aria-hidden="true" hidden>
        <div class="home-unlock-card" role="dialog" aria-modal="true">
          <img class="home-unlock-logo" src="./elastos-logo.svg" alt="ElastOS" draggable="false" />
          <h1 id="home-unlock-title">Sign in</h1>
          <p id="home-unlock-copy">Use your passkey to unlock your data, apps and desktop.</p>
          <label class="visually-hidden" for="home-unlock-name">Name this passkey</label>
          <input
            id="home-unlock-name"
            class="home-unlock-input"
            type="text"
            maxlength="64"
            autocomplete="name"
            placeholder="Your name"
            hidden
          />
          <div class="home-unlock-actions">
            <button id="home-unlock-primary" class="home-unlock-button" type="button">Use passkey</button>
            <button id="home-unlock-secondary" class="home-unlock-button home-unlock-button-secondary" type="button" hidden>Create guest account</button>
          </div>
          <p id="home-unlock-status" class="home-unlock-status" data-tone="muted" role="status">One moment.</p>
        </div>
      </section>
    </div>

    <template id="window-template">
      <section class="window" role="dialog" aria-modal="false" aria-hidden="true">
        <div class="window-head">
          <div class="window-head-draggable">
            <span class="window-head-icon"></span>
            <span class="window-head-title"></span>
          </div>
          <button class="window-action-btn" data-action="minimize" type="button" aria-label="Minimize">
            <img src="./minimize.svg" alt="" draggable="false" />
          </button>
          <button class="window-action-btn" data-action="maximize" type="button" aria-label="Maximize">
            <img src="./scale.svg" alt="" draggable="false" />
          </button>
          <button class="window-action-btn" data-action="close" type="button" aria-label="Close">
            <img src="./close.svg" alt="" draggable="false" />
          </button>
        </div>
        <div class="window-body"></div>
        <div class="window-resize-handle window-resize-handle-n" data-resize="n" aria-hidden="true"></div>
        <div class="window-resize-handle window-resize-handle-e" data-resize="e" aria-hidden="true"></div>
        <div class="window-resize-handle window-resize-handle-s" data-resize="s" aria-hidden="true"></div>
        <div class="window-resize-handle window-resize-handle-w" data-resize="w" aria-hidden="true"></div>
        <div class="window-resize-handle window-resize-handle-ne" data-resize="ne" aria-hidden="true"></div>
        <div class="window-resize-handle window-resize-handle-nw" data-resize="nw" aria-hidden="true"></div>
        <div class="window-resize-handle window-resize-handle-se" data-resize="se" aria-hidden="true"></div>
        <div class="window-resize-handle window-resize-handle-sw" data-resize="sw" aria-hidden="true"></div>
      </section>
    </template>

    <template id="shortcut-template">
      <div class="desktop-shortcut" tabindex="-1" role="option" aria-selected="false">
        <span class="desktop-shortcut-icon app-glyph" aria-hidden="true"></span>
        <span class="desktop-shortcut-title"></span>
      </div>
    </template>

    <template id="launcher-item-template">
      <button class="launcher-card" type="button">
        <span class="launcher-card-body">
          <span class="app-glyph launcher-item-icon" aria-hidden="true"></span>
          <span class="launcher-card-title"></span>
        </span>
      </button>
    </template>

    <template id="window-error-template">
      <div class="window-error">
        <h3 class="window-error-title">Runtime data not attached on this host</h3>
        <p class="window-error-copy"></p>
        <dl class="window-error-facts">
          <div class="window-error-fact">
            <dt class="window-error-subject-label">Surface</dt>
            <dd class="window-error-subject-value">Home</dd>
          </div>
          <div class="window-error-fact">
            <dt>Detail</dt>
            <dd class="window-error-detail"></dd>
          </div>
        </dl>
      </div>
    </template>

    <template id="taskbar-item-template">
      <div class="taskbar-entry">
        <button class="taskbar-item" type="button">
          <span class="taskbar-icon">
            <span class="taskbar-item-icon"></span>
          </span>
          <span class="active-taskbar-indicator" aria-hidden="true"></span>
        </button>
        <button class="taskbar-window-count" type="button" hidden></button>
      </div>
    </template>

    <script type="module" src="./shell.js?v=home-20260701c"></script>
  </body>
</html>
