<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents · ElastOS</title>
<script src="./elastos-theme.js"></script>
<link rel="stylesheet" href="./elastos-ui.css">
<style>
:root {
  color-scheme: dark;
  font-family: var(--el-font);
  --bg: var(--el-bg);
  --panel: color-mix(in srgb, var(--el-surface) 94%, transparent);
  --panel-strong: color-mix(in srgb, var(--el-surface-raised) 96%, transparent);
  --panel-soft: color-mix(in srgb, var(--el-surface-raised) 84%, var(--el-accent-faint));
  --line: var(--el-hairline);
  --line-strong: var(--el-hairline-strong);
  --text: var(--el-text);
  --paper: var(--panel);
  --muted: var(--el-muted);
  --brand: var(--el-brand);
  --brand-soft: color-mix(in srgb, var(--el-brand) 14%, transparent);
  --accent: var(--el-accent);
  --accent-soft: var(--el-accent-soft);
  --accent-deep: var(--el-accent-strong);
  --warning: var(--el-danger);
  --danger: var(--el-danger);
  --sidebar-bg: color-mix(in srgb, var(--el-surface-raised) 92%, transparent);
  --sidebar-line: var(--el-hairline);
  --sidebar-text: var(--el-text);
  --sidebar-muted: var(--el-muted);
  --shadow: var(--el-shadow-2);
  --radius-xl: var(--el-radius-2xl);
  --radius-lg: var(--el-radius-xl);
  --radius-md: var(--el-radius-lg);
  --radius-sm: var(--el-radius-md);
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  font-family: inherit;
  color: var(--text);
  background: var(--bg);
}

button,
input,
textarea {
  font: inherit;
  color: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

a {
  color: inherit;
}

.page-shell {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  padding: 0.75rem;
}

.hidden {
  display: none !important;
}

.documents-shell {
  display: grid;
  grid-template-columns: 16.5rem minmax(0, 1fr);
  gap: 0.8rem;
  height: 100%;
  min-height: 0;
}

.documents-shell[data-sidebar-collapsed="true"] {
  grid-template-columns: minmax(0, 1fr);
}

.documents-shell[data-sidebar-collapsed="true"] .documents-sidebar {
  display: none;
}

.documents-sidebar,
.documents-main,
.share-sidebar,
.share-main {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow);
  backdrop-filter: blur(var(--el-blur-2));
}

.documents-sidebar,
.share-sidebar {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  padding: 0.8rem;
  background: var(--sidebar-bg);
  border-color: var(--line);
  color: var(--sidebar-text);
}

.sidebar-header,
.share-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.8rem;
}

.sidebar-title,
.share-title {
  margin: 0;
  font-size: var(--el-text-xl);
  font-weight: 700;
  letter-spacing: 0;
}

.sidebar-subtitle {
  margin: 0.35rem 0 0;
  color: var(--sidebar-muted);
  font-size: var(--el-text-md);
  line-height: 1.45;
}

.share-subtitle {
  margin: 0.35rem 0 0;
  color: var(--muted);
  font-size: var(--el-text-md);
  line-height: 1.45;
}

.sidebar-controls {
  display: flex;
  align-items: center;
  gap: 0.55rem;
}

.sidebar-create {
  display: inline-grid;
  width: 2.5rem;
  min-width: 2.5rem;
  height: 2.5rem;
  place-items: center;
  background: var(--accent);
  color: var(--el-accent-ink);
  border: 1px solid transparent;
  border-radius: var(--el-radius-lg);
  padding: 0;
  font-size: 1.25rem;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
}

.sidebar-search {
  flex: 1;
  min-width: 0;
  width: 100%;
  padding: 0.76rem 0.9rem;
  border: 1px solid var(--sidebar-line);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--el-surface-raised) 88%, transparent);
  color: var(--text);
  outline: none;
}

.sidebar-search::placeholder {
  color: var(--sidebar-muted);
}

.documents-list,
.share-doc-list {
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
  min-height: 0;
  margin-top: 0.75rem;
  overflow: auto;
  padding-right: 0.15rem;
  scrollbar-gutter: stable;
}

.document-list-item,
.share-doc-link {
  width: 100%;
  padding: 0.78rem 0.82rem;
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--el-surface-raised) 94%, transparent);
  border: 1px solid var(--line);
  text-align: left;
  transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
}

.document-list-item:hover,
.share-doc-link:hover {
  background: color-mix(in srgb, var(--el-surface-raised) 84%, var(--el-accent-faint));
  border-color: var(--line-strong);
  transform: translateY(-1px);
}

.document-list-item.active,
.share-doc-link.active {
  background: var(--accent-soft);
  border-color: var(--el-focus);
}

.document-list-item.published {
  background: color-mix(in srgb, var(--el-surface-raised) 84%, var(--accent-soft));
  border-color: color-mix(in srgb, var(--el-accent) 32%, transparent);
}

.document-list-item.published:hover,
.document-list-item.published.active {
  background: color-mix(in srgb, var(--el-surface-raised) 74%, var(--accent-soft));
  border-color: color-mix(in srgb, var(--el-accent) 42%, transparent);
}

.document-list-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.55rem;
}

.document-list-title,
.share-doc-title {
  display: block;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: var(--el-text-lg);
  font-weight: 600;
  letter-spacing: 0;
  color: var(--sidebar-text);
}

.document-list-meta,
.share-doc-meta {
  display: block;
  margin-top: 0.32rem;
  color: var(--sidebar-muted);
  font-size: var(--el-text-sm);
}

.document-list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.7rem;
  margin-top: 0.4rem;
}

.document-list-updated {
  color: var(--sidebar-muted);
  font-size: var(--el-text-xs);
}

.document-list-published-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.35rem;
  min-width: 1.35rem;
  height: 1.35rem;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-deep);
}

.document-list-published-icon svg {
  width: 0.86rem;
  height: 0.86rem;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2.2;
}

.sidebar-note {
  padding: 0.2rem 0.1rem;
  color: var(--sidebar-muted);
  font-size: 0.82rem;
  line-height: 1.5;
}

.documents-main,
.share-main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  height: 100%;
  padding: 1rem;
  background: var(--paper);
  overflow: hidden;
}

.documents-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding-bottom: 0.9rem;
  border-bottom: 1px solid var(--line);
}

.documents-identity {
  min-width: 0;
  flex: 1 1 auto;
}

.title-input {
  width: 100%;
  max-width: 32rem;
  padding: 0;
  border: 0;
  background: transparent;
  font-size: var(--el-text-display);
  font-weight: 700;
  letter-spacing: 0;
  outline: none;
}

.toolbar-actions {
  display: flex;
  align-items: center;
  gap: 0.42rem;
  flex-wrap: nowrap;
  justify-content: flex-end;
  flex: 0 0 auto;
  min-width: max-content;
}

.toolbar-group {
  display: inline-flex;
  align-items: center;
  gap: 0.42rem;
}

.toolbar-group.workspace-toggle {
  gap: 0.32rem;
  padding: 0.24rem;
}

.sidebar-toggle {
  min-width: 0;
}

.action-primary,
.action-secondary,
.action-link {
  border-radius: var(--el-radius-pill);
  padding: 0.68rem 1rem;
  font-size: var(--el-text-md);
  font-weight: 700;
  letter-spacing: 0;
}

.action-primary {
  background: var(--accent);
  color: var(--el-accent-ink);
}

.action-secondary {
  background: var(--panel-soft);
  border: 1px solid var(--line);
}

.action-icon-button {
  width: 2.35rem;
  height: 2.35rem;
  padding: 0;
  display: inline-grid;
  place-items: center;
  border-radius: var(--el-radius-lg);
}

.action-icon {
  width: 1.08rem;
  height: 1.08rem;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.copy-link-button {
  color: var(--accent-deep);
}

.copy-link-button:hover:not(:disabled),
.copy-link-button:focus-visible:not(:disabled) {
  background: var(--accent-soft);
  color: var(--accent-deep);
}

.action-danger {
  border-color: rgba(177, 76, 90, 0.22);
  color: var(--danger);
}

.action-danger:hover:not(:disabled),
.action-danger:focus-visible:not(:disabled) {
  background: rgba(177, 76, 90, 0.1);
}

.action-danger-solid {
  background: var(--danger);
  color: #fffaf9;
}

.action-danger-solid:hover:not(:disabled),
.action-danger-solid:focus-visible:not(:disabled) {
  background: #963846;
}

.action-link {
  background: transparent;
  color: var(--accent);
  padding-inline: 0.2rem;
}

.action-primary:disabled,
.action-secondary:disabled,
.action-link:disabled {
  opacity: 0.5;
  cursor: default;
}

.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.7rem;
  padding: 0.65rem 0 0.05rem;
  min-height: 2.15rem;
}

.status-text {
  color: var(--muted);
  font-size: var(--el-text-md);
}

.status-text.warning {
  color: var(--warning);
}

.find-bar {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  margin: 0 0 0.7rem;
  padding: 0.24rem 0.28rem 0.24rem 0.7rem;
  border: 1px solid var(--line);
  border-radius: var(--el-radius-pill);
  background: color-mix(in srgb, var(--el-surface-raised) 88%, transparent);
}

.find-input {
  flex: 1 1 auto;
  min-width: 0;
  border: 0;
  background: transparent;
  color: var(--text);
  outline: none;
}

.find-count {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: var(--el-text-sm);
}

.find-actions {
  display: inline-flex;
  align-items: center;
  gap: 0.32rem;
}

.documents-workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 0.8rem;
  flex: 1 1 auto;
  min-height: 0;
}

.documents-shell[data-workspace-view="write"] .documents-workspace,
.documents-shell[data-workspace-view="read"] .documents-workspace {
  grid-template-columns: minmax(0, 1fr);
}

.documents-shell[data-workspace-view="write"] .inspector-pane {
  display: none;
}

.documents-shell[data-workspace-view="read"] .editor-pane {
  display: none;
}

.workspace-toggle {
  display: inline-flex;
  gap: 0.32rem;
  margin: 0;
  width: fit-content;
  padding: 0.24rem;
  border-radius: var(--el-radius-pill);
  background: color-mix(in srgb, var(--el-surface-raised) 88%, transparent);
  border: 1px solid var(--line);
}

.workspace-tab {
  flex: 0 0 auto;
  width: 2.5rem;
  min-width: 2.5rem;
  height: 2.5rem;
  padding: 0;
  display: inline-grid;
  place-items: center;
  border-radius: var(--el-radius-pill);
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  font-size: var(--el-text-sm);
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

.workspace-tab.active {
  background: var(--accent-soft);
  border-color: var(--el-focus);
  color: var(--accent-deep);
}

.workspace-tab .action-icon {
  width: 1rem;
  height: 1rem;
}

.workspace-tab[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--el-focus);
  color: var(--accent-deep);
}

.inspector-pane {
  display: flex;
  flex-direction: column;
}

.pane-tabs {
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: nowrap;
  gap: 0.7rem;
  min-width: 0;
}

.pane-tab {
  padding: 0;
  border-radius: 0;
  background: transparent;
  color: var(--muted);
  font-size: var(--el-text-sm);
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1;
  text-transform: uppercase;
}

.pane-tab.active {
  color: var(--accent-deep);
}

.editor-pane,
.preview-pane {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  min-width: 0;
  overflow: hidden;
  backdrop-filter: blur(var(--el-blur-1));
}

.pane-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.6rem;
  padding: 0.72rem 0.85rem;
  border-bottom: 1px solid var(--line);
}

.inspector-pane .pane-header {
  align-items: center;
}

.pane-title {
  font-size: var(--el-text-sm);
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
  color: var(--muted);
}

.pane-note {
  color: var(--muted);
  font-size: var(--el-text-sm);
}

.task-item {
  list-style: none;
  margin-left: -1.25rem;
}

.task-item-label {
  display: inline-flex;
  align-items: flex-start;
  gap: 0.55rem;
}

.task-checkbox {
  margin: 0.18rem 0 0;
  accent-color: var(--accent);
}

.find-highlight {
  background: color-mix(in srgb, var(--el-brand) 42%, transparent);
  color: var(--text);
  border-radius: var(--el-radius-xs);
}

.find-highlight.active {
  background: color-mix(in srgb, var(--el-accent) 48%, transparent);
}

.editor {
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
  padding: 0.95rem 1rem 1.1rem;
  border: 0;
  resize: none;
  background: transparent;
  line-height: 1.65;
  outline: none;
}

.editor::placeholder {
  color: rgba(102, 112, 138, 0.78);
}

.preview-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 1.1rem 1.1rem 1.4rem;
}

.inspector-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 1rem;
}

.outline-list,
.history-list {
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}

.outline-item,
.history-item {
  padding: 0.8rem 0.9rem;
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--el-surface-raised) 94%, transparent);
  border: 1px solid var(--line);
}

.outline-item:hover,
.history-item:hover {
  background: color-mix(in srgb, var(--el-surface-raised) 84%, var(--el-accent-faint));
  border-color: var(--line-strong);
}

.outline-link {
  display: block;
  text-decoration: none;
  color: var(--text);
}

.outline-kicker,
.history-kicker {
  display: block;
  color: var(--muted);
  font-size: var(--el-text-xs);
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

.outline-title,
.history-title {
  display: block;
  margin-top: 0.18rem;
  font-size: 0.92rem;
  font-weight: 600;
}

.history-meta {
  display: block;
  margin-top: 0.22rem;
  color: var(--muted);
  font-size: 0.8rem;
}

.history-link {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  margin-top: 0.45rem;
  padding: 0;
  background: transparent;
  color: var(--accent);
  font-size: 0.82rem;
  font-weight: 700;
  text-decoration: none;
}

.history-link:hover,
.outline-link:hover {
  text-decoration: underline;
}

.share-shell {
  display: grid;
  grid-template-columns: 16.5rem minmax(0, 1fr);
  gap: 0.8rem;
  height: 100%;
  min-height: 0;
}

.share-main {
  padding: 0.95rem;
}

.share-topline {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
  margin-bottom: 0.75rem;
}

.share-token {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  min-width: 0;
  color: var(--muted);
  font-size: var(--el-text-sm);
}

.share-token strong {
  color: var(--text);
  font-weight: 600;
}

.share-token span {
  overflow: hidden;
  text-overflow: ellipsis;
}

.share-preview {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
}

.empty-state,
.loading-state,
.error-state {
  display: grid;
  place-items: center;
  min-height: 16rem;
  text-align: center;
  padding: 2rem;
  color: var(--muted);
}

.error-state {
  color: var(--danger);
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(29, 36, 56, 0.22);
  padding: 1rem;
  z-index: 30;
}

.modal-backdrop.open {
  display: flex;
}

.modal-card {
  width: min(100%, 28rem);
  background: color-mix(in srgb, var(--el-surface-raised) 96%, transparent);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 1.15rem;
  backdrop-filter: blur(var(--el-blur-2));
}

.modal-card h2 {
  margin: 0;
  font-size: var(--el-text-xl);
  letter-spacing: 0;
}

.modal-card p {
  margin: 0.45rem 0 0;
  color: var(--muted);
  line-height: 1.5;
}

.modal-fields {
  display: grid;
  gap: 0.8rem;
  margin-top: 1rem;
}

.modal-fields label {
  display: grid;
  gap: 0.35rem;
  font-size: var(--el-text-md);
  font-weight: 600;
}

.modal-fields input {
  width: 100%;
  padding: 0.8rem 0.85rem;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--el-surface-raised) 94%, transparent);
  color: var(--text);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 0.6rem;
  margin-top: 1rem;
}

.context-menu {
  position: fixed;
  z-index: 40;
  display: grid;
  gap: 0.2rem;
  min-width: 12rem;
  padding: 0.35rem;
  border: 1px solid var(--line-strong);
  border-radius: var(--el-radius-lg);
  background: color-mix(in srgb, var(--el-surface-raised) 96%, transparent);
  box-shadow: var(--el-shadow-2);
  backdrop-filter: blur(var(--el-blur-2));
}

.context-menu-item {
  width: 100%;
  padding: 0.62rem 0.7rem;
  border-radius: var(--el-radius-md);
  background: transparent;
  color: var(--text);
  text-align: left;
}

.context-menu-item:hover,
.context-menu-item:focus-visible {
  background: var(--accent-soft);
}

.context-menu-item.danger {
  color: var(--danger);
}

.markdown-body {
  line-height: 1.72;
  color: var(--text);
}

.markdown-body > :first-child {
  margin-top: 0;
}

.markdown-body h1,
.markdown-body h2,
.markdown-body h3,
.markdown-body h4,
.markdown-body h5,
.markdown-body h6 {
  margin: 1.4em 0 0.55em;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: 0;
}

.markdown-body h1 {
  font-size: 2rem;
  padding-bottom: 0.35rem;
  border-bottom: 1px solid var(--line);
}

.markdown-body h2 {
  font-size: 1.4rem;
  padding-bottom: 0.3rem;
  border-bottom: 1px solid var(--line);
}

.markdown-body h3 {
  font-size: 1.16rem;
}

.markdown-body p,
.markdown-body ul,
.markdown-body ol,
.markdown-body blockquote,
.markdown-body table,
.markdown-body pre {
  margin: 0 0 1rem;
}

.markdown-body ul,
.markdown-body ol {
  padding-left: 1.6rem;
}

.markdown-body a {
  color: var(--accent);
  text-decoration: none;
}

function escapeHtml(value) {
  return value
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;");
}

function renderInlineMarkdown(text) {
  return escapeHtml(text)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_match, label, href) => {
      return '<a href="' + safeMarkdownHref(href) + '" rel="noopener noreferrer">' + label + "</a>";
    });
}

function safeMarkdownHref(value) {
  const href = String(value || "").trim();
  if (/^(https?:\/\/|elastos:\/\/|localhost:\/\/|#|\/(?!\/)|\.{1,2}\/)/i.test(href)) {
    return href;
  }
  return "#";
}

function headingSlug(text, number) {
  const slug = String(text || "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
  return (slug || "section") + "-" + number;
}

function renderMarkdownDocument(source, options) {
  const interactiveTasks = !!(options && options.interactiveTasks);
  const lines = String(source || "").replace(/\r\n/g, "\n").split("\n");
  const blocks = [];
  const outline = [];
  let index = 0;
  let headingIndex = 0;

  while (index < lines.length) {
    const line = lines[index];

    if (/^```/.test(line)) {
      const language = line.slice(3).trim();
      const code = [];
      index += 1;
      while (index < lines.length && !/^```/.test(lines[index])) {
        code.push(escapeHtml(lines[index]));
        index += 1;
      }
      index += 1;
      blocks.push('<pre><code' + (language ? ' class="language-' + language + '"' : "") + ">" + code.join("\n") + "</code></pre>");
      continue;
    }

    if (/^(\*{3,}|-{3,}|_{3,})\s*$/.test(line)) {
      blocks.push("<hr>");
      index += 1;
      continue;
    }

    const heading = /^(#{1,6})\s+(.+)$/.exec(line);
    if (heading) {
      headingIndex += 1;
      const title = heading[2].trim();
      const id = headingSlug(title, headingIndex);
      blocks.push("<h" + heading[1].length + ' id="' + id + '">' + renderInlineMarkdown(title) + "</h" + heading[1].length + ">");
      outline.push({ depth: heading[1].length, title: title, id: id });
      index += 1;
      continue;
    }

    if (/^>\s?/.test(line)) {
      const quote = [];
      while (index < lines.length && /^>\s?/.test(lines[index])) {
        quote.push(renderInlineMarkdown(lines[index].replace(/^>\s?/, "")));
        index += 1;
      }
      blocks.push("<blockquote><p>" + quote.join("<br>") + "</p></blockquote>");
      continue;
    }

    if (/^[-*]\s+\[( |x|X)\]\s+/.test(line)) {
      const items = [];
      while (index < lines.length && /^[-*]\s+\[( |x|X)\]\s+/.test(lines[index])) {
        const taskLine = lines[index];
        const taskMatch = /^[-*]\s+\[( |x|X)\]\s+([\s\S]+)$/.exec(taskLine);
        const checked = !!taskMatch && String(taskMatch[1]).toLowerCase() === "x";
        const label = taskMatch ? taskMatch[2] : taskLine.replace(/^[-*]\s+/, "");
        const checkbox = interactiveTasks
          ? '<label class="task-item-label"><input class="task-checkbox" type="checkbox" aria-label="Toggle task completion" data-source-line="' + String(index) + '"' + (checked ? " checked" : "") + '><span>' + renderInlineMarkdown(label) + "</span></label>"
          : '<span>' + renderInlineMarkdown((checked ? "[x] " : "[ ] ") + label) + "</span>";
        items.push('<li class="task-item">' + checkbox + "</li>");
        index += 1;
      }
      blocks.push("<ul>" + items.join("") + "</ul>");
      continue;
    }

    if (/^[-*]\s+/.test(line)) {
      const items = [];
      while (index < lines.length && /^[-*]\s+/.test(lines[index])) {
        items.push("<li>" + renderInlineMarkdown(lines[index].replace(/^[-*]\s+/, "")) + "</li>");
        index += 1;
      }
      blocks.push("<ul>" + items.join("") + "</ul>");
      continue;
    }

    if (/^\d+\.\s+/.test(line)) {
      const items = [];
      while (index < lines.length && /^\d+\.\s+/.test(lines[index])) {
        items.push("<li>" + renderInlineMarkdown(lines[index].replace(/^\d+\.\s+/, "")) + "</li>");
        index += 1;
      }
      blocks.push("<ol>" + items.join("") + "</ol>");
      continue;
    }

    if (/^\|.*\|$/.test(line) && index + 1 < lines.length && /^\|?[\s:-]+\|[\s|:-]*$/.test(lines[index + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((cell) => "<th>" + renderInlineMarkdown(cell.trim()) + "</th>");
      index += 2;
      const rows = [];
      while (index < lines.length && /^\|.*\|$/.test(lines[index])) {
        const cells = lines[index].split("|").slice(1, -1).map((cell) => "<td>" + renderInlineMarkdown(cell.trim()) + "</td>");
        rows.push("<tr>" + cells.join("") + "</tr>");
        index += 1;
      }
      blocks.push("<table><thead><tr>" + headerCells.join("") + "</tr></thead><tbody>" + rows.join("") + "</tbody></table>");
      continue;
    }

    if (!line.trim()) {
      index += 1;
      continue;
    }

    const paragraph = [];
    while (index < lines.length && lines[index].trim() && !/^(#{1,6})\s+/.test(lines[index]) && !/^```/.test(lines[index]) && !/^>\s?/.test(lines[index]) && !/^[-*]\s+/.test(lines[index]) && !/^\d+\.\s+/.test(lines[index]) && !/^(\*{3,}|-{3,}|_{3,})\s*$/.test(lines[index])) {
      paragraph.push(renderInlineMarkdown(lines[index]));
      index += 1;
    }
    if (!paragraph.length) {
      blocks.push("<p>" + renderInlineMarkdown(line) + "</p>");
      index += 1;
      continue;
    }
    blocks.push("<p>" + paragraph.join("<br>") + "</p>");
  }

  return {
    html: blocks.join("\n"),
    outline: outline,
  };
}

function shortCid(cid) {
  if (!cid) {
    return "";
  }
  if (cid.length <= 18) {
    return cid;
  }
  return cid.slice(0, 10) + "…" + cid.slice(-6);
}

function documentUri(docDid) {
  return docDid ? "localhost://ElastOS/Documents/" + docDid : "";

function documentIdentity(document) {
  if (!document) {
    return "";
  }
  if (isLibraryFileProjection(document)) {
    return "library:" + String(document.library_object_uri || document.document_uri || document.working_copy_uri || "");
  }
  if (document.doc_did) {
    return "document:" + String(document.doc_did);
  }
  return "draft";
}

function baseName(uri) {
  const clean = String(uri || "").replace(/\/+$/, "");
  const name = clean.split("/").pop() || "Document";
  try {
    return decodeURIComponent(name);
  } catch (_error) {
    return name;
  }
}

function formatBytes(bytes) {
  const value = Number(bytes || 0);
  if (!Number.isFinite(value) || value <= 0) {
    return "0 B";
  }
  const units = ["B", "KB", "MB", "GB"];
  let amount = value;
  let unitIndex = 0;
  while (amount >= 1024 && unitIndex < units.length - 1) {
    amount /= 1024;
    unitIndex += 1;
  }
  return (unitIndex === 0 ? String(amount) : amount.toFixed(amount >= 10 ? 1 : 2)) + " " + units[unitIndex];
}

function looksLikeTextContent(contentType, buffer) {
  const lower = String(contentType || "").toLowerCase();
  if (
    lower.startsWith("text/") ||
    lower.includes("json") ||
    lower.includes("markdown") ||
    lower.includes("xml") ||
    lower.includes("javascript")
  ) {
    return true;
  }
  const bytes = new Uint8Array(buffer);
  if (bytes.length === 0) {
    return true;
  }
  const sample = bytes.subarray(0, Math.min(bytes.length, 4096));
  if (sample.includes(0)) {
    return false;
  }
  try {
    new TextDecoder("utf-8", { fatal: true }).decode(sample);
    return true;
  } catch (_error) {
    return false;
  }
}

function isTextMimeType(mime) {
  const lower = String(mime || "").toLowerCase();
  return lower.startsWith("text/") ||
    lower.includes("json") ||
    lower.includes("markdown") ||
    lower.includes("xml") ||
    lower.includes("javascript");
}

function dataUrlToUtf8(dataUrl) {
  const value = String(dataUrl || "");
  const match = /^data:([^;,]*)(;base64)?,([\s\S]*)$/i.exec(value);
  if (!match) {
    throw new Error("Chat attachment payload is not a data URL.");
  }
  if (match[2]) {
    return base64ToUtf8(match[3] || "");
  }
  return decodeURIComponent(match[3] || "");
}

function isLibraryFileProjection(document) {
  return !!document && !!document.library_object_uri;
}

function isDraftDocument(document) {
  return !!document && !document.doc_did && !isLibraryFileProjection(document);
}

function createDraftDocument() {
  return {
    doc_did: "",
    document_uri: "",
    title: "",
    file_name: "",
    working_copy_uri: "",
    body: "",
    created_at: 0,
    updated_at: 0,
    latest_published_cid: null,
    publish_history: [],
  };
}

function formatTime(timestamp) {
  if (!timestamp) {
    return "";
  }
  return new Date(timestamp * 1000).toLocaleString(undefined, {
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function preferredWorkspaceView(view) {
  return view === "read" ? "read" : view === "split" ? "split" : "write";
}

function clearStatusTimer() {
  if (statusClearTimerId) {
    window.clearTimeout(statusClearTimerId);
    statusClearTimerId = 0;
  }
}

function scheduleStatusClear(delay = 1600) {
  clearStatusTimer();
  statusClearTimerId = window.setTimeout(() => {
    if (!state.dirty) {
      clearStatus();
    }
  }, delay);
}

function clearStatus() {
  clearStatusTimer();
  elements.statusText.textContent = "";
  elements.statusText.className = "status-text";
  elements.statusRow.classList.add("hidden");
}

function clearAutosaveTimer() {
  if (autosaveTimerId) {
    window.clearTimeout(autosaveTimerId);
    autosaveTimerId = 0;
  }
}

function resetPendingSaveIntent() {
  clearAutosaveTimer();
  autosaveQueued = false;
}

function replaceCurrentDocument(document) {
  resetPendingSaveIntent();
  state.current = document;
  state.currentSessionId += 1;
}

function isCurrentSessionTarget(target) {
  return !!target && state.currentSessionId === target.sessionId;
}

function isCurrentDocumentTarget(target) {
  return isCurrentSessionTarget(target) && documentIdentity(state.current) === target.identity;
}

function scheduleAutosave() {
  clearAutosaveTimer();
  if (!state.current || state.mode !== "shell" || !state.dirty) {
    return;
  }
  autosaveTimerId = window.setTimeout(() => {
    void saveCurrent({ quiet: true, autosave: true }).catch((error) => {
      reportSaveFailure(error, "Autosave failed.");
    });
  }, 900);
}

function reportSaveFailure(error, fallback) {
  setStatus(readableDocumentsError(error, fallback), "warning");
}

function canAnnounceHomeChrome() {
  return !!state.homeToken && !!homeOrigin && window.top !== window;
}

function buildHomeMenuManifest() {
  return {
    menus: [
      {
        title: "File",
        items: [
          { label: "New Document", cmd: "file-new-document" },
          { label: "Save", cmd: "file-save" },
          { label: "Save As", cmd: "file-save-as" },
          { label: "Publish", cmd: "file-publish" },
          { label: "Delete Document", cmd: "file-delete-document" },
          { label: "Close Window", cmd: "__close-window" },
        ],
      },
      {
        title: "View",
        items: [
          { label: "Write", cmd: "view-write" },
          { label: "Split", cmd: "view-split" },
          { label: "Read", cmd: "view-read" },
          { label: "Find", cmd: "view-find" },
        ],
      },
    ],
  };
}

function syncHomeMenuManifest() {
  if (!canAnnounceHomeChrome() || !homeChromeReady) {
    return;
  }
  const manifest = buildHomeMenuManifest();
  const signature = JSON.stringify(manifest);
  if (signature === lastHomeMenuManifestSignature) {
    return;
  }
  lastHomeMenuManifestSignature = signature;
  window.top.postMessage({
    type: "home:menu-manifest",
    homeToken: state.homeToken,
    ...manifest,
  }, homeOrigin);
}

function announceHomeChrome() {
  if (!canAnnounceHomeChrome() || homeChromeReady) {
    return;
  }
  window.top.postMessage({ type: "home:app-ready", homeToken: state.homeToken }, homeOrigin);
  homeChromeReady = true;
