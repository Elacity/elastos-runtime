<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents · ElastOS</title>
<script src="./elastos-theme.js"></script>
<script src="./elastos-drawer.js"></script>
<link rel="stylesheet" href="./elastos-ui.css">
<style>
:root {
  color-scheme: dark;
  font-family: var(--el-font);
  --bg: var(--el-bg);
  --bg-strong: var(--el-surface);
  --panel: color-mix(in srgb, var(--el-surface) 94%, transparent);
  --panel-strong: color-mix(in srgb, var(--el-surface-raised) 96%, transparent);
  --panel-soft: color-mix(in srgb, var(--el-surface-raised) 84%, var(--el-accent-faint));
  --line: var(--el-hairline);
  --line-strong: var(--el-hairline-strong);
  --text: var(--el-text);
  --ink: var(--text);
  --paper: var(--bg);
  --muted: var(--el-muted);
  --brand: var(--el-brand);
  --brand-soft: color-mix(in srgb, var(--el-brand) 14%, transparent);
  --accent: var(--el-accent);
  --accent-soft: var(--el-accent-soft);
  --accent-deep: var(--el-accent-strong);
  --warning: var(--el-danger);
  --danger: var(--el-danger);
  --sidebar-bg: color-mix(in srgb, var(--el-surface-raised) 92%, transparent);
  --sidebar-panel: var(--panel-strong);
  --sidebar-line: var(--line);
  --sidebar-text: var(--ink);
  --sidebar-muted: var(--muted);
  --shadow: none;
  --radius-xl: 0;
  --radius-lg: 10px;
  --radius-md: 10px;
  --radius-sm: 999px;
}

:root[data-el-theme="light"] {
  --bg-strong: #e8eaef;
  --panel: rgba(255, 255, 255, 0.9);
  --sidebar-bg: #f0f1f4;
  --brand-soft: #fff1dc;
  color-scheme: light;
}

:root[data-el-theme="light"] body {
  background: var(--bg);
}

:root[data-el-theme="light"] .documents-sidebar,
:root[data-el-theme="light"] .share-sidebar {
  background: color-mix(in srgb, var(--sidebar-bg) 90%, transparent);
}

:root[data-el-theme="light"] .document-list-item:hover,
:root[data-el-theme="light"] .share-doc-link:hover,
:root[data-el-theme="light"] .outline-item:hover,
:root[data-el-theme="light"] .history-item:hover {
  background: var(--el-lift);
}

:root[data-el-theme="light"] .document-list-item.active,
:root[data-el-theme="light"] .share-doc-link.active {
  background: var(--el-lift-strong);
  color: var(--el-accent);
}

:root[data-el-theme="light"] .view-toggle-button.active,
.workspace-tab.active,
.workspace-tab[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: rgba(95, 118, 216, 0.18);
}

:root[data-el-theme="light"] .document-list-item.published {
  background: color-mix(in srgb, var(--el-accent-soft) 70%, transparent);
}

:root[data-el-theme="light"] .document-list-item.published:hover,
:root[data-el-theme="light"] .document-list-item.published.active {
  background: var(--el-lift-strong);
}

:root[data-el-theme="light"] .document-list-published-icon {
  background: rgba(95, 118, 216, 0.14);
}

:root[data-el-theme="light"] .action-danger {
  border-color: rgba(177, 76, 90, 0.22);
}

:root[data-el-theme="light"] .action-danger:hover:not(:disabled),
:root[data-el-theme="light"] .action-danger:focus-visible:not(:disabled) {
  background: rgba(177, 76, 90, 0.1);
}

:root[data-el-theme="light"] .action-danger-solid {
  color: #fffaf9;
}

:root[data-el-theme="light"] .action-danger-solid:hover:not(:disabled),
:root[data-el-theme="light"] .action-danger-solid:focus-visible:not(:disabled) {
  background: #963846;
}

:root[data-el-theme="light"] .modal-backdrop {
  background: rgba(29, 36, 56, 0.22);
}

:root[data-el-theme="light"] .markdown-body code,
:root[data-el-theme="light"] .markdown-body pre,
:root[data-el-theme="light"] .markdown-body th {
  background: rgba(83, 103, 164, 0.08);
}

:root[data-el-theme="light"] .markdown-body pre code {
  background: transparent;
}

:root[data-el-theme="light"] .markdown-body blockquote {
  border-left-color: rgba(95, 118, 216, 0.28);
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  min-height: 100%;
}

body {
  margin: 0;
  font-family: inherit;
  color: var(--text);
  background: var(--bg);
}

button,
input,
textarea {
  font: inherit;
  color: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

a {
  color: inherit;
}

.page-shell {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: var(--bg);
}

.hidden {
  display: none !important;
}

/* Apps-level blend: flex/grid split; sidebar owns lights safe-top. */
.documents-shell,
.share-shell {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  gap: 0;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  background: var(--bg);
}

/* Collapsed: keep leading chrome column so traffic lights stay over material.
   The phone drawer always shows the list, whatever the desktop chose. */
:root:not([data-el-form-factor="phone"]) .documents-shell[data-sidebar-collapsed="true"] {
  grid-template-columns: 220px minmax(0, 1fr);
}

:root:not([data-el-form-factor="phone"]) .documents-shell[data-sidebar-collapsed="true"] .sidebar-search,
:root:not([data-el-form-factor="phone"]) .documents-shell[data-sidebar-collapsed="true"] .documents-list {
  display: none;
}

.documents-sidebar,
.share-sidebar {
  --sidebar-compose-size: 2rem;
  --sidebar-compose-gap: 0.55rem;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  padding: var(--window-chrome-safe-top, 52px) 12px 16px;
  background: color-mix(in srgb, var(--sidebar-bg) 78%, transparent);
  border: 0;
  border-right: 1px solid color-mix(in srgb, var(--el-hairline) 70%, transparent);
  border-radius: 0;
  box-shadow: none;
  color: var(--sidebar-text);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
}

.documents-main,
.share-main {
  --documents-toolbar-band: 14px;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  height: 100%;
  padding: var(--documents-toolbar-band) 18px 16px;
  overflow: hidden;
  background: var(--bg);
  border: 0;
  border-radius: 0;
  box-shadow: none;
}

/* Share without list: one column; clear traffic-light overlay on the page. */
.share-shell:has(> .share-sidebar.hidden) {
  grid-template-columns: minmax(0, 1fr);
}

.share-shell:has(> .share-sidebar.hidden) .share-main {
  padding-top: var(--window-chrome-safe-top, 52px);
  padding-left: 78px;
}

.sidebar-header,
.share-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.8rem;
}

.sidebar-title,
.share-title {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0;
}

.sidebar-subtitle {
  margin: 0.35rem 0 0;
  color: var(--sidebar-muted);
  font-size: 0.9rem;
  line-height: 1.45;
}

.share-subtitle {
  margin: 0.35rem 0 0;
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.45;
}

.sidebar-controls {
  display: flex;
  align-items: center;
  gap: var(--sidebar-compose-gap);
}

.sidebar-create {
  display: inline-grid;
  width: var(--sidebar-compose-size);
  min-width: var(--sidebar-compose-size);
  height: var(--sidebar-compose-size);
  place-items: center;
  background: var(--accent);
  color: #f8fbff;
  border: 1px solid transparent;
  border-radius: 999px;
  padding: 0;
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
}

.sidebar-search {
  flex: 1;
  min-width: 0;
  width: 100%;
  padding: 0.55rem 0.85rem;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--el-inset);
  color: var(--text);
  outline: none;
}

.sidebar-search:focus {
  border-color: var(--el-focus);
  box-shadow: 0 0 0 3px rgba(246, 146, 26, 0.15);
}

.sidebar-search::placeholder {
  color: var(--sidebar-muted);
}

.documents-list,
.share-doc-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-height: 0;
  margin-top: 0.65rem;
  overflow: auto;
  /* Full row width: left of New note (+) through right of search. */
  padding: 0;
}

.documents-list-section {
  margin: 0.55rem 0 0.2rem;
  color: var(--sidebar-muted);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

.document-list-marks {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  flex: 0 0 auto;
}

.document-list-pin-icon {
  flex: 0 0 auto;
  width: 0.85rem;
  height: 0.85rem;
  color: var(--sidebar-muted);
}

.document-list-pin-icon svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.context-menu {
  position: fixed;
  z-index: 80;
  min-width: 198px;
  max-width: calc(100vw - 16px);
  border: 1px solid var(--el-hairline-strong, var(--line));
  border-radius: 10px;
  background: rgba(30, 32, 38, 0.98);
  box-shadow: var(--el-shadow-2, 0 12px 40px rgba(0, 0, 0, 0.28));
  padding: 5px 0;
  color: var(--text);
  user-select: none;
}

:root[data-el-theme="light"] .context-menu {
  background: rgba(248, 248, 250, 0.98);
}

.context-menu.hidden {
  display: none;
}

.context-menu .menu-item {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  width: 100%;
  border: 0;
  border-radius: 0;
  background: transparent;
  min-height: 1.7rem;
  padding: 0.28rem 0.85rem;
  cursor: default;
  text-align: left;
  font: inherit;
  font-size: 0.88rem;
  color: inherit;
}

.context-menu .menu-item:hover:not(:disabled) {
  background: #0a84ff;
  color: #fff;
}

.context-menu .menu-item:disabled {
  opacity: 0.45;
}

.context-menu .menu-item-icon {
  flex: 0 0 auto;
  width: 0.95rem;
  height: 0.95rem;
  opacity: 0.9;
}

.context-menu .menu-item-icon svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.context-menu .menu-item-label {
  min-width: 0;
  flex: 1 1 auto;
}

.context-menu .menu-divider {
  height: 1px;
  margin: 4px 8px;
  background: var(--line);
}

.document-list-item,
.share-doc-link {
  width: 100%;
  padding: 0.55rem 0.75rem;
  /* Row highlight — not a capsule; pills stay on search/create only. */
  border-radius: 10px;
  background: transparent;
  border: 1px solid transparent;
  text-align: left;
  transition: background 140ms ease, color 140ms ease;
}

.document-list-item:hover,
.share-doc-link:hover {
  background: var(--el-lift);
}

.document-list-item.active,
.share-doc-link.active {
  background: var(--el-lift-strong);
  color: var(--el-accent);
}

.document-list-item.active .document-list-title,
.share-doc-link.active .share-doc-title {
  color: var(--el-accent);
  font-weight: 600;
}

.document-list-item.published {
  background: color-mix(in srgb, var(--el-accent-soft) 55%, transparent);
}

.document-list-item.published:hover,
.document-list-item.published.active {
  background: var(--el-lift-strong);
}

.document-list-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.55rem;
}

.document-list-title,
.share-doc-title {
  display: block;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 0.98rem;
  font-weight: 600;
  letter-spacing: 0;
  color: var(--sidebar-text);
}

.document-list-meta,
.share-doc-meta {
  display: block;
  margin-top: 0.32rem;
  color: var(--sidebar-muted);
  font-size: 0.82rem;
}

.document-list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.7rem;
  margin-top: 0.4rem;
}

.document-list-updated {
  color: var(--sidebar-muted);
  font-size: 0.77rem;
}

.document-list-published-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.35rem;
  min-width: 1.35rem;
  height: 1.35rem;
  border-radius: 999px;
  background: rgba(125, 149, 240, 0.2);
  color: var(--accent-deep);
}

.document-list-published-icon svg {
  width: 0.86rem;
  height: 0.86rem;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2.2;
}

.sidebar-note {
  padding: 0.2rem 0.1rem;
  color: var(--sidebar-muted);
  font-size: 0.82rem;
  line-height: 1.5;
}

.documents-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  /* Match main top inset so title/actions sit centered above Write. */
  padding-bottom: var(--documents-toolbar-band);
}

.documents-identity {
  min-width: 0;
  flex: 1 1 auto;
}

.title-input {
  width: 100%;
  max-width: 32rem;
  padding: 0;
  border: 0;
  background: transparent;
  font-size: clamp(1.45rem, 2.6vw, 2rem);
  font-weight: 700;
  letter-spacing: 0;
  outline: none;
}

.toolbar-actions {
  display: flex;
  align-items: center;
  gap: 0.42rem;
  flex-wrap: nowrap;
  justify-content: flex-end;
  flex: 0 0 auto;
  min-width: max-content;
}

.sidebar-toggle {
  min-width: 0;
}

.action-primary,
.action-secondary,
.action-link {
  border-radius: 999px;
  padding: 0.68rem 1rem;
  font-size: 0.92rem;
  font-weight: 700;
}

.action-primary {
  background: var(--accent);
  color: #f8fbff;
}

.action-secondary {
  background: var(--panel-soft);
  border: 1px solid var(--line);
}

.action-icon-button {
  width: 2.35rem;
  height: 2.35rem;
  padding: 0;
  display: inline-grid;
  place-items: center;
  border-radius: 0.85rem;
}

.action-icon {
  width: 1.08rem;
  height: 1.08rem;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.copy-link-button {
  display: inline-flex;
  align-items: center;
  gap: 0.42rem;
  min-height: 2.35rem;
  padding: 0 0.82rem;
  color: var(--accent-deep);
}

.copy-link-button .action-icon {
  width: 1rem;
  height: 1rem;
}

.action-danger {
  border-color: rgba(255, 143, 143, 0.35);
  color: var(--danger);
}

.action-danger:hover:not(:disabled),
.action-danger:focus-visible:not(:disabled) {
  background: rgba(255, 143, 143, 0.12);
}

.action-danger-solid {
  background: var(--danger);
  color: #2a1215;
}

.action-danger-solid:hover:not(:disabled),
.action-danger-solid:focus-visible:not(:disabled) {
  background: #ff9f9f;
}

.action-link {
  background: transparent;
  color: var(--accent);
  padding-inline: 0.2rem;
}

.action-primary:disabled,
.action-secondary:disabled,
.action-link:disabled {
  opacity: 0.5;
  cursor: default;
}

.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.7rem;
  padding: 0.35rem 0 0.05rem;
  min-height: 0;
}

.status-row[hidden] {
  display: none;
}

.status-text {
  color: var(--muted);
  font-size: 0.88rem;
}

.status-text.warning {
  color: var(--warning);
}

.find-bar {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  margin: 0 0 0.55rem;
  padding: 0.35rem 0.45rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--el-inset);
}

.find-bar[hidden] {
  display: none;
}

.find-input {
  flex: 1 1 auto;
  min-width: 0;
  border: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 0.92rem;
  outline: none;
}

.find-count {
  flex: 0 0 auto;
  min-width: 2.6rem;
  color: var(--muted);
  font-size: 0.78rem;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.find-actions {
  display: inline-flex;
  align-items: center;
  gap: 0.32rem;
}

.find-highlight {
  background: color-mix(in srgb, var(--el-brand) 42%, transparent);
  color: var(--text);
  border-radius: var(--el-radius-xs);
}

.find-highlight.active {
  background: color-mix(in srgb, var(--el-accent) 48%, transparent);
}

.find-bar button {
  flex: 0 0 auto;
  width: 1.85rem;
  height: 1.85rem;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  line-height: 1;
  cursor: pointer;
}

.find-bar button:hover {
  border-color: var(--line);
  color: var(--text);
  background: rgba(255, 255, 255, 0.04);
}

.documents-workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 0.8rem;
  flex: 1 1 auto;
  min-height: 0;
}

.documents-shell[data-workspace-view="write"] .documents-workspace,
.documents-shell[data-workspace-view="read"] .documents-workspace {
  grid-template-columns: minmax(0, 1fr);
}

.documents-shell[data-workspace-view="write"] .inspector-pane {
  display: none;
}

.documents-shell[data-workspace-view="read"] .editor-pane {
  display: none;
}

.toolbar-group {
  display: inline-flex;
  align-items: center;
  gap: 0.42rem;
}

/* The More menu only exists on the phone stage; on wider stages its actions
   sit in the toolbar row as before. */
.toolbar-more,
.more-menu {
  display: contents;
}

.more-button {
  display: none;
}

.view-toggle,
.workspace-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.12rem;
  box-sizing: border-box;
  height: 2.35rem;
  margin-right: 0.2rem;
  padding: 0.18rem;
  border: 1px solid var(--line);
  border-radius: 0.95rem;
  background: var(--el-inset);
}

.view-toggle-button,
.workspace-tab {
  width: 1.95rem;
  height: 1.95rem;
  border-radius: 0.7rem;
  color: var(--muted);
  background: transparent;
  border-color: transparent;
}

.view-toggle-button.active,
.workspace-tab.active,
.workspace-tab[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: rgba(125, 149, 240, 0.35);
  color: var(--accent-deep);
}

.view-toggle-button .action-icon,
.workspace-tab .action-icon {
  width: 1rem;
  height: 1rem;
}

.inspector-pane {
  display: flex;
  flex-direction: column;
}

.pane-tabs {
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: nowrap;
  gap: 0.7rem;
  min-width: 0;
}

.pane-tab {
  padding: 0;
  border-radius: 0;
  background: transparent;
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1;
  text-transform: uppercase;
}

.pane-tab.active {
  color: var(--accent-deep);
}

.editor-pane,
.preview-pane {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  min-width: 0;
  overflow: hidden;
}

.pane-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.6rem;
  padding: 0.72rem 0.85rem;
  border-bottom: 1px solid var(--line);
}

.inspector-pane .pane-header {
  align-items: center;
}

.pane-title {
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
  color: var(--muted);
}

.pane-note {
  color: var(--muted);
  font-size: 0.8rem;
}

.editor {
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
  padding: 0.95rem 1rem 1.1rem;
  border: 0;
  resize: none;
  background: transparent;
  line-height: 1.65;
  outline: none;
}

.editor::placeholder {
  color: var(--el-soft);
}

.preview-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 1.1rem 1.1rem 1.4rem;
}

.inspector-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 1rem;
}

.outline-list,
.history-list {
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}

.outline-item,
.history-item {
  padding: 0.8rem 0.9rem;
  border-radius: var(--radius-md);
  background: var(--panel-strong);
  border: 1px solid rgba(255, 255, 255, 0.07);
}

.outline-item:hover,
.history-item:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: var(--line);
}

.outline-link {
  display: block;
  text-decoration: none;
  color: var(--text);
}

.outline-kicker,
.history-kicker {
  display: block;
  color: var(--muted);
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

.outline-title,
.history-title {
  display: block;
  margin-top: 0.18rem;
  font-size: 0.92rem;
  font-weight: 600;
}

.history-meta {
  display: block;
  margin-top: 0.22rem;
  color: var(--muted);
  font-size: 0.8rem;
}

.history-link {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  margin-top: 0.45rem;
  padding: 0;
  background: transparent;
  color: var(--accent);
  font-size: 0.82rem;
  font-weight: 700;
  text-decoration: none;
}

.history-link:hover,
.outline-link:hover {
  text-decoration: underline;
}

.share-topline {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
  margin-bottom: 0.75rem;
}

.share-token {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  min-width: 0;
  color: var(--muted);
  font-size: 0.82rem;
}

.share-token strong {
  color: var(--text);
  font-weight: 600;
}

.share-token span {
  overflow: hidden;
  text-overflow: ellipsis;
}

.share-preview {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
}

.empty-state,
.loading-state,
.error-state {
  display: grid;
  place-items: center;
  min-height: 16rem;
  text-align: center;
  padding: 2rem;
  color: var(--muted);
}

.error-state {
  color: var(--danger);
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.55);
  padding: 1rem;
  z-index: 30;
}

.modal-backdrop.open {
  display: flex;
}

.modal-card {
  width: min(100%, 28rem);
  background: var(--panel-strong);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  padding: 1.15rem;
}

.modal-card h2 {
  margin: 0;
  font-size: 1.2rem;
  letter-spacing: 0;
}

.modal-card p {
  margin: 0.45rem 0 0;
  color: var(--muted);
  line-height: 1.5;
}

.modal-fields {
  display: grid;
  gap: 0.8rem;
  margin-top: 1rem;
}

.modal-fields label {
  display: grid;
  gap: 0.35rem;
  font-size: 0.9rem;
  font-weight: 600;
}

.modal-fields input {
  width: 100%;
  padding: 0.8rem 0.85rem;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--el-inset);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 0.6rem;
  margin-top: 1rem;
}

.markdown-body {
  line-height: 1.72;
  color: var(--text);
}

.markdown-body > :first-child {
  margin-top: 0;
}

.markdown-body h1,
.markdown-body h2,
.markdown-body h3,
.markdown-body h4,
.markdown-body h5,
.markdown-body h6 {
  margin: 1.4em 0 0.55em;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: 0;
}

.markdown-body h1 {
  font-size: 2rem;
  padding-bottom: 0.35rem;
  border-bottom: 1px solid var(--line);
}

.markdown-body h2 {
  font-size: 1.4rem;
  padding-bottom: 0.3rem;
  border-bottom: 1px solid var(--line);
}

.markdown-body h3 {
  font-size: 1.16rem;
}

.markdown-body p,
.markdown-body ul,
.markdown-body ol,
.markdown-body blockquote,
.markdown-body table,
.markdown-body pre {
  margin: 0 0 1rem;
}

.markdown-body ul,
.markdown-body ol {
  padding-left: 1.6rem;
}

.markdown-body ul.task-list {
  list-style: none;
  padding-left: 0.15rem;
}

.markdown-body .task-item {
  list-style: none;
  margin: 0.2rem 0;
}

.markdown-body .task-label {
  display: flex;
  align-items: flex-start;
  gap: 0.55rem;
  cursor: pointer;
}

.markdown-body .task-checkbox {
  flex: 0 0 auto;
  width: 1rem;
  height: 1rem;
  margin: 0.38em 0 0;
  accent-color: var(--accent);
  cursor: pointer;
}

.markdown-body .task-text {
  min-width: 0;
  flex: 1 1 auto;
}

.markdown-body .task-item:has(.task-checkbox:checked) .task-text {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-thickness: 1px;
}

.markdown-body mark.find-hit {
  background: rgba(250, 204, 21, 0.35);
  color: inherit;
  border-radius: 0.15em;
  padding: 0 0.05em;
}

.markdown-body mark.find-hit.active {
  background: rgba(250, 204, 21, 0.7);
}

.markdown-body a {
  color: var(--accent);
  text-decoration: none;
}

.markdown-body a:hover {
  text-decoration: underline;
}

.markdown-body code {
  font-family: var(--el-font-mono);
  font-size: 0.9em;
  padding: 0.15em 0.35em;
  background: rgba(255, 255, 255, 0.07);
  border-radius: 0.35rem;
}

.markdown-body pre {
  overflow: auto;
  padding: 0.95rem 1rem;
  border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.07);
}

.markdown-body pre code {
  padding: 0;
  background: transparent;
}

.markdown-body blockquote {
  padding-left: 1rem;
  border-left: 3px solid rgba(125, 149, 240, 0.35);
  color: var(--muted);
}

.markdown-body table {
  width: 100%;
  border-collapse: collapse;
}

.markdown-body th,
.markdown-body td {
  padding: 0.55rem 0.7rem;
  border: 1px solid var(--line);
  text-align: left;
}

.markdown-body th {
  background: rgba(255, 255, 255, 0.07);
}

/* Narrow: keep split + safe-top; full mobile campaign is MOBILE.01. */
@media (max-width: 980px) {
  .documents-shell,
  .share-shell {
    grid-template-columns: 200px minmax(0, 1fr);
  }

  .documents-main,
  .share-main {
    --documents-toolbar-band: 12px;
    min-height: 0;
    padding: var(--documents-toolbar-band) 12px 12px;
  }

  .documents-sidebar,
  .share-sidebar {
    padding: var(--window-chrome-safe-top, 52px) 10px 12px;
  }
}

@media (max-width: 720px) {
  .page-shell {
    padding: 0;
  }

  .documents-main,
  .share-main {
    padding: 0.38rem;
  }

  .documents-toolbar,
  .share-header {
    flex-direction: column;
    align-items: stretch;
    gap: 0.42rem;
    padding-bottom: var(--documents-toolbar-band, 12px);
  }

  .toolbar-actions {
    justify-content: flex-start;
    min-width: 0;
    max-width: 100%;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .toolbar-actions::-webkit-scrollbar {
    display: none;
  }

  .document-list-row {
    flex-direction: column;
    align-items: flex-start;
  }

  .documents-workspace {
    gap: 0.38rem;
  }

  .pane-header {
    padding: 0.42rem 0.52rem;
  }

  .editor,
  .preview-scroll,
  .inspector-scroll {
    padding: 0.52rem;
  }
}

/* Phone stage: the editor gets the whole width (Apple Notes). The list is the
   shared push drawer (elastos-drawer.js) led by the toggle beside the title;
   view and Save sit on one row of 44 px buttons, the rest in a More menu. Split has no room on a phone and
   reads as Write; the desktop "Hide list" control gives way to the drawer. */
:root[data-el-form-factor="phone"] .documents-shell {
  grid-template-columns: minmax(0, 1fr);
  /* Shows at the pushed-aside view's rounded corners: the drawer's fill. */
  background: linear-gradient(var(--sidebar-bg), var(--sidebar-bg)) var(--bg);
}

:root[data-el-form-factor="phone"] .documents-sidebar {
  padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(16px + env(safe-area-inset-bottom, 0px));
  border: 0;
  background: linear-gradient(var(--sidebar-bg), var(--sidebar-bg)) var(--bg);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

:root[data-el-form-factor="phone"] .sidebar-search {
  font-size: 16px;
}

:root[data-el-form-factor="phone"] .documents-main {
  padding: 0 12px calc(8px + env(safe-area-inset-bottom, 0px));
}

:root[data-el-form-factor="phone"] .documents-toolbar {
  flex-direction: column;
  align-items: stretch;
  gap: 4px;
  padding: 4px 0 8px;
}

:root[data-el-form-factor="phone"] .documents-identity {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-left: -8px;
}

:root[data-el-form-factor="phone"] .title-input {
  flex: 1 1 auto;
  min-height: var(--el-touch-target);
  min-width: 0;
  max-width: none;
  font-size: 20px;
}

:root[data-el-form-factor="phone"] .toolbar-actions {
  justify-content: flex-start;
  min-width: 0;
  max-width: 100%;
  /* The narrow-window row scrolls, which would clip the More menu. */
  overflow: visible;
}

:root[data-el-form-factor="phone"] .more-button {
  display: inline-grid;
}

:root[data-el-form-factor="phone"] .toolbar-more {
  display: block;
  position: relative;
  margin-left: auto;
}

:root[data-el-form-factor="phone"] .more-menu {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 30;
  flex-direction: column;
  gap: 2px;
  min-width: 220px;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--panel);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
}

:root[data-el-form-factor="phone"] .toolbar-more[data-open="true"] .more-menu {
  display: flex;
}

:root[data-el-form-factor="phone"] .more-menu .toolbar-group {
  flex-direction: column;
  align-items: stretch;
  gap: 2px;
}

:root[data-el-form-factor="phone"] .more-menu .action-icon-button {
  display: flex;
  justify-content: flex-start;
  gap: 12px;
  width: 100%;
  padding: 0 12px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  text-align: start;
  white-space: nowrap;
}

:root[data-el-form-factor="phone"] .more-menu .action-icon-button::after {
  content: attr(aria-label);
  font-size: 16px;
  font-weight: 500;
}

:root[data-el-form-factor="phone"] .action-icon-button,
:root[data-el-form-factor="phone"] .copy-link-button {
  width: var(--el-touch-target);
  height: var(--el-touch-target);
  min-height: var(--el-touch-target);
}

/* Each tab is a full 44 px target; the pill paints only inside its padding,
   and the ring is a shadow so no border eats into the target. */
:root[data-el-form-factor="phone"] .workspace-toggle {
  height: var(--el-touch-target);
  padding: 0;
  gap: 0;
  border: 0;
  box-shadow: inset 0 0 0 1px var(--line);
}

:root[data-el-form-factor="phone"] .workspace-tab {
  width: var(--el-touch-target);
  height: var(--el-touch-target);
  padding: 3px;
  border: 0;
  background-clip: content-box;
}

:root[data-el-form-factor="phone"] #mode-split,
:root[data-el-form-factor="phone"] #sidebar-toggle,
:root[data-el-form-factor="phone"] .editor-pane > .pane-header {
  display: none;
}

:root[data-el-form-factor="phone"] .documents-shell[data-workspace-view="split"] .documents-workspace {
  grid-template-columns: minmax(0, 1fr);
}

:root[data-el-form-factor="phone"] .documents-shell[data-workspace-view="split"] .inspector-pane {
  display: none;
}

:root[data-el-form-factor="phone"] .editor {
  font-size: 16px;
  line-height: 1.55;
}
</style>
</head>
<body>
<div class="page-shell">
  <section id="documents-shell" class="documents-shell hidden">
    <aside id="documents-sidebar" class="documents-sidebar" data-el-drawer>
      <div class="sidebar-controls">
        <button id="new-document" class="sidebar-create" type="button" aria-label="New document" title="New document" data-el-drawer-close>+</button>
        <input id="sidebar-search" class="sidebar-search" type="search" placeholder="Search documents" spellcheck="false">
      </div>
      <div id="documents-list" class="documents-list" data-el-drawer-close></div>
    </aside>

    <main class="documents-main" data-el-drawer-room="documents-sidebar">
      <header class="documents-toolbar">
        <div class="documents-identity">
          <button type="button" class="el-drawer-toggle" data-el-drawer-toggle="documents-sidebar" aria-label="Show documents"></button>
          <input id="title-input" class="title-input" type="text" placeholder="Untitled document" spellcheck="false">
        </div>
        <div class="toolbar-actions">
          <div class="toolbar-group workspace-toggle" aria-label="Document view">
            <button id="mode-write" class="workspace-tab" type="button" aria-label="Write — edit markdown" title="Write — edit markdown" aria-pressed="true">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18.5V20h1.5L17 8.5 15.5 7 4 18.5z"></path><path d="m14.5 8 1.5-1.5 1.5 1.5-1.5 1.5"></path><path d="M4 20h16"></path></svg>
            </button>
            <button id="mode-split" class="workspace-tab" type="button" aria-label="Split — edit and preview" title="Split — edit and preview" aria-pressed="false">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"></path><path d="M12 5v14"></path></svg>
            </button>
            <button id="mode-read" class="workspace-tab" type="button" aria-label="Read — preview only" title="Read — preview only" aria-pressed="false">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5.5h8.5A3.5 3.5 0 0 1 18 9v9.5H9.5A3.5 3.5 0 0 0 6 22V5.5z"></path><path d="M18 18.5H9.5A3.5 3.5 0 0 0 6 22"></path></svg>
            </button>
          </div>
          <div class="toolbar-group">
            <button id="save-button" class="action-primary action-icon-button" type="button" aria-label="Save" title="Save">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12l2 2v14H5z"></path><path d="M8 4v6h8V4"></path><path d="M8 20v-6h8v6"></path></svg>
            </button>
          </div>
          <div class="toolbar-more">
            <button id="more-button" class="action-secondary action-icon-button more-button" type="button" aria-label="More actions" title="More actions" aria-expanded="false" aria-controls="more-menu">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.3"></circle><circle cx="12" cy="12" r="1.3"></circle><circle cx="18.5" cy="12" r="1.3"></circle></svg>
            </button>
            <div id="more-menu" class="more-menu" role="group" aria-label="More actions">
              <div class="toolbar-group">
                <button id="save-as-button" class="action-secondary action-icon-button" type="button" aria-label="Save as" title="Save as">
                  <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7h9l3 3v9H8z"></path><path d="M4 4h9v3"></path><path d="M4 4v12h4"></path><path d="M13 12v5"></path><path d="M10.5 14.5h5"></path></svg>
                </button>
                <button id="publish-button" class="action-secondary action-icon-button" type="button" aria-label="Publish" title="Publish">
                  <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"></path><path d="m7 9 5-5 5 5"></path><path d="M5 16v4h14v-4"></path></svg>
                </button>
                <button id="unpublish-button" class="action-secondary action-icon-button" type="button" aria-label="Unpublish" title="Unpublish">
                  <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12"></path><path d="m7 11 5 5 5-5"></path><path d="M5 20h14"></path></svg>
                </button>
              </div>
              <div class="toolbar-group">
                <button id="copy-published-link" class="action-secondary action-icon-button copy-link-button hidden" type="button" aria-label="Copy Published Link" title="Copy Published Link" disabled>
                  <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"></path><path d="M14 11a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 20.1l1.1-1.1"></path></svg>
                </button>
                <button id="delete-button" class="action-secondary action-danger action-icon-button" type="button" aria-label="Delete" title="Delete">
                  <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14"></path><path d="M9 7V5h6v2"></path><path d="M8 7l1 13h6l1-13"></path><path d="M10.5 11v5"></path><path d="M13.5 11v5"></path></svg>
                </button>
              </div>
            </div>
          </div>
          <div class="toolbar-group">
            <button id="sidebar-toggle" class="action-secondary action-icon-button sidebar-toggle" type="button" aria-label="Hide list" title="Hide list" aria-controls="documents-sidebar" aria-expanded="true">
              <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"></path><path d="M9 5v14"></path><path d="m15 9-3 3 3 3"></path></svg>
            </button>
          </div>
        </div>
      </header>

      <div id="status-row" class="status-row hidden">
        <span id="status-text" class="status-text"></span>
      </div>

      <div id="find-bar" class="find-bar hidden" aria-label="Find in document">
        <input id="find-input" class="find-input" type="search" placeholder="Find" spellcheck="false" aria-label="Find">
        <span id="find-count" class="find-count" aria-live="polite"></span>
        <div class="find-actions">
          <button id="find-prev" class="action-secondary action-icon-button" type="button" aria-label="Previous match" title="Previous match">
            <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
          </button>
          <button id="find-next" class="action-secondary action-icon-button" type="button" aria-label="Next match" title="Next match">
            <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
          </button>
          <button id="find-close" class="action-secondary action-icon-button" type="button" aria-label="Close find" title="Close find">
            <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg>
          </button>
        </div>
      </div>

      <div class="documents-workspace">
        <section class="editor-pane">
          <div class="pane-header">
            <span class="pane-title">Write</span>
            <span class="pane-note">Markdown editor</span>
          </div>
          <textarea id="editor" class="editor" spellcheck="true" placeholder="# Start writing"></textarea>
        </section>

        <section class="preview-pane inspector-pane">
          <div class="pane-header">
            <span class="pane-title">Inspect</span>
            <div class="pane-tabs">
              <button id="pane-preview" class="pane-tab active" type="button">Preview</button>
              <button id="pane-outline" class="pane-tab" type="button">Outline</button>
              <button id="pane-history" class="pane-tab" type="button">History</button>
            </div>
          </div>
          <div id="preview-panel" class="preview-scroll">
            <article id="preview" class="markdown-body"></article>
          </div>
          <div id="outline-panel" class="inspector-scroll hidden"></div>
          <div id="history-panel" class="inspector-scroll hidden"></div>
        </section>
      </div>
    </main>
  </section>

  <section id="share-shell" class="share-shell hidden">
    <aside id="share-sidebar" class="share-sidebar hidden">
      <div class="sidebar-header">
        <div>
          <h1 class="sidebar-title">Shared documents</h1>
          <p id="share-sidebar-meta" class="sidebar-subtitle"></p>
        </div>
      </div>
      <nav id="share-doc-list" class="share-doc-list"></nav>
    </aside>

    <main class="share-main">
      <header class="share-header">
        <div>
          <div id="share-topline" class="share-topline"></div>
          <h1 id="share-title" class="share-title">Documents</h1>
          <p id="share-subtitle" class="share-subtitle">Read-only markdown surface.</p>
        </div>
      </header>
      <article id="share-preview" class="share-preview markdown-body">
        <div class="loading-state">Loading document…</div>
      </article>
    </main>
  </section>
</div>

<div id="save-as-modal" class="modal-backdrop" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="save-as-title">
    <h2 id="save-as-title">Save as</h2>
    <p>Create a separate markdown document.</p>
    <form id="save-as-form">
      <div class="modal-fields">
        <label>
          Title
          <input id="save-as-title-input" type="text" aria-label="Document title" required>
        </label>
        <label>
          File name
          <input id="save-as-file-input" type="text" placeholder="untitled.md">
        </label>
      </div>
      <div class="modal-actions">
        <button id="save-as-cancel" class="action-secondary" type="button">Cancel</button>
        <button class="action-primary" type="submit">Create</button>
      </div>
    </form>
  </div>
</div>

<div id="confirm-modal" class="modal-backdrop" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <h2 id="confirm-title">Continue?</h2>
    <p id="confirm-message"></p>
    <div class="modal-actions">
      <button id="confirm-cancel" class="action-secondary" type="button">Cancel</button>
