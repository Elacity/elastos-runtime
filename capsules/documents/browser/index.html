<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents · ElastOS</title>
<!-- tip: documents-20260721o — list hover full width under + and search -->
<script src="./elastos-theme.js"></script>
<link rel="stylesheet" href="./elastos-ui.css">
<style>
:root {
  --bg: var(--el-bg);
  --bg-strong: #10131a;
  --panel: rgba(22, 24, 29, 0.78);
  --panel-strong: var(--el-surface-raised);
  --panel-soft: var(--el-inset);
  --line: var(--el-hairline);
  --line-strong: var(--el-hairline-strong);
  --ink: var(--el-text);
  --text: var(--ink);
  --paper: var(--bg);
  --muted: var(--el-muted);
  --brand: var(--el-brand);
  --brand-soft: rgba(246, 146, 26, 0.16);
  --accent: var(--el-accent);
  --accent-soft: var(--el-accent-soft);
  --accent-deep: var(--el-accent-strong);
  --warning: var(--el-danger);
  --danger: var(--el-danger);
  --sidebar-bg: rgba(22, 24, 29, 0.78);
  --sidebar-panel: var(--panel-strong);
  --sidebar-line: var(--line);
  --sidebar-text: var(--ink);
  --sidebar-muted: var(--muted);
  --shadow: none;
  --radius-xl: 0;
  --radius-lg: 10px;
  --radius-md: 10px;
  --radius-sm: 999px;
  color-scheme: dark;
  font-family: var(--el-font);
}

:root[data-el-theme="light"] {
  --bg-strong: #e8eaef;
  --panel: rgba(255, 255, 255, 0.9);
  --sidebar-bg: #f0f1f4;
  --brand-soft: #fff1dc;
  color-scheme: light;
}

:root[data-el-theme="light"] body {
  background: var(--bg);
}

:root[data-el-theme="light"] .documents-sidebar,
:root[data-el-theme="light"] .share-sidebar {
  background: color-mix(in srgb, var(--sidebar-bg) 90%, transparent);
}

:root[data-el-theme="light"] .document-list-item:hover,
:root[data-el-theme="light"] .share-doc-link:hover,
:root[data-el-theme="light"] .outline-item:hover,
:root[data-el-theme="light"] .history-item:hover {
  background: var(--el-lift);
}

:root[data-el-theme="light"] .document-list-item.active,
:root[data-el-theme="light"] .share-doc-link.active {
  background: var(--el-lift-strong);
  color: var(--el-accent);
}

:root[data-el-theme="light"] .view-toggle-button.active {
  background: var(--accent-soft);
  border-color: rgba(95, 118, 216, 0.18);
}

:root[data-el-theme="light"] .document-list-item.published {
  background: color-mix(in srgb, var(--el-accent-soft) 70%, transparent);
}

:root[data-el-theme="light"] .document-list-item.published:hover,
:root[data-el-theme="light"] .document-list-item.published.active {
  background: var(--el-lift-strong);
}

:root[data-el-theme="light"] .document-list-published-icon {
  background: rgba(95, 118, 216, 0.14);
}

:root[data-el-theme="light"] .action-danger {
  border-color: rgba(177, 76, 90, 0.22);
}

:root[data-el-theme="light"] .action-danger:hover:not(:disabled),
:root[data-el-theme="light"] .action-danger:focus-visible:not(:disabled) {
  background: rgba(177, 76, 90, 0.1);
}

:root[data-el-theme="light"] .action-danger-solid {
  color: #fffaf9;
}

:root[data-el-theme="light"] .action-danger-solid:hover:not(:disabled),
:root[data-el-theme="light"] .action-danger-solid:focus-visible:not(:disabled) {
  background: #963846;
}

:root[data-el-theme="light"] .modal-backdrop {
  background: rgba(29, 36, 56, 0.22);
}

:root[data-el-theme="light"] .markdown-body code,
:root[data-el-theme="light"] .markdown-body pre,
:root[data-el-theme="light"] .markdown-body th {
  background: rgba(83, 103, 164, 0.08);
}

:root[data-el-theme="light"] .markdown-body pre code {
  background: transparent;
}

:root[data-el-theme="light"] .markdown-body blockquote {
  border-left-color: rgba(95, 118, 216, 0.28);
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  min-height: 100%;
}

body {
  margin: 0;
  font-family: inherit;
  color: var(--text);
  background: var(--bg);
}

button,
input,
textarea {
  font: inherit;
  color: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

a {
  color: inherit;
}

.page-shell {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: var(--bg);
}

.hidden {
  display: none !important;
}

/* Apps-level blend: flex/grid split; sidebar owns lights safe-top. */
.documents-shell,
.share-shell {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  gap: 0;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  background: var(--bg);
}

/* Collapsed: keep leading chrome column so traffic lights stay over material. */
.documents-shell[data-sidebar-collapsed="true"] {
  grid-template-columns: 220px minmax(0, 1fr);
}

.documents-shell[data-sidebar-collapsed="true"] .sidebar-search,
.documents-shell[data-sidebar-collapsed="true"] .documents-list {
  display: none;
}

.documents-sidebar,
.share-sidebar {
  --sidebar-compose-size: 2rem;
  --sidebar-compose-gap: 0.55rem;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  padding: var(--window-chrome-safe-top, 52px) 12px 16px;
  background: color-mix(in srgb, var(--sidebar-bg) 78%, transparent);
  border: 0;
  border-right: 1px solid color-mix(in srgb, var(--el-hairline) 70%, transparent);
  border-radius: 0;
  box-shadow: none;
  color: var(--sidebar-text);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
}

.documents-main,
.share-main {
  --documents-toolbar-band: 14px;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  height: 100%;
  padding: var(--documents-toolbar-band) 18px 16px;
  overflow: hidden;
  background: var(--bg);
  border: 0;
  border-radius: 0;
  box-shadow: none;
}

/* Share without list: one column; clear traffic-light overlay on the page. */
.share-shell:has(> .share-sidebar.hidden) {
  grid-template-columns: minmax(0, 1fr);
}

.share-shell:has(> .share-sidebar.hidden) .share-main {
  padding-top: var(--window-chrome-safe-top, 52px);
  padding-left: 78px;
}

.sidebar-header,
.share-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.8rem;
}

.sidebar-title,
.share-title {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.sidebar-subtitle {
  margin: 0.35rem 0 0;
  color: var(--sidebar-muted);
  font-size: 0.9rem;
  line-height: 1.45;
}

.share-subtitle {
  margin: 0.35rem 0 0;
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.45;
}

.sidebar-controls {
  display: flex;
  align-items: center;
  gap: var(--sidebar-compose-gap);
}

.sidebar-create {
  display: inline-grid;
  width: var(--sidebar-compose-size);
  min-width: var(--sidebar-compose-size);
  height: var(--sidebar-compose-size);
  place-items: center;
  background: var(--accent);
  color: #f8fbff;
  border: 1px solid transparent;
  border-radius: 999px;
  padding: 0;
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
}

.sidebar-search {
  flex: 1;
  min-width: 0;
  width: 100%;
  padding: 0.55rem 0.85rem;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--el-inset);
  color: var(--text);
  outline: none;
}

.sidebar-search:focus {
  border-color: var(--el-focus);
  box-shadow: 0 0 0 3px rgba(246, 146, 26, 0.15);
}

.sidebar-search::placeholder {
  color: var(--sidebar-muted);
}

.documents-list,
.share-doc-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-height: 0;
  margin-top: 0.65rem;
  overflow: auto;
  /* Full row width: left of New note (+) through right of search. */
  padding: 0;
}

.documents-list-section {
  margin: 0.55rem 0 0.2rem;
  color: var(--sidebar-muted);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.document-list-marks {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  flex: 0 0 auto;
}

.document-list-pin-icon {
  flex: 0 0 auto;
  width: 0.85rem;
  height: 0.85rem;
  color: var(--sidebar-muted);
}

.document-list-pin-icon svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.context-menu {
  position: fixed;
  z-index: 80;
  min-width: 198px;
  max-width: calc(100vw - 16px);
  border: 1px solid var(--el-hairline-strong, var(--line));
  border-radius: 10px;
  background: rgba(30, 32, 38, 0.98);
  box-shadow: var(--el-shadow-2, 0 12px 40px rgba(0, 0, 0, 0.28));
  padding: 5px 0;
  color: var(--text);
  user-select: none;
}

:root[data-el-theme="light"] .context-menu {
  background: rgba(248, 248, 250, 0.98);
}

.context-menu.hidden {
  display: none;
}

.context-menu .menu-item {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  width: 100%;
  border: 0;
  border-radius: 0;
  background: transparent;
  min-height: 1.7rem;
  padding: 0.28rem 0.85rem;
  cursor: default;
  text-align: left;
  font: inherit;
  font-size: 0.88rem;
  color: inherit;
}

.context-menu .menu-item:hover:not(:disabled) {
  background: #0a84ff;
  color: #fff;
}

.context-menu .menu-item:disabled {
  opacity: 0.45;
}

.context-menu .menu-item-icon {
  flex: 0 0 auto;
  width: 0.95rem;
  height: 0.95rem;
  opacity: 0.9;
}

.context-menu .menu-item-icon svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.context-menu .menu-item-label {
  min-width: 0;
  flex: 1 1 auto;
}

.context-menu .menu-divider {
  height: 1px;
  margin: 4px 8px;
  background: var(--line);
}

.document-list-item,
.share-doc-link {
  width: 100%;
  padding: 0.55rem 0.75rem;
  /* Row highlight — not a capsule; pills stay on search/create only. */
  border-radius: 10px;
  background: transparent;
  border: 1px solid transparent;
  text-align: left;
  transition: background 140ms ease, color 140ms ease;
}

.document-list-item:hover,
.share-doc-link:hover {
  background: var(--el-lift);
}

.document-list-item.active,
.share-doc-link.active {
  background: var(--el-lift-strong);
  color: var(--el-accent);
}

.document-list-item.active .document-list-title,
.share-doc-link.active .share-doc-title {
  color: var(--el-accent);
  font-weight: 600;
}

.document-list-item.published {
  background: color-mix(in srgb, var(--el-accent-soft) 55%, transparent);
}

.document-list-item.published:hover,
.document-list-item.published.active {
  background: var(--el-lift-strong);
}

.document-list-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.55rem;
}

.document-list-title,
.share-doc-title {
  display: block;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 0.98rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--sidebar-text);
}

.document-list-meta,
.share-doc-meta {
  display: block;
  margin-top: 0.32rem;
  color: var(--sidebar-muted);
  font-size: 0.82rem;
}

.document-list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.7rem;
  margin-top: 0.4rem;
}

.document-list-updated {
  color: var(--sidebar-muted);
  font-size: 0.77rem;
}

.document-list-published-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.35rem;
  min-width: 1.35rem;
  height: 1.35rem;
  border-radius: 999px;
  background: rgba(125, 149, 240, 0.2);
  color: var(--accent-deep);
}

.document-list-published-icon svg {
  width: 0.86rem;
  height: 0.86rem;
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2.2;
}

.sidebar-note {
  padding: 0.2rem 0.1rem;
  color: var(--sidebar-muted);
  font-size: 0.82rem;
  line-height: 1.5;
}

.documents-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  /* Match main top inset so title/actions sit centered above Write. */
  padding-bottom: var(--documents-toolbar-band);
}

.documents-identity {
  min-width: 0;
  flex: 1 1 auto;
}

.title-input {
  width: 100%;
  max-width: 32rem;
  padding: 0;
  border: 0;
  background: transparent;
  font-size: clamp(1.45rem, 2.6vw, 2rem);
  font-weight: 700;
  letter-spacing: -0.04em;
  outline: none;
}

.toolbar-actions {
  display: flex;
  align-items: center;
  gap: 0.42rem;
  flex-wrap: nowrap;
  justify-content: flex-end;
  flex: 0 0 auto;
  min-width: max-content;
}

.sidebar-toggle {
  min-width: 0;
}

.action-primary,
.action-secondary,
.action-link {
  border-radius: 999px;
  padding: 0.68rem 1rem;
  font-size: 0.92rem;
  font-weight: 700;
}

.action-primary {
  background: var(--accent);
  color: #f8fbff;
}

.action-secondary {
  background: var(--panel-soft);
  border: 1px solid var(--line);
}

.action-icon-button {
  width: 2.35rem;
  height: 2.35rem;
  padding: 0;
  display: inline-grid;
  place-items: center;
  border-radius: 0.85rem;
}

.action-icon {
  width: 1.08rem;
  height: 1.08rem;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.copy-link-button {
  display: inline-flex;
  align-items: center;
  gap: 0.42rem;
  min-height: 2.35rem;
  padding: 0 0.82rem;
  color: var(--accent-deep);
}

.copy-link-button .action-icon {
  width: 1rem;
  height: 1rem;
}

.action-danger {
  border-color: rgba(255, 143, 143, 0.35);
  color: var(--danger);
}

.action-danger:hover:not(:disabled),
.action-danger:focus-visible:not(:disabled) {
  background: rgba(255, 143, 143, 0.12);
}

.action-danger-solid {
  background: var(--danger);
  color: #2a1215;
}

.action-danger-solid:hover:not(:disabled),
.action-danger-solid:focus-visible:not(:disabled) {
  background: #ff9f9f;
}

.action-link {
  background: transparent;
  color: var(--accent);
  padding-inline: 0.2rem;
}

.action-primary:disabled,
.action-secondary:disabled,
.action-link:disabled {
  opacity: 0.5;
  cursor: default;
}

.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.7rem;
  padding: 0.35rem 0 0.05rem;
  min-height: 0;
}

.status-row[hidden] {
  display: none;
}

.status-text {
  color: var(--muted);
  font-size: 0.88rem;
}

.status-text.warning {
  color: var(--warning);
}

.find-bar {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  margin: 0 0 0.55rem;
  padding: 0.35rem 0.45rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--el-inset);
}

.find-bar[hidden] {
  display: none;
}

.find-input {
  flex: 1 1 auto;
  min-width: 0;
  border: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 0.92rem;
  outline: none;
}

.find-count {
  flex: 0 0 auto;
  min-width: 2.6rem;
  color: var(--muted);
  font-size: 0.78rem;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.find-bar button {
  flex: 0 0 auto;
  width: 1.85rem;
  height: 1.85rem;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  line-height: 1;
  cursor: pointer;
}

.find-bar button:hover {
  border-color: var(--line);
  color: var(--text);
  background: rgba(255, 255, 255, 0.04);
}

.documents-workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 0.8rem;
  flex: 1 1 auto;
  min-height: 0;
}

.documents-shell[data-workspace-view="write"] .documents-workspace,
.documents-shell[data-workspace-view="read"] .documents-workspace {
  grid-template-columns: minmax(0, 1fr);
}

.documents-shell[data-workspace-view="write"] .inspector-pane {
  display: none;
}

.documents-shell[data-workspace-view="read"] .editor-pane {
  display: none;
}

.view-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.12rem;
  box-sizing: border-box;
  height: 2.35rem;
  margin-right: 0.2rem;
  padding: 0.18rem;
  border: 1px solid var(--line);
  border-radius: 0.95rem;
  background: var(--el-inset);
}

.view-toggle-button {
  width: 1.95rem;
  height: 1.95rem;
  border-radius: 0.7rem;
  color: var(--muted);
  background: transparent;
  border-color: transparent;
}

.view-toggle-button.active {
  background: var(--accent-soft);
  border-color: rgba(125, 149, 240, 0.35);
  color: var(--accent-deep);
}

.view-toggle-button .action-icon {
  width: 1rem;
  height: 1rem;
}

.inspector-pane {
  display: flex;
  flex-direction: column;
}

.pane-tabs {
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: nowrap;
  gap: 0.7rem;
  min-width: 0;
}

.pane-tab {
  padding: 0;
  border-radius: 0;
  background: transparent;
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  line-height: 1;
  text-transform: uppercase;
}

.pane-tab.active {
  color: var(--accent-deep);
}

.editor-pane,
.preview-pane {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  min-width: 0;
  overflow: hidden;
}

.pane-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.6rem;
  padding: 0.72rem 0.85rem;
  border-bottom: 1px solid var(--line);
}

.inspector-pane .pane-header {
  align-items: center;
}

.pane-title {
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.pane-note {
  color: var(--muted);
  font-size: 0.8rem;
}

.editor {
  flex: 1 1 auto;
  width: 100%;
  min-height: 0;
  padding: 0.95rem 1rem 1.1rem;
  border: 0;
  resize: none;
  background: transparent;
  line-height: 1.65;
  outline: none;
}

.editor::placeholder {
  color: var(--el-soft);
}

.preview-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 1.1rem 1.1rem 1.4rem;
}

.inspector-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 1rem;
}

.outline-list,
.history-list {
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}

.outline-item,
.history-item {
  padding: 0.8rem 0.9rem;
  border-radius: var(--radius-md);
  background: var(--panel-strong);
  border: 1px solid rgba(255, 255, 255, 0.07);
}

.outline-item:hover,
.history-item:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: var(--line);
}

.outline-link {
  display: block;
  text-decoration: none;
  color: var(--text);
}

.outline-kicker,
.history-kicker {
  display: block;
  color: var(--muted);
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.outline-title,
.history-title {
  display: block;
  margin-top: 0.18rem;
  font-size: 0.92rem;
  font-weight: 600;
}

.history-meta {
  display: block;
  margin-top: 0.22rem;
  color: var(--muted);
  font-size: 0.8rem;
}

.history-link {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  margin-top: 0.45rem;
  padding: 0;
  background: transparent;
  color: var(--accent);

function escapeHtml(value) {
  return value
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;");
}

function renderInlineMarkdown(text) {
  return escapeHtml(text)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_match, label, href) => {
      return '<a href="' + safeMarkdownHref(href) + '" rel="noopener noreferrer">' + label + "</a>";
    });
}

function safeMarkdownHref(value) {
  const href = String(value || "").trim();
  if (/^(https?:\/\/|elastos:\/\/|localhost:\/\/|#|\/(?!\/)|\.{1,2}\/)/i.test(href)) {
    return href;
  }
  return "#";
}

function headingSlug(text, number) {
  const slug = String(text || "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
  return (slug || "section") + "-" + number;
}

function renderMarkdownDocument(source, options) {
  const interactiveTasks = !!(options && options.interactiveTasks);
  const lines = String(source || "").replace(/\r\n/g, "\n").split("\n");
  const blocks = [];
  const outline = [];
  let index = 0;
  let headingIndex = 0;

  while (index < lines.length) {
    const line = lines[index];

    if (/^```/.test(line)) {
      const language = line.slice(3).trim();
      const code = [];
      index += 1;
      while (index < lines.length && !/^```/.test(lines[index])) {
        code.push(escapeHtml(lines[index]));
        index += 1;
      }
      index += 1;
      blocks.push('<pre><code' + (language ? ' class="language-' + language + '"' : "") + ">" + code.join("\n") + "</code></pre>");
      continue;
    }

    if (/^(\*{3,}|-{3,}|_{3,})\s*$/.test(line)) {
      blocks.push("<hr>");
      index += 1;
      continue;
    }

    const heading = /^(#{1,6})\s+(.+)$/.exec(line);
    if (heading) {
      headingIndex += 1;
      const title = heading[2].trim();
      const id = headingSlug(title, headingIndex);
      blocks.push("<h" + heading[1].length + ' id="' + id + '">' + renderInlineMarkdown(title) + "</h" + heading[1].length + ">");
      outline.push({ depth: heading[1].length, title: title, id: id });
      index += 1;
      continue;
    }

    if (/^>\s?/.test(line)) {
      const quote = [];
      while (index < lines.length && /^>\s?/.test(lines[index])) {
        quote.push(renderInlineMarkdown(lines[index].replace(/^>\s?/, "")));
        index += 1;
      }
      blocks.push("<blockquote><p>" + quote.join("<br>") + "</p></blockquote>");
      continue;
    }

    if (/^[-*]\s+/.test(line)) {
      const items = [];
      let hasTask = false;
      while (index < lines.length && /^[-*]\s+/.test(lines[index])) {
        const task = /^[-*]\s+\[([ xX])\]\s+(.*)$/.exec(lines[index]);
        if (task) {
          hasTask = true;
          const checked = /x/i.test(task[1]);
          const sourceLine = index;
          if (interactiveTasks) {
            items.push(
              '<li class="task-item"><label class="task-label">' +
                '<input type="checkbox" class="task-checkbox" aria-label="Task" data-source-line="' + sourceLine + '"' +
                (checked ? " checked" : "") + ">" +
                '<span class="task-text">' + renderInlineMarkdown(task[2]) + "</span>" +
                "</label></li>"
            );
          } else {
            items.push(
              '<li class="task-item"><label class="task-label">' +
                '<input type="checkbox" class="task-checkbox" aria-label="Task" disabled' +
                (checked ? " checked" : "") + ">" +
                '<span class="task-text">' + renderInlineMarkdown(task[2]) + "</span>" +
                "</label></li>"
            );
          }
        } else {
          items.push("<li>" + renderInlineMarkdown(lines[index].replace(/^[-*]\s+/, "")) + "</li>");
        }
        index += 1;
      }
      blocks.push((hasTask ? '<ul class="task-list">' : "<ul>") + items.join("") + "</ul>");
      continue;
    }

    if (/^\d+\.\s+/.test(line)) {
      const items = [];
      while (index < lines.length && /^\d+\.\s+/.test(lines[index])) {
        items.push("<li>" + renderInlineMarkdown(lines[index].replace(/^\d+\.\s+/, "")) + "</li>");
        index += 1;
      }
      blocks.push("<ol>" + items.join("") + "</ol>");
      continue;
    }

    if (/^\|.*\|$/.test(line) && index + 1 < lines.length && /^\|?[\s:-]+\|[\s|:-]*$/.test(lines[index + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((cell) => "<th>" + renderInlineMarkdown(cell.trim()) + "</th>");
      index += 2;
      const rows = [];
      while (index < lines.length && /^\|.*\|$/.test(lines[index])) {
        const cells = lines[index].split("|").slice(1, -1).map((cell) => "<td>" + renderInlineMarkdown(cell.trim()) + "</td>");
        rows.push("<tr>" + cells.join("") + "</tr>");
        index += 1;
      }
      blocks.push("<table><thead><tr>" + headerCells.join("") + "</tr></thead><tbody>" + rows.join("") + "</tbody></table>");
      continue;
    }

    if (!line.trim()) {
      index += 1;
      continue;
    }

    const paragraph = [];
    while (index < lines.length && lines[index].trim() && !/^(#{1,6})\s+/.test(lines[index]) && !/^```/.test(lines[index]) && !/^>\s?/.test(lines[index]) && !/^[-*]\s+/.test(lines[index]) && !/^\d+\.\s+/.test(lines[index]) && !/^(\*{3,}|-{3,}|_{3,})\s*$/.test(lines[index])) {
      paragraph.push(renderInlineMarkdown(lines[index]));
      index += 1;
    }
    blocks.push("<p>" + paragraph.join("<br>") + "</p>");
  }

  return {
    html: blocks.join("\n"),
    outline: outline,
  };
}

function refreshPreviewFromEditor() {
  const rendered = renderMarkdownDocument(elements.editor.value, { interactiveTasks: true });
  elements.preview.innerHTML = rendered.html;
  renderOutline(rendered.outline);
  if (state.findOpen && state.findQuery) {

function shortCid(cid) {
  if (!cid) {
    return "";
  }
  if (cid.length <= 18) {
    return cid;
  }
  return cid.slice(0, 10) + "…" + cid.slice(-6);
}

function documentUri(docDid) {
  return docDid ? "localhost://ElastOS/Documents/" + docDid : "";
}

function baseName(uri) {
  const clean = String(uri || "").replace(/\/+$/, "");
  const name = clean.split("/").pop() || "Document";
  try {
    return decodeURIComponent(name);
  } catch (_error) {
    return name;
  }
}

function formatBytes(bytes) {
  const value = Number(bytes || 0);
  if (!Number.isFinite(value) || value <= 0) {
    return "0 B";
  }
  const units = ["B", "KB", "MB", "GB"];
  let amount = value;
  let unitIndex = 0;
  while (amount >= 1024 && unitIndex < units.length - 1) {
    amount /= 1024;
    unitIndex += 1;
  }
  return (unitIndex === 0 ? String(amount) : amount.toFixed(amount >= 10 ? 1 : 2)) + " " + units[unitIndex];
}

function looksLikeTextContent(contentType, buffer) {
  const lower = String(contentType || "").toLowerCase();
  if (
    lower.startsWith("text/") ||
    lower.includes("json") ||
    lower.includes("markdown") ||
    lower.includes("xml") ||
    lower.includes("javascript")
  ) {
    return true;
  }
  const bytes = new Uint8Array(buffer);
  if (bytes.length === 0) {
    return true;
  }
  const sample = bytes.subarray(0, Math.min(bytes.length, 4096));
  if (sample.includes(0)) {
    return false;
  }
  try {
    new TextDecoder("utf-8", { fatal: true }).decode(sample);
    return true;
  } catch (_error) {
    return false;
  }
}

function isTextMimeType(mime) {
  const lower = String(mime || "").toLowerCase();
  return lower.startsWith("text/") ||
    lower.includes("json") ||
    lower.includes("markdown") ||
    lower.includes("xml") ||
    lower.includes("javascript");
}

function dataUrlToUtf8(dataUrl) {
  const value = String(dataUrl || "");
  const match = /^data:([^;,]*)(;base64)?,([\s\S]*)$/i.exec(value);
  if (!match) {
    throw new Error("Chat attachment payload is not a data URL.");
  }
  if (match[2]) {
    return base64ToUtf8(match[3] || "");
  }
  return decodeURIComponent(match[3] || "");
}

function isLibraryFileProjection(document) {
  return !!document && !!document.library_object_uri;
}

function isDraftDocument(document) {
  return !!document && !document.doc_did && !isLibraryFileProjection(document);
}

function createDraftDocument() {
  return {
    doc_did: "",
    document_uri: "",
    title: "",
    file_name: "",
    working_copy_uri: "",
    body: "",
    created_at: 0,
    updated_at: 0,
    latest_published_cid: null,
    publish_history: [],
  };
}

function formatTime(timestamp) {
  if (!timestamp) {
    return "";
  }
  return new Date(timestamp * 1000).toLocaleString(undefined, {
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function sortDocuments() {
  state.documents.sort((left, right) => {
    const pinDelta = Number(!!right.pinned) - Number(!!left.pinned);
    if (pinDelta) {
      return pinDelta;
    }
    return (right.updated_at || 0) - (left.updated_at || 0) || left.title.localeCompare(right.title);
  });
}

function setStatus(message, type) {
  const text = type === "warning"
    ? readableDocumentsError(message, "Documents action could not be completed.")
    : String(message || "");
  const idle = !text || /^ready\.?$/i.test(text.trim());
  elements.statusText.textContent = idle ? "" : text;
  elements.statusText.className = "status-text" + (type === "warning" ? " warning" : "");
  if (elements.statusRow) {

  }
}

function updateActionButtons() {
  const hasCurrent = !!state.current;
  const hasPersistedCurrent = hasCurrent && !isDraftDocument(state.current);
  const isLibraryFile = isLibraryFileProjection(state.current);
  elements.saveButton.disabled = !hasCurrent || !state.dirty;
  elements.saveAsButton.disabled = !hasPersistedCurrent || isLibraryFile;
  elements.publishButton.disabled = !hasCurrent || isLibraryFile;
  elements.unpublishButton.disabled = !hasPersistedCurrent || isLibraryFile || !state.current.latest_published_cid;
  elements.deleteButton.disabled = !hasPersistedCurrent || isLibraryFile;
}

function scheduleAutosave() {
  if (state.autosaveTimer) {
    window.clearTimeout(state.autosaveTimer);
  }
  state.autosaveTimer = window.setTimeout(() => {
    state.autosaveTimer = null;
    runAutosave().catch((error) => {
      setStatus(error.message || "Autosave failed.", "warning");
    });
  }, 900);
}

async function runAutosave() {
  if (!state.current || !state.dirty || state.autosaveInFlight) {
    return;
  }
  state.autosaveInFlight = true;
  try {
    await saveCurrent({ quiet: true });
  } finally {
    state.autosaveInFlight = false;
    if (state.dirty) {
      scheduleAutosave();
    }
  }
}

function setDirty(dirty) {
  state.dirty = !!dirty;
  updateActionButtons();
  if (state.current && state.dirty) {
    scheduleAutosave();
  } else if (state.autosaveTimer) {
    window.clearTimeout(state.autosaveTimer);
    state.autosaveTimer = null;
  }
  renderDocumentsList();
}

function setTaskLineChecked(lineIndex, checked) {
  const lines = elements.editor.value.replace(/\r\n/g, "\n").split("\n");
  if (lineIndex < 0 || lineIndex >= lines.length) {
    return false;
  }
  const match = /^([-*]\s+)\[([ xX])\](\s+.*)$/.exec(lines[lineIndex]);
  if (!match) {
    return false;
  }
  const mark = checked ? "x" : " ";
  lines[lineIndex] = match[1] + "[" + mark + "]" + match[3];
  const selectionStart = elements.editor.selectionStart;
  const selectionEnd = elements.editor.selectionEnd;
  elements.editor.value = lines.join("\n");
  try {
    elements.editor.setSelectionRange(selectionStart, selectionEnd);
  } catch (_error) {
    /* ignore */
  }
  refreshPreviewFromEditor();
  setDirty(true);
  return true;
}

function toggleTaskAtCursor() {
  const value = elements.editor.value;
  const pos = elements.editor.selectionStart || 0;
  const lineStart = value.lastIndexOf("\n", pos - 1) + 1;
  const lineEnd = value.indexOf("\n", pos);
  const end = lineEnd === -1 ? value.length : lineEnd;
  const line = value.slice(lineStart, end);
  const task = /^([-*]\s+)\[([ xX])\](\s+.*)$/.exec(line);
  if (task) {
    const checked = !/x/i.test(task[2]);
    const nextLine = task[1] + "[" + (checked ? "x" : " ") + "]" + task[3];
    elements.editor.value = value.slice(0, lineStart) + nextLine + value.slice(end);
    const cursor = lineStart + nextLine.length;
    elements.editor.setSelectionRange(cursor, cursor);
    refreshPreviewFromEditor();
    setDirty(true);
    return;
  }
  const bullet = /^([-*]\s+)(?!\[[ xX]\])(.*)$/.exec(line);
  if (bullet) {
    const nextLine = bullet[1] + "[ ] " + bullet[2];
    elements.editor.value = value.slice(0, lineStart) + nextLine + value.slice(end);
    const cursor = lineStart + nextLine.length;
    elements.editor.setSelectionRange(cursor, cursor);
    refreshPreviewFromEditor();
    setDirty(true);
  }
}

function collectFindMatches(text, query) {
  const matches = [];
  const needle = String(query || "");
  if (!needle) {
    return matches;
  }
  const haystack = String(text || "");
  const lowerHay = haystack.toLowerCase();
  const lowerNeedle = needle.toLowerCase();
  let from = 0;
  while (from <= lowerHay.length) {
    const at = lowerHay.indexOf(lowerNeedle, from);
    if (at === -1) {
      break;
    }
    matches.push({ start: at, end: at + needle.length });
    from = at + Math.max(1, needle.length);
  }
  return matches;
}

function openFindBar() {
  state.findOpen = true;
  elements.findBar.hidden = false;
  elements.findInput.focus();
  elements.findInput.select();
  updateFindFromQuery(elements.findInput.value, { keepIndex: true });
}

function closeFindBar() {
  state.findOpen = false;
  state.findQuery = "";
  state.findMatches = [];
  state.findIndex = 0;
  elements.findBar.hidden = true;
  elements.findInput.value = "";
  elements.findCount.textContent = "";
  refreshPreviewFromEditor();
  if (state.workspaceView !== "read") {
    elements.editor.focus();
  }
}

function applyPreviewFindHighlights() {
  const query = state.findQuery;
  if (!query || !elements.preview) {
    return;
  }
  const walker = document.createTreeWalker(elements.preview, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) {
    nodes.push(walker.currentNode);
  }
  const lowerQuery = query.toLowerCase();
  let occurrence = 0;
  nodes.forEach((node) => {
    const text = node.nodeValue || "";
    const lower = text.toLowerCase();
    if (!lower.includes(lowerQuery)) {
      return;
    }
    const frag = document.createDocumentFragment();
    let cursor = 0;
    let at = lower.indexOf(lowerQuery);
    while (at !== -1) {
      if (at > cursor) {
        frag.appendChild(document.createTextNode(text.slice(cursor, at)));
      }
      const mark = document.createElement("mark");
      mark.className = "find-hit" + (occurrence === state.findIndex ? " active" : "");
      mark.textContent = text.slice(at, at + query.length);
      frag.appendChild(mark);
      occurrence += 1;
      cursor = at + query.length;
      at = lower.indexOf(lowerQuery, cursor);
    }
    if (cursor < text.length) {
      frag.appendChild(document.createTextNode(text.slice(cursor)));
    }
    node.parentNode.replaceChild(frag, node);
  });
  const active = elements.preview.querySelector("mark.find-hit.active");
  if (active && typeof active.scrollIntoView === "function") {
    active.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
}

function revealFindMatch() {
  const total = state.findMatches.length;
  if (!state.findQuery) {
    elements.findCount.textContent = "";
    return;
  }
  if (!total) {
    elements.findCount.textContent = "0";
    refreshPreviewFromEditor();
    return;
  }
  elements.findCount.textContent = (state.findIndex + 1) + " / " + total;
  const match = state.findMatches[state.findIndex];
  if (state.workspaceView !== "read") {
    elements.editor.focus();
    elements.editor.setSelectionRange(match.start, match.end);
    const before = elements.editor.value.slice(0, match.start);
    const line = before.split("\n").length;
    const lineHeight = 22;
    elements.editor.scrollTop = Math.max(0, (line - 3) * lineHeight);
  }
  refreshPreviewFromEditor();
}

function updateFindFromQuery(query, options) {
  const keepIndex = !!(options && options.keepIndex);
  state.findQuery = String(query || "");
  state.findMatches = collectFindMatches(elements.editor.value, state.findQuery);
  if (!keepIndex || state.findIndex >= state.findMatches.length) {
    state.findIndex = 0;
  }
  revealFindMatch();
}

function stepFind(delta) {
  if (!state.findMatches.length) {
    updateFindFromQuery(elements.findInput.value);
    return;
  }
  state.findIndex = (state.findIndex + delta + state.findMatches.length) % state.findMatches.length;
  revealFindMatch();
}

function setPublishedUri(uri) {
  const cleanUri = typeof uri === "string" ? uri.trim() : "";
  if (!cleanUri) {
    elements.copyPublishedLink.classList.add("hidden");
    elements.copyPublishedLink.disabled = true;
    delete elements.copyPublishedLink.dataset.copyUri;
    return;
  }
  elements.copyPublishedLink.classList.remove("hidden");
  elements.copyPublishedLink.disabled = false;
  elements.copyPublishedLink.dataset.copyUri = cleanUri;
}

async function copyTextToClipboard(text) {
  await homeClipboard.writeText(text, { purpose: "resource.uri" });
}

async function copyPublishedUri(uri) {
  const cleanUri = typeof uri === "string" ? uri.trim() : "";
  if (!cleanUri.startsWith("elastos://")) {
    return;
  }
  await copyTextToClipboard(cleanUri);
  setStatus("Copied link.");
}

function renderHistory() {
  elements.historyPanel.innerHTML = "";
  const revisions = state.current && Array.isArray(state.current.publish_history)
    ? [...state.current.publish_history].reverse()
    : [];
  if (!revisions.length) {
    elements.historyPanel.innerHTML = '<div class="sidebar-note">No published revisions yet.</div>';
    return;
  }
  revisions.forEach((revision, index) => {
    const item = window.document.createElement("div");
    item.className = "history-item";
    const uri = "elastos://" + revision.cid;
    item.innerHTML =
      '<span class="history-kicker">Revision ' + escapeHtml(String(revisions.length - index)) + "</span>" +
      '<span class="history-title">' + escapeHtml(shortCid(revision.cid)) + "</span>" +
      '<span class="history-meta">' + escapeHtml(formatTime(revision.published_at)) + "</span>" +
      '<button class="history-link" type="button" data-copy-uri="' + escapeHtml(uri) + '">Copy link</button>';
    item.querySelector(".history-link").addEventListener("click", async (event) => {
      try {
        await copyPublishedUri(event.currentTarget.dataset.copyUri || "");
      } catch (error) {
        console.error("documents copy history link failed", error);
        setStatus(readableDocumentsError(error, "Copy failed."), "warning");
      }
    });
    elements.historyPanel.appendChild(item);
  });
}

function renderOutline(outline) {
  elements.outlinePanel.innerHTML = "";
  if (!outline.length) {
    elements.outlinePanel.innerHTML = '<div class="sidebar-note">No headings yet. Add `#` markdown headings to build an outline.</div>';
    return;
  }
  const list = window.document.createElement("div");
  list.className = "outline-list";
  outline.forEach((item) => {
    const wrapper = window.document.createElement("div");
    wrapper.className = "outline-item";
    wrapper.style.marginLeft = Math.max(0, item.depth - 1) * 12 + "px";
    wrapper.innerHTML =
      '<a class="outline-link" href="#' + escapeHtml(item.id) + '">' +
        '<span class="outline-kicker">H' + escapeHtml(String(item.depth)) + "</span>" +
        '<span class="outline-title">' + escapeHtml(item.title) + "</span>" +
      "</a>";
    wrapper.querySelector("a").addEventListener("click", (event) => {
      event.preventDefault();
      const heading = elements.preview.querySelector("#" + CSS.escape(item.id));
      if (heading) {
        heading.scrollIntoView({ block: "start", behavior: "smooth" });
      }
      setInspectorView("preview");
    });
    list.appendChild(wrapper);
  });
  elements.outlinePanel.appendChild(list);
}

function renderCurrentDocument() {
  if (!state.current) {
    elements.titleInput.value = "";
    elements.titleInput.disabled = true;
    elements.editor.value = "";
    elements.editor.disabled = true;
    elements.preview.innerHTML = '<div class="empty-state">Create or open a document.</div>';
    setPublishedUri("");
    renderHistory();
    renderOutline([]);
    setStatus("No document selected.");
    setDirty(false);
    return;
  }

  elements.titleInput.disabled = isLibraryFileProjection(state.current);
  elements.editor.disabled = false;
  elements.titleInput.value = state.current.title;
  elements.editor.value = state.current.body;
  const rendered = renderMarkdownDocument(state.current.body || "", { interactiveTasks: true });
  elements.preview.innerHTML = rendered.html;
  renderOutline(rendered.outline);

  if (state.current.latest_published_cid) {
    setPublishedUri("elastos://" + state.current.latest_published_cid);
  } else {
    setPublishedUri("");
  }

  renderHistory();
  setStatus("Ready.");
  setDirty(false);
}

function appendDocumentsListSection(label) {
  const heading = window.document.createElement("div");
  heading.className = "documents-list-section";
  heading.textContent = label;
  elements.documentsList.appendChild(heading);
}

function appendDocumentListItem(item) {

    ? '<span class="document-list-pin-icon" aria-label="Pinned" title="Pinned"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5"></path><path d="M9 3h6l1 7h2l-5 4-5-4h2z"></path></svg></span>'
    : "";
  const publishedIcon = item.latest_published_cid
    ? '<span class="document-list-published-icon" aria-label="Published" title="Published"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.4"></circle><circle cx="6" cy="12" r="2.4"></circle><circle cx="18" cy="19" r="2.4"></circle><path d="m8.2 10.7 7.5-4.4"></path><path d="m8.2 13.3 7.5 4.4"></path></svg></span>'
    : "";

  });
