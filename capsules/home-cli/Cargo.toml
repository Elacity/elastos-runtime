[package]
name = "home-cli"
version = "0.1.0"
edition = "2021"
description = "Runtime-owned ElastOS Home CLI shell"
license = "MIT"

[[bin]]
name = "home-cli"
path = "src/main.rs"

[dependencies]
elastos-guest = { path = "../../elastos/crates/elastos-guest" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true

[workspace]
