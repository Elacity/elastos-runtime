[package]
name = "chat-room-ui"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", features = ["json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "=0.3.82"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "=0.4.55"
web-sys = { version = "=0.3.82", features = [
  "Document",
  "Blob",
  "Element",
  "Event",
  "EventTarget",
  "HtmlButtonElement",
  "HtmlElement",
  "HtmlFormElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "CssStyleDeclaration",
  "Location",
  "Navigator",
  "Node",
  "RequestCredentials",
  "Storage",
  "Window"
] }
