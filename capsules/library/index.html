<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library · ElastOS</title>
  <link rel="stylesheet" href="library.css">
</head>
<body>
  <section id="locked-shell" class="locked-shell hidden">
    <div class="locked-card">
      <p class="eyebrow">ElastOS</p>
      <h1>Open from Home</h1>
      <p class="subtitle">Library needs a signed Home launch token.</p>
    </div>
  </section>

  <section id="library-shell" class="shell hidden">
    <aside class="sidebar window-sidebar">
      <h2 class="window-sidebar-title">Favorites</h2>
      <nav id="places" class="places" aria-label="Places"></nav>
    </aside>

    <main class="main">
      <header class="toolbar">
        <div class="toolbar-left">
          <button id="back-button" class="navbar-btn" type="button" title="Back" aria-label="Back"><span class="inline-icon"><img src="icons/arrow-left.svg" alt=""></span></button>
          <button id="forward-button" class="navbar-btn" type="button" title="Forward" aria-label="Forward"><span class="inline-icon"><img src="icons/arrow-right.svg" alt=""></span></button>
          <button id="up-button" class="navbar-btn" type="button" title="Up" aria-label="Up"><span class="inline-icon"><img src="icons/arrow-up.svg" alt=""></span></button>
          <section class="pathbar">
            <div id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumbs"></div>
          </section>
        </div>
        <div class="toolbar-right">
          <h2 id="current-title" class="hidden">Loading</h2>
          <span id="status-text" class="subtitle hidden">Loading Library...</span>
          <input id="search" class="search hidden" type="search" placeholder="Search" spellcheck="false">
          <button id="upload-button" class="btn hidden" type="button">Upload</button>
          <button id="new-folder-button" class="btn hidden" type="button">New folder</button>
          <div class="window-navbar-layout-toggle" role="group" aria-label="View mode">
            <button id="grid-button" class="layout-toggle-segment" type="button" title="Icons view" aria-label="Icons view">
              <span class="inline-icon"><img src="icons/layout-icons.svg" alt=""></span>
            </button>
            <button id="list-button" class="layout-toggle-segment" type="button" title="Details view" aria-label="Details view">
              <span class="inline-icon"><img src="icons/layout-details.svg" alt=""></span>
            </button>
          </div>
          <select id="sort-select" class="select hidden" aria-label="Sort objects">
            <option value="name">Name</option>
            <option value="modified">Modified</option>
            <option value="size">Size</option>
            <option value="type">Type</option>
          </select>
          <button id="refresh-button" class="btn hidden" type="button">Refresh</button>
        </div>
      </header>

      <section id="upload-progress" class="upload-progress hidden" aria-label="Upload progress" aria-live="polite"></section>
      <section id="content" class="content" data-view="grid" aria-label="Objects"></section>
      <footer class="statusbar library-footer">
        <span id="footer-left">0 objects</span>
        <span id="footer-right">Runtime provider: object-provider</span>
      </footer>
    </main>
  </section>

  <input id="file-input" class="hidden" type="file" multiple aria-label="Upload files">
  <div id="context-menu" class="context-menu hidden"></div>
  <div id="dialog" class="dialog-backdrop hidden"></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
