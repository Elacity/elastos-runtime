<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library · ElastOS</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #edf1fb;
      --bg-strong: #e3e9fb;
      --panel: rgba(255, 255, 255, 0.9);
      --panel-strong: #ffffff;
      --panel-soft: #eef2ff;
      --line: rgba(83, 103, 164, 0.14);
      --line-strong: rgba(83, 103, 164, 0.22);
      --ink: #1d2438;
      --muted: #66708a;
      --brand: #f6921a;
      --brand-soft: #fff1dc;
      --accent: #5f76d8;
      --accent-soft: #e8edff;
      --accent-deep: #3c53a7;
      --danger: #b14c5a;
      --self: #edf2ff;
      --shadow: 0 24px 60px rgba(34, 49, 88, 0.12);
      --border: var(--line);
      --border-strong: var(--line-strong);
      --text: var(--ink);
      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --mono: "SFMono-Regular", "SF Mono", "Cascadia Code", "JetBrains Mono", monospace;
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at top left, rgba(95, 118, 216, 0.14), transparent 28%),
        radial-gradient(circle at bottom right, rgba(126, 149, 226, 0.12), transparent 24%),
        linear-gradient(180deg, #f7f9ff 0%, var(--bg) 100%);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    .shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(250px, 300px) minmax(0, 1fr);
      gap: 24px;
      padding: 24px;
    }

    .sidebar,
    .main,
    .locked-card {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .sidebar {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 0;
    }

    .main {
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 0;
    }

    .locked-shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .locked-card {
      max-width: 520px;
      padding: 30px;
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    .subtitle,
    .muted {
      color: var(--muted);
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(83, 103, 164, 0.1);
    }

    .action-primary,
    .action-secondary,
    .entry-open {
      border-radius: 999px;
      border: 1px solid transparent;
      padding: 10px 15px;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      font-weight: 600;
    }

    .action-primary {
      background: var(--text);
      color: #f8fbff;
    }

    .action-primary:hover,
    .action-secondary:hover,
    .entry-open:hover {
      transform: translateY(-1px);
    }

    .action-secondary,
    .entry-open {
      background: rgba(255, 255, 255, 0.7);
      border-color: rgba(83, 103, 164, 0.12);
      color: var(--text);
    }

    .entry-open:disabled {
      cursor: default;
      opacity: 0.55;
      transform: none;
    }

    .search {
      width: 100%;
      border-radius: 999px;
      border: 1px solid rgba(83, 103, 164, 0.12);
      background: rgba(255, 255, 255, 0.72);
      padding: 12px 16px;
      color: var(--text);
    }

    .search::placeholder {
      color: rgba(102, 112, 138, 0.75);
    }

    .collection-stack,
    .summary-grid,
    .entry-list {
      display: grid;
      gap: 12px;
    }

    .collection-stack {
      gap: 8px;
    }

    .collection-button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(83, 103, 164, 0.1);
      background: rgba(255, 255, 255, 0.58);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .collection-button:hover {
      transform: translateY(-1px);
      border-color: rgba(83, 103, 164, 0.2);
    }

    .collection-button[data-active="true"] {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(95, 118, 216, 0.28);
      box-shadow: inset 0 0 0 1px rgba(95, 118, 216, 0.12);
    }

    .collection-name {
      font-weight: 700;
    }

    .collection-count {
      min-width: 1.8rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.82rem;
      text-align: center;
    }

    .summary-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .summary-card,
    .empty-state {
      border-radius: var(--radius-lg);
      border: 1px solid rgba(83, 103, 164, 0.1);
      background: rgba(255, 255, 255, 0.62);
      padding: 16px;
    }

    .summary-card strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.98rem;
    }

    .summary-value {
      display: block;
      margin-top: 6px;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .entry-list {
      min-height: 0;
      overflow: auto;
      padding-right: 4px;
    }

    .entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: flex-start;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(83, 103, 164, 0.1);
      background: var(--panel-strong);
      padding: 16px 18px;
    }

    .entry-head {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .entry-title {
      font-size: 1.04rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .entry-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.76rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .entry-badge-local {
      background: rgba(83, 103, 164, 0.08);
      color: var(--muted);
    }

    .entry-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      min-width: 132px;
    }

    .entry-updated {
      color: var(--muted);
      font-size: 0.84rem;
      text-align: right;
    }

    @media (max-width: 980px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .shell {
        gap: 8px;
        padding: 4px;
      }

      .sidebar,
      .main,
      .locked-card {
        border-radius: 14px;
        box-shadow: 0 10px 26px rgba(34, 49, 88, 0.08);
      }

      .sidebar,
      .main {
        padding: 8px;
        gap: 8px;
      }

      .toolbar {
        display: grid;
        gap: 8px;
      }

      .entry {
        grid-template-columns: 1fr;
        padding: 8px;
        gap: 8px;
      }

      .entry-actions {
        align-items: flex-start;
        min-width: 0;
      }

      .entry-updated {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <section id="locked-shell" class="locked-shell hidden">
    <div class="locked-card">
      <p class="eyebrow">ElastOS</p>
      <h1>Open from Home</h1>
      <p class="subtitle">Browse documents.</p>
    </div>
  </section>

  <section id="library-shell" class="shell hidden">
    <aside class="sidebar">
      <div>
        <p class="eyebrow">Home</p>
        <h1 id="sidebar-title">Documents</h1>
        <p id="sidebar-subtitle" class="subtitle">Find and open documents.</p>
      </div>
      <button id="new-document" class="action-primary" type="button">New document</button>
      <input id="search" class="search" type="search" placeholder="Search documents" spellcheck="false">
      <div class="collection-stack" aria-label="Collections">
        <button class="collection-button" type="button" data-filter="all" data-active="true">
          <span class="collection-name">All</span>
          <span id="all-count" class="collection-count">0</span>
        </button>
        <button class="collection-button" type="button" data-filter="drafts" data-active="false">
          <span class="collection-name">Drafts</span>
          <span id="draft-count" class="collection-count">0</span>
        </button>
        <button class="collection-button" type="button" data-filter="published" data-active="false">
          <span class="collection-name">Published</span>
          <span id="published-filter-count" class="collection-count">0</span>
        </button>
        <button class="collection-button" type="button" data-filter="recent" data-active="false">
          <span class="collection-name">Recent</span>
          <span id="recent-count" class="collection-count">0</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div>
          <p class="eyebrow">Documents</p>
          <h2 id="main-title">Browse</h2>
          <p id="status-text" class="subtitle">Loading...</p>
        </div>
      </div>

      <section class="summary-grid">
        <article class="summary-card">
          <strong>All</strong>
          <span id="objects-count" class="summary-value">0</span>
        </article>
        <article class="summary-card">
          <strong>Drafts</strong>
          <span id="drafts-count" class="summary-value">0</span>
        </article>
        <article class="summary-card">
          <strong>Published</strong>
          <span id="published-count" class="summary-value">0</span>
        </article>
      </section>

      <section id="entry-list" class="entry-list"></section>
      <section id="empty-state" class="empty-state hidden">
        <strong id="empty-title">No matching documents</strong>
        <p id="empty-body" class="muted">Try a different search, or create a new document.</p>
      </section>
    </main>
  </section>

  <script>
    const queryParams = new URLSearchParams(window.location.search);
    const state = {
      homeToken: queryParams.get("home_token") || "",
      mode: queryParams.get("mode") === "attach" ? "attach" : "browse",
      returnTarget: queryParams.get("returnTarget") || "",
      documents: [],
      filterQuery: "",
      activeFilter: "all",
    };
    document.body.dataset.libraryMode = state.mode;

    const elements = {
      lockedShell: document.getElementById("locked-shell"),
      libraryShell: document.getElementById("library-shell"),
      statusText: document.getElementById("status-text"),
      objectsCount: document.getElementById("objects-count"),
      draftsCount: document.getElementById("drafts-count"),
      publishedCount: document.getElementById("published-count"),
      allCount: document.getElementById("all-count"),
      draftCount: document.getElementById("draft-count"),
      publishedFilterCount: document.getElementById("published-filter-count"),
      recentCount: document.getElementById("recent-count"),
      entryList: document.getElementById("entry-list"),
      emptyState: document.getElementById("empty-state"),
      emptyTitle: document.getElementById("empty-title"),
      emptyBody: document.getElementById("empty-body"),
      search: document.getElementById("search"),
      newDocument: document.getElementById("new-document"),
      sidebarTitle: document.getElementById("sidebar-title"),
      sidebarSubtitle: document.getElementById("sidebar-subtitle"),
      mainTitle: document.getElementById("main-title"),
      filterButtons: Array.from(document.querySelectorAll("[data-filter]")),
    };

    function isAttachMode() {
      return state.mode === "attach" && state.returnTarget === "chat-room";
    }

    function isPublished(item) {
      return typeof item.latest_published_cid === "string" && item.latest_published_cid.trim().length > 0;
    }

    function publishedUri(item) {
      return isPublished(item) ? "elastos://" + item.latest_published_cid.trim() : "";
    }

    function isRecent(item) {
      const updatedAt = Number(item.updated_at || 0);
      if (!updatedAt) {
        return false;
      }
      const ageSeconds = Math.max(0, Math.floor(Date.now() / 1000) - updatedAt);
      return ageSeconds <= 7 * 24 * 60 * 60;
    }

    function matchesFilter(item) {
      switch (state.activeFilter) {
        case "drafts":
          return !isPublished(item);
        case "published":
          return isPublished(item);
        case "recent":
          return isRecent(item);
        default:
          return true;
      }
    }

    function filterLabel() {
      switch (state.activeFilter) {
        case "drafts":
          return "draft";
        case "published":
          return "published document";
        case "recent":
          return "recent document";
        default:
          return "document";
      }
    }

    function filterLabelPlural() {
      switch (state.activeFilter) {
        case "drafts":
          return "drafts";
        case "published":
          return "published documents";
        case "recent":
          return "recent documents";
        default:
          return "documents";
      }
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatRelativeTime(timestamp) {
      if (!timestamp) {
        return "Just now";
      }
      const seconds = Math.max(0, Math.floor(Date.now() / 1000) - Number(timestamp));
      if (seconds < 60) {
        return "Just now";
      }
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) {
        return minutes === 1 ? "1 minute ago" : minutes + " minutes ago";
      }
      const hours = Math.floor(minutes / 60);
      if (hours < 24) {
        return hours === 1 ? "1 hour ago" : hours + " hours ago";
      }
      const days = Math.floor(hours / 24);
      if (days < 7) {
        return days === 1 ? "1 day ago" : days + " days ago";
      }
      return new Date(Number(timestamp) * 1000).toLocaleDateString();
    }

    async function libraryApi(path, options) {
      const response = await fetch(path, {
        method: (options && options.method) || "GET",
        headers: {
          "content-type": "application/json",
          "x-elastos-home-token": state.homeToken,
        },
        body: options && options.body ? options.body : undefined,
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.message || payload.error || ("Request failed: " + response.status));
      }
      return payload;
    }

    async function documentsProviderApi(op, payload) {
      const response = await libraryApi("/api/provider/documents/" + encodeURIComponent(op), {
        method: "POST",
        body: JSON.stringify(payload || {}),
      });
      return response.data || response;
    }

    function shellOpenTarget(target, query) {
      const message = {
        type: "home:open-target",
        target: target,
        query: query || {},
        homeToken: state.homeToken,
      };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(message, window.location.origin);
        return true;
      }
      return false;
    }

    function shellDeliverToTarget(target, payload) {
      const message = {
        type: "home:deliver-to-target",
        target: target,
        payload: payload || {},
        homeToken: state.homeToken,
      };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(message, window.location.origin);
        return true;
      }
      return false;
    }

    function shellCloseSelf() {
      const message = {
        type: "home:close-self",
        homeToken: state.homeToken,
      };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(message, window.location.origin);
        return true;
      }
      return false;
    }

    function openDocuments(docDid, intent) {
      const query = {};
      if (docDid) {
        query.doc = docDid;
      }
      if (intent) {
        query.intent = intent;
      }
      if (shellOpenTarget("documents", query)) {
        return;
      }
      setStatus("Open Documents from Home.");
    }

    function attachDocument(item) {
      const uri = publishedUri(item);
      if (!uri) {
        setStatus("Publish the document before attaching it.");
        return;
      }
      if (shellDeliverToTarget(state.returnTarget, {
        type: "chat-room:attach-library-item",
        uri,
        title: item.title || "",
        documentUri: item.document_uri || "",
      })) {
        setStatus("Attached to Chat Room.");
        window.setTimeout(shellCloseSelf, 80);
        return;
      }
      setStatus("Open Chat Room from Home.");
    }

    function setStatus(text) {
      elements.statusText.textContent = text;
    }

    function showEmptyState(title, body) {
      elements.emptyTitle.textContent = title;
      elements.emptyBody.textContent = body;
      elements.emptyState.classList.remove("hidden");
    }

    function syncModeChrome() {
      if (isAttachMode()) {
        elements.sidebarTitle.textContent = "Library";
        elements.sidebarSubtitle.textContent = "Choose a published document.";
        elements.mainTitle.textContent = "Attach to Chat Room";
        elements.newDocument.hidden = true;
        return;
      }
      elements.sidebarTitle.textContent = "Documents";
      elements.sidebarSubtitle.textContent = "Find and open documents.";
      elements.mainTitle.textContent = "Browse";
      elements.newDocument.hidden = false;
    }

    function renderSummary() {
      const publishedCount = state.documents.filter(isPublished).length;
      const draftCount = state.documents.length - publishedCount;
      const recentCount = state.documents.filter(isRecent).length;
      elements.objectsCount.textContent = String(state.documents.length);
      elements.draftsCount.textContent = String(draftCount);
      elements.publishedCount.textContent = String(publishedCount);
      elements.allCount.textContent = String(state.documents.length);
      elements.draftCount.textContent = String(draftCount);
      elements.publishedFilterCount.textContent = String(publishedCount);
      elements.recentCount.textContent = String(recentCount);
      syncActiveFilterButtons();
    }

    function syncActiveFilterButtons() {
      for (const button of elements.filterButtons) {
        button.dataset.active = button.dataset.filter === state.activeFilter ? "true" : "false";
      }
    }

    function renderEntries() {
      const query = state.filterQuery.trim().toLowerCase();
      const visible = state.documents.filter((item) => {
        if (!matchesFilter(item)) {
          return false;
        }
        if (!query) {
          return true;
        }
        return [
          item.title,
          item.file_name,
          item.document_uri,
          item.working_copy_uri,
          item.latest_published_cid || "",
        ].join("\n").toLowerCase().includes(query);
      });

      elements.entryList.innerHTML = "";
      elements.emptyState.classList.toggle("hidden", visible.length > 0);
      setStatus(
        query
          ? `${visible.length} matching ${visible.length === 1 ? filterLabel() : filterLabelPlural()}.`
          : `${visible.length} ${visible.length === 1 ? filterLabel() : filterLabelPlural()}.`
      );
      if (!visible.length) {
        showEmptyState(
          query ? "No matching documents" : `No ${filterLabelPlural()} here`,
          query
            ? "Try a different search."
            : state.activeFilter === "all"
              ? "Create a new document to get started."
              : "Switch collections or create a new document."
        );
        return;
      }

      for (const item of visible) {
        const article = document.createElement("article");
        const uri = publishedUri(item);
        const buttonLabel = isAttachMode() ? (uri ? "Attach" : "Publish first") : "Open";
        const disabled = isAttachMode() && !uri ? "disabled" : "";
        article.className = "entry";
        article.dataset.docDid = item.doc_did;
        article.dataset.attachUri = uri;
        article.innerHTML = `
          <div class="entry-main">
            <div class="entry-head">
              <span class="entry-title">${escapeHtml(item.title)}</span>
              ${
                isPublished(item)
                  ? '<span class="entry-badge">Published</span>'
                  : '<span class="entry-badge entry-badge-local">Draft</span>'
              }
            </div>
          </div>
          <div class="entry-actions">
            <div class="entry-updated">Updated ${escapeHtml(formatRelativeTime(item.updated_at))}</div>
            <button class="entry-open" type="button" data-doc-did="${escapeHtml(item.doc_did)}" data-attach-uri="${escapeHtml(uri)}" ${disabled}>${buttonLabel}</button>
          </div>
        `;
        elements.entryList.appendChild(article);
      }
    }

    async function loadSummary() {
      const summary = await documentsProviderApi("summary");
      state.documents = Array.isArray(summary.documents) ? summary.documents.slice() : [];
      state.documents.sort((left, right) => Number(right.updated_at || 0) - Number(left.updated_at || 0));
      renderSummary();
      renderEntries();
    }

    function bindEvents() {
      elements.search.addEventListener("input", () => {
        state.filterQuery = elements.search.value || "";
        renderEntries();
      });

      for (const button of elements.filterButtons) {
        button.addEventListener("click", () => {
          state.activeFilter = button.dataset.filter || "all";
          renderSummary();
          renderEntries();
        });
      }

      elements.newDocument.addEventListener("click", () => {
        openDocuments("", "new");
      });

      elements.entryList.addEventListener("click", (event) => {
        const target = event.target instanceof Element ? event.target : null;
        if (!target) {
          return;
        }
        const button = target.closest(".entry-open");
        const docDid = button && button.dataset.docDid;
        if (!docDid) {
          return;
        }
        if (isAttachMode()) {
          const item = state.documents.find((candidate) => candidate.doc_did === docDid);
          if (item) {
            attachDocument(item);
          }
          return;
        }
        openDocuments(docDid);
      });
    }

    async function boot() {
      document.title = "Library · ElastOS";
      if (!state.homeToken) {
        elements.lockedShell.classList.remove("hidden");
        return;
      }
      elements.libraryShell.classList.remove("hidden");
      syncModeChrome();
      bindEvents();
      try {
        await loadSummary();
      } catch (error) {
        elements.entryList.innerHTML = "";
        showEmptyState("Could not load documents", error.message || "The document browser is unavailable.");
        setStatus(error.message || "Could not load documents.");
      }
    }

    boot();
  </script>
</body>
</html>
