[package]
name = "chain-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS chain provider capsule - typed access to production chain backends"
license = "MIT"

[[bin]]
name = "chain-provider"
path = "src/main.rs"

[dependencies]
elastos-guest = { path = "../../elastos/crates/elastos-guest" }
elastos-protected-content-contracts = { path = "../../elastos/crates/elastos-protected-content-contracts" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"

[dev-dependencies]
elastos-auth = { path = "../../elastos/crates/elastos-auth" }
ed25519-dalek = "2.1"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"

[profile.release]
opt-level = "s"
lto = true

[workspace]
