[package]
name = "chain-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS chain provider capsule - typed access to production chain backends"
license = "MIT"

[[bin]]
name = "chain-provider"
path = "src/main.rs"

[dependencies]
elastos-guest = { path = "../../elastos/crates/elastos-guest" }
elastos-logger = { path = "../../elastos/crates/elastos-logger" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"

[dev-dependencies]

[profile.release]
opt-level = "s"
lto = true

[workspace]
