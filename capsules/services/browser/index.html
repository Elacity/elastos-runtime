<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services · ElastOS</title>
  <script src="./elastos-theme.js"></script>
  <link rel="stylesheet" href="./elastos-ui.css">
  <link rel="stylesheet" href="./style.css?v=services-20260717a">
</head>
<body>
  <section id="locked-shell" class="locked-shell hidden">
    <div class="locked-card">
      <p class="eyebrow">ElastOS</p>
      <h1>Open from Home</h1>
      <p class="subtitle">Open Services from Home.</p>
    </div>
  </section>

  <main id="services-shell" class="settings-container hidden" aria-label="Services">
    <div class="settings">
      <aside class="settings-sidebar" aria-label="Service sections">
        <button class="settings-sidebar-item active" type="button" data-section-target="mine-services">
          <span class="settings-sidebar-icon settings-sidebar-icon-mine" aria-hidden="true"></span>
          <span class="settings-sidebar-text">This device</span>
          <strong id="mine-count">0</strong>
        </button>
        <button class="settings-sidebar-item" type="button" data-section-target="other-services">
          <span class="settings-sidebar-icon settings-sidebar-icon-others" aria-hidden="true"></span>
          <span class="settings-sidebar-text">From People</span>
          <strong id="others-count">0</strong>
        </button>
      </aside>

      <div class="settings-content-container">
        <section class="settings-content active" aria-label="Services">
          <div class="services-toolbar">
            <button id="refresh-services" class="pc2-btn" type="button">Refresh</button>
          </div>

          <div id="services-status" class="services-status" role="status" hidden></div>

          <section id="mine-services" class="pc2-section" aria-labelledby="mine-services-title">
            <h2 id="mine-services-title" class="pc2-section-title">Shared from this device</h2>
            <div id="mine-services-list" class="services-list"></div>
          </section>

          <section id="other-services" class="pc2-section" aria-labelledby="other-services-title">
            <h2 id="other-services-title" class="pc2-section-title">Available from People</h2>
            <div id="other-services-list" class="services-list"></div>
          </section>
        </section>
      </div>
    </div>
  </main>

  <script type="module" src="./services.js?v=services-20260711i"></script>
</body>
</html>
