[package]
name = "operator-drive-adapter"
version = "0.1.0"
edition = "2021"
description = "ElastOS operator WebSpace resolver adapter capsule"
license = "MIT"

[[bin]]
name = "operator-drive-adapter"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true

[workspace]
