[package]
name = "object-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS object provider capsule - principal-root object authority"
license = "MIT"

[[bin]]
name = "object-provider"
path = "src/main.rs"

[dependencies]
elastos-server = { path = "../../elastos/crates/elastos-server" }
serde_json = "1.0"
# Keep the distributed-topic-tracker / ed25519-dalek 3 pre-release chain pinned
# to the same rc versions as the main workspace. Without these direct pins,
# Cargo can resolve stable ed25519/pkcs8 versions that do not compile with
# ed25519-dalek 3.0.0-pre.1.
ed25519 = "=3.0.0-rc.4"
pkcs8 = "=0.11.0-rc.10"
der = "=0.8.0-rc.10"
spki = "=0.8.0-rc.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true

[workspace]
