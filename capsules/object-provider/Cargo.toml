[package]
name = "object-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS object provider capsule - principal-root object authority"
license = "MIT"

[[bin]]
name = "object-provider"
path = "src/main.rs"

[dependencies]
elastos-server = { path = "../../elastos/crates/elastos-server" }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true

[workspace]
