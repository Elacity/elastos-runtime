<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System · ElastOS</title>
<link rel="stylesheet" href="./style.css?v=system-20260426a">
</head>
<body data-shell-window-fit="fixed">
  <main class="system-shell" aria-label="System">
    <section class="system-grid" aria-label="System details">
      <section class="system-panel" aria-labelledby="identity-title">
        <h2 id="identity-title">Identity</h2>
        <dl class="system-fields">
          <div class="system-field">
            <dt>Device identity</dt>
            <dd class="system-value">
              <code data-field="device-did"></code>
            </dd>
          </div>
          <div class="system-field">
            <dt>Handle</dt>
            <dd class="system-control">
              <form id="handle-form" class="system-inline-form">
                <label class="visually-hidden" for="handle-input">Handle</label>
                <div class="system-inline-row">
                  <input id="handle-input" class="system-input" type="text" maxlength="32" autocomplete="nickname" placeholder="Your handle">
                  <button id="handle-save" class="system-button" type="submit">Save</button>
                </div>
              </form>
            </dd>
            <dd class="system-note system-status" data-field="handle-status" hidden></dd>
          </div>
        </dl>
      </section>

      <section class="system-panel" aria-labelledby="runtime-title">
        <h2 id="runtime-title">Runtime</h2>
        <dl class="system-fields">
          <div class="system-field">
            <dt>Version</dt>
            <dd class="system-value">
              <span class="system-value-text" data-field="runtime-status" hidden></span>
            </dd>
          </div>
        </dl>
      </section>

      <section class="system-panel" aria-labelledby="storage-title">
        <h2 id="storage-title">Storage</h2>
        <dl class="system-fields">
          <div class="system-field">
            <dt>Documents</dt>
            <dd class="system-value">
              <span class="system-value-text" data-field="storage-status" hidden></span>
            </dd>
            <dd class="system-note" data-field="storage-note" hidden></dd>
          </div>
        </dl>
      </section>

      <section class="system-panel" aria-labelledby="appearance-title">
        <h2 id="appearance-title">Appearance</h2>
        <dl class="system-fields">
          <div class="system-field">
            <dt>Background</dt>
            <dd class="system-control background-control">
              <div id="background-preview" class="background-preview" aria-hidden="true"></div>
              <div class="system-inline-row background-actions">
                <label class="system-button system-file-button" for="background-input">Choose image</label>
                <input id="background-input" class="visually-hidden" type="file" accept="image/png,image/jpeg,image/webp,image/gif" aria-label="Choose background image">
                <button id="background-reset" class="system-button system-button-secondary" type="button">Reset</button>
              </div>
              <div class="background-overlay-panel">
                <label class="system-switch">
                  <input id="background-overlay" type="checkbox" aria-label="Add contrast over background">
                  <span class="system-switch-track" aria-hidden="true"></span>
                  <span class="system-switch-text">Add contrast over background</span>
                </label>
                <div id="background-overlay-range" class="system-range" hidden>
                  <label class="system-range-label" for="background-overlay-opacity">
                    <span>Overlay strength</span>
                    <output id="background-overlay-opacity-value" for="background-overlay-opacity">55%</output>
                  </label>
                  <input id="background-overlay-opacity" class="system-range-input" type="range" min="0" max="80" step="5" value="55" aria-label="Overlay strength">
                </div>
              </div>
            </dd>
            <dd class="system-note system-status" data-field="background-status" hidden></dd>
            <dd class="system-note system-status" data-field="overlay-status" hidden></dd>
          </div>
        </dl>
      </section>
    </section>

    <p class="system-error" hidden></p>
  </main>
  <script type="module" src="./system.js?v=system-20260426a"></script>
</body>
</html>
