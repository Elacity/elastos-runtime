[package]
name = "availability-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS content availability provider capsule"
license = "MIT"

[[bin]]
name = "availability-provider"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2", features = ["json"] }
url = "2"
# For the per-target `tls_server_name` verification override (same rustls stack ureq
# uses; ring backend to match ureq's provider selection).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[dev-dependencies]

[profile.release]
opt-level = "s"
lto = true

[workspace]
