[package]
name = "availability-provider"
version = "0.1.0"
edition = "2021"
description = "ElastOS content availability provider capsule"
license = "MIT"

[[bin]]
name = "availability-provider"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2", features = ["json"] }
url = "2"

[dev-dependencies]

[profile.release]
opt-level = "s"
lto = true

[workspace]
