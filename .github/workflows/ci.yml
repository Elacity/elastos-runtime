name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check + Clippy + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: elastos
      - name: cargo fmt
        working-directory: elastos
        run: cargo fmt --all -- --check
      - name: architecture entropy checks
        run: |
          bash scripts/check-wci-alignment.sh
          node scripts/home-entropy-check.mjs
          node scripts/browser-entropy-check.mjs
      - name: product UI source proofs
        run: |
          node scripts/home-shell-regression-smoke.mjs
          node scripts/people-discovery-smoke.mjs
      - name: Browser close handshake
        run: node --test scripts/browser-window-close-handshake.test.mjs
      - name: cargo clippy
        working-directory: elastos
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo check
        working-directory: elastos
        run: cargo check --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: elastos
      - name: build provider process binaries for tests
        run: |
          cargo build --release --manifest-path capsules/protected-content-protect-provider/Cargo.toml --target-dir capsules/protected-content-protect-provider/target
          cargo build --release --manifest-path capsules/protected-content-decrypt-provider/Cargo.toml --target-dir capsules/protected-content-decrypt-provider/target
          cargo build --release --manifest-path capsules/custody-provider/Cargo.toml --target-dir capsules/custody-provider/target
      - name: cargo test
        working-directory: elastos
        env:
          ELASTOS_TEST_PROTECT_PROVIDER_BIN: ${{ github.workspace }}/capsules/protected-content-protect-provider/target/release/protected-content-protect-provider
          ELASTOS_TEST_DECRYPT_PROVIDER_BIN: ${{ github.workspace }}/capsules/protected-content-decrypt-provider/target/release/protected-content-decrypt-provider
          ELASTOS_TEST_CUSTODY_PROVIDER_BIN: ${{ github.workspace }}/capsules/custody-provider/target/release/custody-provider
        run: cargo test --workspace
        # Network-sensitive tests are #[ignore] and won't run.
        # Run them explicitly with: cargo test --workspace -- --ignored

  build-release:
    name: Build Release (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: elastos
      - name: cargo build --release
        working-directory: elastos
        run: cargo build --workspace --release
