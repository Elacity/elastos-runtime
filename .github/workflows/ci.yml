name: CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check out and test"
        required: false
        default: ""
  push:
    # develop pushes keep the shared build caches warm for every PR into develop.
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Reviewed ARM64 archive pin, shared by the producer and every CI consumer.
  CI_LLAMA_ARM64_SHA256: a92e404708feae91cbede43322e445971450de8a204f4ff51502a7f42f5df8b8
  # An explicit dispatch ref may select a tag independently of the workflow ref.
  CI_USE_CACHE: ${{ github.ref_type != 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.ref != '') }}
  # Only develop/main pushes write shared caches (Rust, apt, Kubo,
  # BuildKit). PR and merge-queue runs only read them.
  CI_SAVE_CACHE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}

jobs:
  # Fast, compile-free gate: formatting and script-based source proofs.
  # Everything compile-heavy (clippy, tests, source-home) fans out in
  # parallel once this passes.
  source-gate:
    name: source-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@72504271e02fb719eb4eb3eaece3a8e3d06f57c0 # 1.91.0
        with:
          components: rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'

      - name: cargo fmt
        working-directory: elastos
        run: cargo fmt --all -- --check
      - name: product data contracts
        run: node scripts/check-product-data.mjs
      - name: local pre-push gate behavior
        run: python3 scripts/ci-local-prepush-test.py
      - name: product UI source proofs
        run: |
          node --version
          node scripts/home-shell-regression-smoke.mjs
          node scripts/home-shell-bridge-smoke.mjs
          node scripts/home-agent-shell-smoke.mjs
          node scripts/people-discovery-smoke.mjs
          node --test scripts/chat-room-reconnect.test.mjs
      - name: release artifact source proofs
        run: |
          node --test scripts/ci-model-package.test.mjs scripts/ci-installed-home-failure.test.mjs
          python3 scripts/ci-release-policy-test.py
          python3 scripts/ci-download-cache-test.py
          python3 scripts/components-release-integrity-check.py --self-test
          python3 scripts/publish-platform-artifacts-test.py
          python3 scripts/release-platform-input-test.py
          python3 scripts/prepare-release-platform-test.py
          python3 scripts/media-tools-build-test.py
          python3 scripts/verify-linux-arm64-package-test.py
          python3 scripts/update-hop-compare-test.py
          python3 .github/scripts/release-mac-capacity-test.py

  test-behaviour:
    name: test-behaviour
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: source-gate
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: install explicit Browser test inputs
        timeout-minutes: 5
        env:
          DEBUG: pw:install
        run: |
          npm install --prefix "${RUNNER_TEMP}/behaviour-browser" --no-save --package-lock=false playwright@1.60.0
          npm install --prefix "${RUNNER_TEMP}/behaviour-core" --no-save --package-lock=false playwright-core@1.59.1
          "${RUNNER_TEMP}/behaviour-browser/node_modules/.bin/playwright" install chromium --with-deps --only-shell
      - name: JavaScript behavior tests
        env:
          NODE_PATH: ${{ runner.temp }}/behaviour-browser/node_modules
          BROWSER_OPERATOR_PLAYWRIGHT_CORE: ${{ runner.temp }}/behaviour-core/node_modules/playwright-core
        run: |
          python3 scripts/browser-vm-linux-network.test.py
          node --test --test-timeout=60000 elastos/esp/projections.test.mjs scripts/*.test.mjs scripts/build/*.test.mjs scripts/lib/*.test.mjs capsules/*/browser/*.test.mjs capsules/*/browser/src/*.test.mjs scripts/home-fixture-contracts-smoke.mjs scripts/documents-save-conflict-smoke.mjs scripts/gba-save-conflict-smoke.mjs

  # One input for every ARM consumer. PRs restore their develop base's cache;
  # only a develop push can save a verified recipe result in this namespace.
  engine-llama-arm64:
    name: engine-llama-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    needs: source-gate
    container:
      image: ubuntu@sha256:1cc7bb38a74c0e126716646e47c0b3c5c139547d386d5ff7a64cf3ea316ca523
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      BUILD_CONTAINER_IMAGE: ubuntu@sha256:1cc7bb38a74c0e126716646e47c0b3c5c139547d386d5ff7a64cf3ea316ca523
      ENGINE_BUILD_TOOLS: build-essential cmake git ca-certificates curl binutils file python3
    steps:
      - name: install engine build tools
        run: |
          apt-get update -qq
          read -r -a tools <<< "$ENGINE_BUILD_TOOLS"
          apt-get install -y -qq --no-install-recommends "${tools[@]}"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          persist-credentials: false
      - name: bind engine cache to build recipe
        id: engine-recipe
        run: |
          recipe_hash=$( {
            cat scripts/build/build-llama-server-bundle.sh
            printf '\n%s\n%s\n' "$BUILD_CONTAINER_IMAGE" "$ENGINE_BUILD_TOOLS"
          } | sha256sum | cut -d ' ' -f 1)
          echo "cache-key=develop-llama-arm64-${recipe_hash}" >> "$GITHUB_OUTPUT"
      - name: restore pinned ARM64 engine
        id: engine-cache
        if: env.CI_USE_CACHE == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/llama-arm64-bundle
          key: ${{ steps.engine-recipe.outputs.cache-key }}
      - name: build and validate pinned ARM64 engine
        id: engine-build
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          RECIPE_COMMIT="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)"
          export RECIPE_COMMIT
          bash scripts/build/build-llama-server-bundle.sh "$RUNNER_TEMP/llama-arm64-bundle"
      - name: verify accepted ARM64 engine archive
        run: bash scripts/build/build-llama-server-bundle.sh --verify-archive "$RUNNER_TEMP/llama-arm64-bundle"
      - name: save pinned ARM64 engine
        if: env.CI_USE_CACHE == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/llama-arm64-bundle
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - name: upload pinned ARM64 engine input
        # Retain build receipts on a pin mismatch for review; dependent jobs
        # require this job to succeed before they can consume the archive.
        if: "!cancelled() && (steps.engine-cache.outputs.cache-hit == 'true' || steps.engine-build.outcome == 'success')"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: llama-arm64-bundle
          path: ${{ runner.temp }}/llama-arm64-bundle/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: source-gate
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@72504271e02fb719eb4eb3eaece3a8e3d06f57c0 # 1.91.0
        with:
          components: clippy
      - name: configure Rust compile cache
        if: env.CI_USE_CACHE == 'true'
        uses: ./.github/actions/rust-compile-cache
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: env.CI_USE_CACHE == 'true'
        with:
          workspaces: elastos
          prefix-key: ${{ runner.os }}-elastos-bd
          cache-targets: false
          cache-bin: false
          save-if: ${{ env.CI_SAVE_CACHE == 'true' }}
      # clippy runs the full type-check pass, so a separate `cargo check`
      # would be redundant.
      - name: cargo clippy
        working-directory: elastos
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust compile cache statistics
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats

  test-elastos:
    name: test-elastos
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: source-gate
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@72504271e02fb719eb4eb3eaece3a8e3d06f57c0 # 1.91.0
      - name: configure Rust compile cache
        if: env.CI_USE_CACHE == 'true'
        uses: ./.github/actions/rust-compile-cache
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: env.CI_USE_CACHE == 'true'
        with:
          workspaces: elastos
          prefix-key: ${{ runner.os }}-elastos-test-bd
          cache-targets: false
          cache-bin: false
          save-if: ${{ env.CI_SAVE_CACHE == 'true' }}
      - name: build provider process binaries for tests
        run: |
          cargo build --release --manifest-path capsules/protected-content-protect-provider/Cargo.toml --target-dir capsules/protected-content-protect-provider/target
          cargo build --release --manifest-path capsules/protected-content-decrypt-provider/Cargo.toml --target-dir capsules/protected-content-decrypt-provider/target
          cargo build --release --manifest-path capsules/custody-provider/Cargo.toml --target-dir capsules/custody-provider/target
      - name: cargo test
        working-directory: elastos
        env:
          ELASTOS_TEST_PROTECT_PROVIDER_BIN: ${{ github.workspace }}/capsules/protected-content-protect-provider/target/release/protected-content-protect-provider
          ELASTOS_TEST_DECRYPT_PROVIDER_BIN: ${{ github.workspace }}/capsules/protected-content-decrypt-provider/target/release/protected-content-decrypt-provider
          ELASTOS_TEST_CUSTODY_PROVIDER_BIN: ${{ github.workspace }}/capsules/custody-provider/target/release/custody-provider
        run: cargo test --workspace --no-fail-fast
        # Network-sensitive tests are #[ignore] and won't run.
        # Run them explicitly with: cargo test --workspace -- --ignored
      - name: list workspace tests
        working-directory: elastos
        run: |
          set -euo pipefail
          cargo test --workspace -- --list | tee "${RUNNER_TEMP}/elastos-test-list.txt"
          total=$(awk '/: test$/ {n++} END {print n+0}' "${RUNNER_TEMP}/elastos-test-list.txt")
          echo "Workspace listed tests: ${total}" | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: native network isolation and loopback proxy
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cargo build --quiet --manifest-path elastos/tools/browser-engine-supervisor/Cargo.toml
          cargo build --quiet --manifest-path elastos/tools/browser-native-proxy-engine/Cargo.toml
          git rev-parse HEAD HEAD^{tree}
          sha256sum elastos/tools/browser-engine-supervisor/target/debug/browser-engine-supervisor elastos/tools/browser-native-proxy-engine/target/debug/browser-native-proxy-engine
          sudo -n bash scripts/browser-native-supervisor-proxy-smoke.sh --prebuilt --require-isolation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: install content boundary browser fixture
        timeout-minutes: 5
        env:
          DEBUG: pw:install
        run: |
          # 1.60 fixes ZIP extraction hanging on Node 26 (Playwright #40747).
          npm install --prefix "${RUNNER_TEMP}/content-sandbox-browser" --no-save --package-lock=false playwright@1.60.0
          "${RUNNER_TEMP}/content-sandbox-browser/node_modules/.bin/playwright" install chromium --with-deps --only-shell
      - name: gateway content sandbox browser regression
        working-directory: elastos
        env:
          ELASTOS_PLAYWRIGHT_MODULE: ${{ runner.temp }}/content-sandbox-browser/node_modules/playwright/index.mjs
        run: cargo test -p elastos-server content_sandbox_browser -- --ignored --nocapture
      - name: Rust compile cache statistics
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats

  test-capsules:
    name: test-capsules
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: source-gate
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@72504271e02fb719eb4eb3eaece3a8e3d06f57c0 # 1.91.0
        with:
          targets: wasm32-unknown-unknown
      - name: configure Rust compile cache
        if: env.CI_USE_CACHE == 'true'
        uses: ./.github/actions/rust-compile-cache
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: env.CI_USE_CACHE == 'true'
        with:
          # Registry/index cache only; sccache owns compilation reuse.
          workspaces: elastos
          prefix-key: ${{ runner.os }}-capsules-bd
          cache-targets: false
          cache-bin: false
          save-if: ${{ env.CI_SAVE_CACHE == 'true' }}
      # The elastos workspace suite never builds or tests own-workspace
      # capsules; this mirrors `just test-capsules`.
      - name: lint and test own-workspace capsules
        run: |
          set -uo pipefail
          failed=0
          for lock in capsules/*/Cargo.lock; do
              capsule="$(dirname "$lock")"
              echo "== linting $capsule =="
              (cd "$capsule" && cargo clippy --all-targets -- -D warnings) || failed=1
              echo "== testing $capsule =="
              (cd "$capsule" && cargo test --no-fail-fast) || failed=1
          done
          exit "$failed"
      # Playwright 1.59.1's installer hangs extracting Chromium under Node 26;
      # the smokes themselves run on Node 26 below.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: install browser layout smoke tools
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y just
          npm ci --prefix elastos/tools/browser-playwright-engine
          npx --prefix elastos/tools/browser-playwright-engine playwright install --with-deps chromium
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      # The smokes default to a macOS Brave install unless BRAVE_BIN is set.
      - name: browser layout smokes
        run: |
          BRAVE_BIN="$(cd elastos/tools/browser-playwright-engine && node -p "require('playwright').chromium.executablePath()")"
          export BRAVE_BIN
          just product-ui-browser

      - name: list own-workspace capsule tests
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/capsules-test-list.txt"
          for lock in capsules/*/Cargo.lock; do
              capsule="$(dirname "$lock")"
              echo "== listing $capsule =="
              (cd "$capsule" && cargo test -- --list) | tee -a "${RUNNER_TEMP}/capsules-test-list.txt"
          done
          total=$(awk '/: test$/ {n++} END {print n+0}' "${RUNNER_TEMP}/capsules-test-list.txt")
          echo "Capsules listed tests: ${total}" | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Rust compile cache statistics
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats

  # Rehearses the ELACITY-2298 dKMS ceremony (offline custody composition +
  # Carrier dial-proof preflight) against a fresh instance of the
  # deploy/custody-host 3-node compose harness -- scripts/custody-harness-ci-smoke.sh
  # owns all the logic (throwaway client identity, throwaway compose
  # project, receipt assertions, full teardown); this job is thin glue over
  # it. Trusted develop/main pushes warm the shared image cache. Runs also for
  # every merge group, workflow_dispatch, and PRs that touch the harness
  # image, the proof driver, or the protected-content/carrier crates it
  # exercises.
  custody-harness-smoke:
    name: custody-harness-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: source-gate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'))
    # The top-level `permissions: contents: read` above zeroes every other
    # scope for every job; dorny/paths-filter resolves a pull_request's
    # changed files via the GitHub API (this job's checkout is fetch-depth 1,
    # so there's no local base commit to diff against) and needs
    # `pull-requests: read` to do that -- without this, the filter step
    # (unconditional on pull_request) 403s and fails the job on every PR.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - name: detect custody/carrier-relevant changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            custody:
              - 'deploy/custody-host/**'
              - 'scripts/protected-content-installed-e2e-proof.sh'
              - 'scripts/protected-content-installed-static-audit.py'
              - 'scripts/custody-harness-ci-smoke.sh'
              - 'capsules/custody-provider/**'
              - 'capsules/availability-provider/**'
              - 'capsules/ipfs-provider/**'
              - 'elastos/crates/elastos-protected-content-*/**'
              # Targeted, not the whole elastos-server crate (which would
              # fire this 60-minute job on most PRs): exactly the modules
              # this smoke actually exercises -- Carrier transport/dial,
              # standalone provider hosting, and the custody
              # composition/chain-config CLI the ceremony drives.
              - 'elastos/crates/elastos-server/src/carrier.rs'
              - 'elastos/crates/elastos-server/src/carrier_service.rs'
              - 'elastos/crates/elastos-server/src/provider_host.rs'
              - 'elastos/crates/elastos-server/src/run_cmd.rs'
              - 'elastos/crates/elastos-server/src/server_infra.rs'
              - 'elastos/crates/elastos-server/src/node_cmd.rs'
              - 'elastos/crates/elastos-server/src/protected_content_config.rs'
      - id: should-run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "merge_group" ] || [ "${{ env.CI_SAVE_CACHE }}" = "true" ] || [ "${{ steps.filter.outputs.custody }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no custody/carrier-relevant paths changed on this PR; skipping the smoke run" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.should-run.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@72504271e02fb719eb4eb3eaece3a8e3d06f57c0 # 1.91.0
      # Builds the host `elastos` binary the smoke script itself invokes
      # (identity show, node peer add, node status) -- same cache shape as
      # the test-elastos/lint jobs above.
      - if: steps.should-run.outputs.run == 'true' && env.CI_USE_CACHE == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: elastos
          prefix-key: ${{ runner.os }}-custody-smoke-bd
          cache-directories: target-build
          save-if: ${{ env.CI_SAVE_CACHE == 'true' }}
      - if: steps.should-run.outputs.run == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Pre-warms the custody-host image's BuildKit layer cache via the GHA
      # cache backend, tagged/loaded exactly as deploy/custody-host/up.sh's
      # own `docker compose up -d --build` expects it -- that later build
      # then hits this same local layer cache instead of rebuilding cold.
      # The verified Kubo layer precedes COPY, so source changes reuse it.
      - name: pre-build custody-host image (GHA layer cache)
        if: steps.should-run.outputs.run == 'true'
        run: |
          cache_args=()
          if [[ "${CI_USE_CACHE}" == "true" ]]; then
            cache_args+=(--cache-from type=gha)
          fi
          # Only trusted saving runs write; merge-queue and PR scopes are unreadable elsewhere.
          if [[ "${CI_SAVE_CACHE}" == "true" ]]; then
            cache_args+=(--cache-to type=gha,mode=max)
          fi
          docker buildx build \
            -f deploy/custody-host/Dockerfile \
            -t elastos-custody-host:latest \
            "${cache_args[@]}" \
            --load \
            .
      - name: custody harness smoke
        if: steps.should-run.outputs.run == 'true'
        run: scripts/custody-harness-ci-smoke.sh
      - name: upload evidence receipt on failure
        if: failure() && steps.should-run.outputs.run == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: custody-harness-smoke-evidence
          path: /tmp/custody-harness-ci-smoke-evidence/
          retention-days: 7
          if-no-files-found: ignore

  # The source-home jobs run after the cheap source gate, in parallel
  # with tests across the three architectures. They are the de-facto release builders:
  # setup-source-home compiles the runtime, shell, home-cli and every provider
  # in --release. Tags, main and dispatch runs package those builds;
  # ARM also packages every candidate for the Jetson compatibility gate.
  source-home-linux:
    name: source-home-linux (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    needs: source-gate
    env:
      CI_APT_PACKAGES: coturn e2fsprogs ffmpeg musl-tools nasm pkg-config
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps: &source_home_linux_steps
      - name: set job build directories
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/source-home-linux-target" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_BUILD_DIR=$RUNNER_TEMP/source-home-linux-build" >> "$GITHUB_ENV"
          # Keep new entries locally while reading the shared trusted cache.
          echo "SCCACHE_MULTILEVEL_CHAIN=disk,gha" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$RUNNER_TEMP/source-home-sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=2G" >> "$GITHUB_ENV"
          echo "SCCACHE_LOCAL_RW_MODE=READ_WRITE" >> "$GITHUB_ENV"
          echo "SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY=l0" >> "$GITHUB_ENV"
      # Published tarballs keep the shipped Cargo release profile.
      - name: use CI journey release profile
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        run: |
          echo "CARGO_PROFILE_RELEASE_LTO=false" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - uses: dtolnay/rust-toolchain@72504271e02fb719eb4eb3eaece3a8e3d06f57c0 # 1.91.0
        with:
          targets: wasm32-unknown-unknown
      - name: configure Rust compile cache
        if: env.CI_USE_CACHE == 'true'
        uses: ./.github/actions/rust-compile-cache
      - name: verify compiler cache reuse and invalidation
        if: env.RUSTC_WRAPPER == 'sccache'
        run: python3 scripts/ci-rust-cache-smoke.py --output-json "$RUNNER_TEMP/source-home-cache-probe.json"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: env.CI_USE_CACHE == 'true'
        with:
          workspaces: elastos
          prefix-key: ${{ matrix.os }}-${{ runner.arch }}-source-home-registry
          # Cache Cargo inputs; journey artifacts start fresh.
          cache-targets: false
          save-if: ${{ env.CI_SAVE_CACHE == 'true' }}
      - name: require 16 GiB free disk
        run: |
          set -euo pipefail
          df -Pk .
          df -Pk . | awk 'NR == 2 { if ($4 < 16 * 1024 * 1024) exit 1 }'
      - name: require fresh Linux build artifacts
        run: |
          set -euo pipefail
          # Reuse this job's fresh source only, including across capsule workspaces.
          for directory in "$CARGO_TARGET_DIR" "$CARGO_BUILD_BUILD_DIR"; do
            test ! -e "$directory"
            test ! -L "$directory"
            mkdir -m 700 "$directory"
          done
      - name: prepare apt archive cache permissions
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 755 /var/cache/apt/archives
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
      - name: restore Ubuntu prerequisite archives
        if: env.CI_USE_CACHE == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-apt-prerequisites.sh') }}-${{ env.CI_APT_PACKAGES }}-${{ github.run_id }}
          restore-keys: apt-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-apt-prerequisites.sh') }}-${{ env.CI_APT_PACKAGES }}-
      - name: install host prerequisites
        id: apt-prerequisites
        timeout-minutes: 13
        run: bash scripts/ci-apt-prerequisites.sh
      - name: save Ubuntu prerequisite archives
        if: env.CI_USE_CACHE == 'true' && env.CI_SAVE_CACHE == 'true' && steps.apt-prerequisites.outputs.changed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-apt-prerequisites.sh') }}-${{ env.CI_APT_PACKAGES }}-${{ github.run_id }}
      - name: bind Kubo cache to its pin
        id: kubo-pin
        run: |
          platform=linux-amd64
          if [[ "${{ runner.arch }}" == ARM64 ]]; then platform=linux-arm64; fi
          echo "KUBO_PLATFORM=$platform" >> "$GITHUB_ENV"
          echo "KUBO_CACHE_DIR=$RUNNER_TEMP/kubo-cache" >> "$GITHUB_ENV"
          python3 scripts/ci-kubo-cache.py key "$platform" "$RUNNER_TEMP/kubo-cache"
      - name: restore verified Kubo inputs
        id: kubo-cache
        if: env.CI_USE_CACHE == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.kubo-pin.outputs.paths }}
          key: ${{ steps.kubo-pin.outputs.key }}
      - name: verify or download Kubo inputs
        timeout-minutes: 10
        run: python3 scripts/ci-kubo-cache.py fetch "$KUBO_PLATFORM" "$KUBO_CACHE_DIR"
      - name: save verified Kubo inputs
        if: env.CI_USE_CACHE == 'true' && env.CI_SAVE_CACHE == 'true' && steps.kubo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.kubo-pin.outputs.paths }}
          key: ${{ steps.kubo-pin.outputs.key }}
      - name: download pinned ARM64 engine input
        if: matrix.os == 'ubuntu-22.04-arm'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: llama-arm64-bundle
          path: ${{ runner.temp }}/llama-arm64-bundle
      - name: verify pinned ARM64 engine input
        if: matrix.os == 'ubuntu-22.04-arm'
        run: bash scripts/build/build-llama-server-bundle.sh --verify-archive "$RUNNER_TEMP/llama-arm64-bundle"
      - name: source-home into isolated HOME
        env:
          ELASTOS_COLLABORATION_STARTUP_MODE: isolated
          SETUP_SOURCE_HOME_INSTALL_LLAMA_SERVER: '1'
          SETUP_SOURCE_HOME_INSTALL_KUBO: '1'
          ELASTOS_LLAMA_ARM64_BUNDLE: ${{ runner.temp }}/llama-arm64-bundle/llama-b10516-bin-ubuntu22.04-arm64-cpu.tar.gz
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/source-home-logs"
          USER_HOME="${HOME}"
          SOURCE_HOME="${RUNNER_TEMP}/elastos-source-home"
          mkdir -p "${SOURCE_HOME}"
          export CARGO_HOME="${CARGO_HOME:-${USER_HOME}/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-${USER_HOME}/.rustup}"
          export HOME="${SOURCE_HOME}"
          export XDG_DATA_HOME="${SOURCE_HOME}/.local/share"
          export PATH="${CARGO_HOME}/bin:${PATH}"
          MEDIA_TOOLS_DIR="${RUNNER_TEMP}/source-home-media-tools"
          install -d -m 700 "${MEDIA_TOOLS_DIR}"
          for tool in ffmpeg ffprobe; do
            install -m 700 "$(command -v "${tool}")" "${MEDIA_TOOLS_DIR}/${tool}"
          done
          export SETUP_SOURCE_HOME_MEDIA_TOOLS_DIR="${MEDIA_TOOLS_DIR}"
          scripts/setup-source-home.sh 2>&1 | tee "${RUNNER_TEMP}/source-home-logs/setup-source-home.log"
          ELASTOS_DATA_DIR="${XDG_DATA_HOME}/elastos" \
            scripts/installed-provider-verify.sh 2>&1 | tee "${RUNNER_TEMP}/source-home-logs/installed-provider-verify.log"
      - name: local-carrier setup smoke
        env:
          ELASTOS_LLAMA_ARM64_BUNDLE: ${{ runner.temp }}/llama-arm64-bundle/llama-b10516-bin-ubuntu22.04-arm64-cpu.tar.gz
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/source-home-logs"
          scripts/local-carrier-setup-smoke.sh 2>&1 | tee "${RUNNER_TEMP}/source-home-logs/local-carrier-setup-smoke.log"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: prepare installed Home browser
        timeout-minutes: 10
        run: |
          npm ci --ignore-scripts --prefix elastos/tools/browser-playwright-engine
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/installed-home-browser"
          npx --prefix elastos/tools/browser-playwright-engine playwright install chromium --with-deps --only-shell
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: prepare signed SmolLM2 fixture
        timeout-minutes: 20
        env:
          CI_SOURCE_HOME: ${{ runner.temp }}/elastos-source-home
        run: scripts/ci-installed-journeys.sh prepare
      # Only the x86-64 job proves one reply Get from a separate holder Home over Carrier.
      - name: installed Marketplace Get and Assistant reply
        timeout-minutes: 15
        env:
          CI_SOURCE_HOME: ${{ runner.temp }}/elastos-source-home
          CI_CARRIER_GET: ${{ matrix.os == 'ubuntu-24.04' }}
        run: scripts/ci-installed-journeys.sh home
      - name: summarize installed model journey
        if: always()
        env:
          CI_SOURCE_HOME: ${{ runner.temp }}/elastos-source-home
          CI_CARRIER_GET: ${{ matrix.os == 'ubuntu-24.04' }}
        run: scripts/ci-installed-journeys.sh summary
      - name: upload installed model journey
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: source-home-journeys-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/source-home-journeys/**/*.json
            ${{ runner.temp }}/source-home-journeys/**/*.png
          retention-days: 7
          if-no-files-found: error
      # ARM needs the package for the Jetson compatibility gate on every event.
      - name: build and package release binaries
        if: matrix.os == 'ubuntu-22.04-arm' || github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          # Incremental on top of setup-source-home's release builds.
          cargo build --manifest-path elastos/Cargo.toml --workspace --release
          scripts/package-release-binaries.sh
      - name: verify Jetson release compatibility
        if: matrix.os == 'ubuntu-22.04-arm'
        run: |
          python3 scripts/verify-linux-arm64-package.py elastos-runtime-linux-arm64.tar.gz \
            --source-commit "$(git rev-parse HEAD)" \
            --source-tree "$(git rev-parse HEAD^{tree})" \
            --receipt elastos-runtime-linux-arm64.receipt.json
      - name: upload release binaries
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: elastos-runtime-${{ matrix.os }}
          path: |
            elastos-runtime-*.tar.gz
            elastos-runtime-*.tar.gz.sha256
            elastos-runtime-*.receipt.json
      - name: Rust compile cache statistics
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: |
          sccache --show-stats
          sccache --show-stats --stats-format=json > "$RUNNER_TEMP/source-home-sccache.json"
          {
            echo '### Rust compiler cache'
            echo '```text'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload source-home logs
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: source-home-linux-${{ matrix.os }}-logs
          path: ${{ runner.temp }}/source-home-logs/
          retention-days: 7
          if-no-files-found: ignore

  source-home-linux-arm64:
    name: source-home-linux (${{ matrix.check_name || matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    needs: [source-gate, engine-llama-arm64]
    env:
      CI_APT_PACKAGES: coturn e2fsprogs ffmpeg musl-tools nasm pkg-config
    strategy:
      fail-fast: false
      matrix:
        # Jetson's Ubuntu 22.04 host provides glibc 2.35.
        os: [ubuntu-22.04-arm]
        include:
          # Keep the established check name; os controls the build and artifact.
          - os: ubuntu-22.04-arm
            check_name: ubuntu-24.04-arm
    steps: *source_home_linux_steps

  source-home-macos:
    name: source-home-macos
    runs-on: macos-14
    # The two hop builds may take 30 minutes and the update journey step 75.
    timeout-minutes: 150
    needs: source-gate
    steps:
      - name: set job build directories
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/source-home-macos-target" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_BUILD_DIR=$RUNNER_TEMP/source-home-macos-build" >> "$GITHUB_ENV"
          echo "SCCACHE_MULTILEVEL_CHAIN=disk,gha" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$RUNNER_TEMP/source-home-sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=2G" >> "$GITHUB_ENV"
          echo "SCCACHE_LOCAL_RW_MODE=READ_WRITE" >> "$GITHUB_ENV"
          echo "SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY=l0" >> "$GITHUB_ENV"
      # Published tarballs keep the shipped Cargo release profile.
      - name: use CI journey release profile
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        run: |
          echo "CARGO_PROFILE_RELEASE_LTO=false" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - uses: dtolnay/rust-toolchain@72504271e02fb719eb4eb3eaece3a8e3d06f57c0 # 1.91.0
        with:
          targets: wasm32-unknown-unknown
      - name: configure Rust compile cache
        if: env.CI_USE_CACHE == 'true'
        uses: ./.github/actions/rust-compile-cache
      - name: verify compiler cache reuse and invalidation
        if: env.RUSTC_WRAPPER == 'sccache'
        run: python3 scripts/ci-rust-cache-smoke.py --output-json "$RUNNER_TEMP/source-home-cache-probe.json"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: env.CI_USE_CACHE == 'true'
        with:
          workspaces: elastos
          prefix-key: ${{ runner.os }}-source-home-registry
          # Cache Cargo inputs; journey artifacts start fresh.
          cache-targets: false
          save-if: ${{ env.CI_SAVE_CACHE == 'true' }}
      - name: reserve hosted Mac build and fixture capacity
        timeout-minutes: 10
        run: python3 scripts/update-hop-compare.py prepare-ci-disk
      - name: require fresh Mac build intermediates
        run: |
          set -euo pipefail
          # Keep outputs and Cargo 1.91 fingerprints outside restored caches.
          # Reuse this job's fresh source across capsules and version builds.
          for directory in "$CARGO_TARGET_DIR" "$CARGO_BUILD_BUILD_DIR"; do
            test ! -e "$directory"
            test ! -L "$directory"
            mkdir -m 700 "$directory"
          done
          echo "CI_MAC_BUILD_DIR_FRESH=true" >> "$GITHUB_ENV"
      - name: bind Kubo cache to its pin
        id: kubo-pin
        run: |
          echo "KUBO_CACHE_DIR=$RUNNER_TEMP/kubo-cache" >> "$GITHUB_ENV"
          python3 scripts/ci-kubo-cache.py key darwin-arm64 "$RUNNER_TEMP/kubo-cache"
      - name: restore verified Kubo inputs
        id: kubo-cache
        if: env.CI_USE_CACHE == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.kubo-pin.outputs.paths }}
          key: ${{ steps.kubo-pin.outputs.key }}
      - name: verify or download Kubo inputs
        timeout-minutes: 10
        run: python3 scripts/ci-kubo-cache.py fetch darwin-arm64 "$KUBO_CACHE_DIR"
      - name: save verified Kubo inputs
        if: env.CI_USE_CACHE == 'true' && env.CI_SAVE_CACHE == 'true' && steps.kubo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.kubo-pin.outputs.paths }}
          key: ${{ steps.kubo-pin.outputs.key }}
      - name: seed kubo into the test HOME
        run: |
          set -euo pipefail
          scripts/seed-kubo-cache.sh \
            "${RUNNER_TEMP}/kubo-cache" \
            "${RUNNER_TEMP}/elastos-mac-test-home/Library/Application Support/elastos" \
            darwin-arm64
      - name: require 16 GiB free disk
        run: |
          set -euo pipefail
          df -Pk .
          df -Pk . | awk 'NR == 2 { if ($4 < 16 * 1024 * 1024) exit 1 }'
      - name: install host prerequisites
        timeout-minutes: 15
        run: brew install e2fsprogs coturn ffmpeg
      - name: source-home into isolated MAC_TEST_HOME
        env:
          ELASTOS_COLLABORATION_STARTUP_MODE: isolated
          SETUP_SOURCE_HOME_INSTALL_LLAMA_SERVER: '1'
          SETUP_SOURCE_HOME_INSTALL_KUBO: '1'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/source-home-logs"
          USER_HOME="${HOME}"
          MAC_TEST_HOME="${RUNNER_TEMP}/elastos-mac-test-home"
          mkdir -p "${MAC_TEST_HOME}"
          export CARGO_HOME="${CARGO_HOME:-${USER_HOME}/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-${USER_HOME}/.rustup}"
          export HOME="${MAC_TEST_HOME}"
          export PATH="${CARGO_HOME}/bin:/opt/homebrew/bin:/opt/homebrew/opt/e2fsprogs/sbin:${PATH}"
          MEDIA_TOOLS_DIR="${RUNNER_TEMP}/source-home-media-tools"
          install -d -m 700 "${MEDIA_TOOLS_DIR}"
          for tool in ffmpeg ffprobe; do
            install -m 700 "$(command -v "${tool}")" "${MEDIA_TOOLS_DIR}/${tool}"
          done
          export SETUP_SOURCE_HOME_MEDIA_TOOLS_DIR="${MEDIA_TOOLS_DIR}"
          # The update hop signs this build as the installed release, and a signed release
          # version is X.Y.Z or X.Y.Z-{alpha|beta|rc}.N, never the default "-dev".
          export ELASTOS_RELEASE_VERSION="$(cargo metadata --no-deps --format-version 1 --manifest-path elastos/Cargo.toml \
            | python3 -I -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "elastos-server"))')"
          echo "ELASTOS_RELEASE_VERSION=$ELASTOS_RELEASE_VERSION" >> "$GITHUB_ENV"
          scripts/setup-source-home.sh 2>&1 | tee "${RUNNER_TEMP}/source-home-logs/setup-source-home.log"
          ELASTOS_DATA_DIR="${HOME}/Library/Application Support/elastos" \
            scripts/installed-provider-verify.sh 2>&1 | tee "${RUNNER_TEMP}/source-home-logs/installed-provider-verify.log"
      # The installed Home journey signs up through the real page. Playwright
      # 1.59.1's installer hangs extracting Chromium under Node 26; the journey runs on 26.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: prepare installed Home browser
        timeout-minutes: 5
        run: |
          npm ci --ignore-scripts --prefix elastos/tools/browser-playwright-engine
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/installed-home-browser"
          npx --prefix elastos/tools/browser-playwright-engine playwright install chromium --only-shell
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: prepare signed SmolLM2 fixture
        timeout-minutes: 20
        env:
          CI_SOURCE_HOME: ${{ runner.temp }}/elastos-mac-test-home
        run: scripts/ci-installed-journeys.sh prepare
      - name: installed Marketplace Get and Assistant reply
        timeout-minutes: 15
        env:
          CI_SOURCE_HOME: ${{ runner.temp }}/elastos-mac-test-home
        run: scripts/ci-installed-journeys.sh home-repeat
      - name: summarize installed model journey
        if: always()
        env:
          CI_SOURCE_HOME: ${{ runner.temp }}/elastos-mac-test-home
        run: scripts/ci-installed-journeys.sh summary
      - name: upload installed model journey
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: source-home-journeys-macos-14
          path: |
            ${{ runner.temp }}/source-home-journeys/**/*.json
            ${{ runner.temp }}/source-home-journeys/**/*.png
          retention-days: 7
          if-no-files-found: error
      # The hop starts from the published release the pin names. Its signed bytes are
      # cached by the pin; only a miss reads them from the public seed.
      - name: restore the pinned published release
        id: previous-release-cache
        if: env.CI_USE_CACHE == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/previous-release-cache
          key: previous-release-${{ hashFiles('scripts/update-hop-previous-release.json') }}
      - name: fetch the pinned published release
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 scripts/update-hop-compare.py fetch-previous-release \
            "$RUNNER_TEMP/previous-release-cache" "$RUNNER_TEMP/previous-release"
      - name: save the pinned published release
        if: env.CI_USE_CACHE == 'true' && env.CI_SAVE_CACHE == 'true' && steps.previous-release-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/previous-release-cache
          key: previous-release-${{ hashFiles('scripts/update-hop-previous-release.json') }}
      - name: build two actual Runtime versions
        # This source compiled twice (new and next) over the restored intermediates.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          CI_HOP_ROOT="$HOME/.local/share/elastos-ci-update-hop"
          test ! -e "$CI_HOP_ROOT"
          mkdir -p "$CI_HOP_ROOT"
          echo "CI_HOP_ROOT=$CI_HOP_ROOT" >> "$GITHUB_ENV"
          python3 scripts/update-hop-compare.py build-ci-hop "$CI_HOP_ROOT/build-inputs" \
            --runtime "$CARGO_TARGET_DIR/release/elastos" --previous "$RUNNER_TEMP/previous-release"
          python3 -I - "$CI_HOP_ROOT/build-inputs/build.json" <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          build = json.loads(path.read_text())
          directory = pathlib.Path(os.environ['CARGO_BUILD_BUILD_DIR'])
          assert directory == pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-home-macos-build'
          assert directory.is_dir() and not directory.is_symlink()
          target = pathlib.Path(os.environ['CARGO_TARGET_DIR'])
          assert target == pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-home-macos-target'
          assert target.is_dir() and not target.is_symlink()
          assert os.environ['CI_MAC_BUILD_DIR_FRESH'] == 'true'
          build['intermediates'] = {'directory': str(directory), 'initially_absent': True,
                                    'target_directory': str(target),
                                    'source': build['source']}
          path.write_text(json.dumps(build, indent=2) + '\n')
          PY
      - name: generate disposable signed install and update fixture
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 scripts/update-hop-compare.py generate-ci-hop "$CI_HOP_ROOT/package" \
            --runtime "$CI_HOP_ROOT/build-inputs/elastos-old" \
            --next-runtime "$CI_HOP_ROOT/build-inputs/elastos-new" \
            --system-runtime "$CI_HOP_ROOT/build-inputs/elastos-system" \
            --build-receipt "$CI_HOP_ROOT/build-inputs/build.json" \
            --support-home "$RUNNER_TEMP/elastos-mac-test-home/Library/Application Support/elastos" \
            --previous "$RUNNER_TEMP/previous-release" \
            > "$CI_HOP_ROOT/generation.json"
      - name: prove installed Home account and System update with Carrier hop and refusals
        # Expected about 20 minutes. The Home journey's waits are capped at: sign-up 240 s,
        # the published release's System update 480 s, 2 Home starts x 150 s, 2 reconnects
        # x 420 s (next release, Undo), tampered refusal 330 s, Undo commands 2 x 300 s:
        # 47 minutes in the worst case, plus the CLI installs and refusals.
        timeout-minutes: 75
        env:
          ELASTOS_CI_FIXTURE_SCOPE: ci-rehearsal
          ELASTOS_CI_REQUIRE_REAL_RUNTIME: "1"
        run: |
          set -euo pipefail
          export ELASTOS_CI_FIXTURE_MANIFEST_SHA256="$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["manifest_sha256"])' "$CI_HOP_ROOT/generation.json")"
          python3 scripts/update-hop-compare.py inspect "$CI_HOP_ROOT/package/fixture.json"
          python3 scripts/update-hop-compare.py run "$CI_HOP_ROOT/package/fixture.json" "$CI_HOP_ROOT/package/results"
      - name: require the update from the published release, no new provider warnings and Undo
        run: python3 scripts/update-hop-compare.py check-result "$CI_HOP_ROOT/package/results/result.json"
      - name: retain the safe CI hop receipt
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: macos-cli-update-hop-receipt
          path: |
            ${{ env.CI_HOP_ROOT }}/package/results/result.json
            ${{ env.CI_HOP_ROOT }}/package/results/home-system/*.png
            ${{ env.CI_HOP_ROOT }}/package/results/diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: remove stopped CI hop fixture files
        if: always() && env.CI_HOP_ROOT != ''
        run: |
          python3 -I - "$CI_HOP_ROOT" <<'PY'
          import json, pathlib, shutil, sys
          root = pathlib.Path(sys.argv[1])
          result = root / 'package/results/result.json'
          if result.exists() and not json.loads(result.read_text()).get('cleanup', {}).get('passed'):
              raise SystemExit('refusal cleanup was incomplete; disposable runner retains files until teardown')
          if not result.exists() and (root / 'package/results').exists():
              raise SystemExit('refusal cleanup receipt is missing; disposable runner retains files until teardown')
          build = root / 'build-inputs/build.json'
          if (root / 'build-inputs').exists() and (not build.exists() or not json.loads(build.read_text()).get('cleanup', {}).get('passed')):
              raise SystemExit('hop builder cleanup is incomplete; disposable runner retains files until teardown')
          shutil.rmtree(root)
          PY
      # Packages follow their upload policy after the source-home journey passes.
      - name: build and package release binaries
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          # Incremental on top of setup-source-home's release builds.
          cargo build --manifest-path elastos/Cargo.toml --workspace --release
          scripts/package-release-binaries.sh
      - name: upload release binaries
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: elastos-runtime-macos-14
          path: |
            elastos-runtime-*.tar.gz
            elastos-runtime-*.tar.gz.sha256
      - name: Rust compile cache statistics
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: |
          sccache --show-stats
          sccache --show-stats --stats-format=json > "$RUNNER_TEMP/source-home-sccache.json"
          {
            echo '### Rust compiler cache'
            echo '```text'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload source-home logs
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: source-home-macos-logs
          path: ${{ runner.temp }}/source-home-logs/
          retention-days: 7
          if-no-files-found: ignore

  # A pull request run stops at its first failed job, so the macOS and Linux
  # journeys do not run on for 30+ minutes after a decisive failure. Pushes,
  # merge queues and dispatches keep running every job to the end. This job
  # runs no repository code and is the only one that may cancel the run.
  cancel-on-failure:
    name: cancel-on-failure
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
    steps:
      - name: cancel this run after the first failed job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          run="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done_polls=0
          # Jobs that wait on needs appear late; two quiet polls confirm the end.
          while (( done_polls < 2 )); do
            sleep 20
            counts="$(gh api "$run/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq \
              '[.jobs[] | select(.name != "cancel-on-failure")] | "\(map(select(.conclusion == "failure" or .conclusion == "timed_out")) | length) \(map(select(.status != "completed")) | length)"')" || continue
            read -r failed pending <<< "$counts"
            if (( failed > 0 )); then
              echo "A job failed; cancelling the rest of this pull request run."
              gh api -X POST "$run/cancel"
              exit
            fi
            if (( pending == 0 )); then done_polls=$((done_polls + 1)); else done_polls=0; fi
          done

  # Publish a GitHub Release for v* tags, attaching the per-architecture
  # binary packages built by the source-home jobs. Only runs when every
  # lint/test/source-home job is green.
  release:
    name: publish-github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - lint
      - test-elastos
      - test-behaviour
      - test-capsules
      - source-home-linux
      - source-home-linux-arm64
      - source-home-macos
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: elastos-runtime-*
          merge-multiple: true
      - name: publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ElastOS Runtime ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            elastos-runtime-*.tar.gz
            elastos-runtime-*.tar.gz.sha256
