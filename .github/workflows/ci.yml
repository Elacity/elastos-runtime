name: CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check out and test"
        required: false
        default: ""
  push:
    # develop pushes keep the shared build caches warm for every PR into develop.
    branches: [main, develop]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Reviewed ARM64 archive pin, shared by the producer and every CI consumer.
  CI_LLAMA_ARM64_SHA256: da2b1e87fd7ffb90e540a6ded7a725994594e9bc260bf539858392d5fc96b205
  # An explicit dispatch ref may select a tag independently of the workflow ref.
  CI_USE_CACHE: ${{ github.ref_type != 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.ref != '') }}
  # Only merged code on develop or main saves caches. PR runs restore them but
  # never save, so one PR cannot evict every other PR's cache (10 GB repo cap)
  # or write a cache that later runs trust.
  CI_SAVE_CACHE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}

jobs:
  # Fast, compile-free gate: formatting and script-based source proofs.
  # Everything compile-heavy (clippy, tests, source-home) fans out in
  # parallel once this passes.
  source-gate:
    name: source-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: cargo fmt
        working-directory: elastos
        run: cargo fmt --all -- --check
      - name: architecture entropy checks
        run: |
          bash scripts/check-wci-alignment.sh
          node scripts/home-entropy-check.mjs
          node scripts/browser-entropy-check.mjs
      - name: product UI source proofs
        run: |
          node --version
          node scripts/home-shell-regression-smoke.mjs
          node scripts/home-agent-shell-smoke.mjs
          node --test scripts/home-agent-cancellation.test.mjs
          node scripts/people-discovery-smoke.mjs
      - name: release artifact source proofs
        run: |
          python3 scripts/ci-release-policy-test.py
          python3 scripts/components-release-integrity-check.py --self-test
          python3 scripts/publish-platform-artifacts-test.py
          python3 scripts/release-platform-input-test.py
          python3 scripts/prepare-release-platform-test.py
          python3 scripts/media-tools-build-test.py
          python3 scripts/update-hop-compare-test.py
      - name: Browser close handshake
        run: node --test scripts/browser-window-close-handshake.test.mjs

  # One input for every ARM consumer. PRs restore their develop base's cache;
  # only a develop push can save a verified recipe result in this namespace.
  engine-llama-arm64:
    name: engine-llama-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    needs: source-gate
    container:
      image: ubuntu@sha256:1cc7bb38a74c0e126716646e47c0b3c5c139547d386d5ff7a64cf3ea316ca523
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      BUILD_CONTAINER_IMAGE: ubuntu@sha256:1cc7bb38a74c0e126716646e47c0b3c5c139547d386d5ff7a64cf3ea316ca523
      ENGINE_BUILD_TOOLS: build-essential cmake git ca-certificates curl binutils file python3
    steps:
      - name: install engine build tools
        run: |
          apt-get update -qq
          read -r -a tools <<< "$ENGINE_BUILD_TOOLS"
          apt-get install -y -qq --no-install-recommends "${tools[@]}"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          persist-credentials: false
      - name: bind engine cache to build recipe
        id: engine-recipe
        run: |
          recipe_hash=$( {
            cat scripts/build/build-llama-server-bundle.sh
            printf '\n%s\n%s\n' "$BUILD_CONTAINER_IMAGE" "$ENGINE_BUILD_TOOLS"
          } | sha256sum | cut -d ' ' -f 1)
          echo "cache-key=develop-llama-arm64-${recipe_hash}" >> "$GITHUB_OUTPUT"
      - name: restore pinned ARM64 engine
        id: engine-cache
        if: env.CI_USE_CACHE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/llama-arm64-bundle
          key: ${{ steps.engine-recipe.outputs.cache-key }}
      - name: build and validate pinned ARM64 engine
        id: engine-build
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          export RECIPE_COMMIT="$(git rev-parse HEAD)"
          bash scripts/build/build-llama-server-bundle.sh "$RUNNER_TEMP/llama-arm64-bundle"
      - name: verify accepted ARM64 engine archive
        run: bash scripts/build/build-llama-server-bundle.sh --verify-archive "$RUNNER_TEMP/llama-arm64-bundle"
      - name: save pinned ARM64 engine
        if: env.CI_USE_CACHE == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/llama-arm64-bundle
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - name: upload pinned ARM64 engine input
        # Retain build receipts on a pin mismatch for review; dependent jobs
        # require this job to succeed before they can consume the archive.
        if: "!cancelled() && (steps.engine-cache.outputs.cache-hit == 'true' || steps.engine-build.outcome == 'success')"
        uses: actions/upload-artifact@v5
        with:
          name: llama-arm64-bundle
          path: ${{ runner.temp }}/llama-arm64-bundle/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: source-gate
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: env.CI_USE_CACHE == 'true'
        with:
          workspaces: elastos
          prefix-key: ${{ runner.os }}-elastos-bd
          # Shared intermediate build dir (root .cargo/config.toml build-dir)
          cache-directories: target-build
          save-if: ${{ env.CI_SAVE_CACHE == 'true' }}
      # clippy runs the full type-check pass, so a separate `cargo check`
      # would be redundant.
      - name: cargo clippy
        working-directory: elastos
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-elastos:
    name: test-elastos
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: source-gate
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
        if: env.CI_USE_CACHE == 'true'
        with:
          workspaces: elastos
          prefix-key: ${{ runner.os }}-elastos-test-bd
          # Shared intermediate build dir (root .cargo/config.toml build-dir)
          cache-directories: target-build
          save-if: ${{ env.CI_SAVE_CACHE == 'true' }}
      # The three provider workspaces are release-built from cold on every
      # run otherwise; with the cache restored, cargo only re-fingerprints
      # the workspace members and reuses every dependency artifact.
      - name: restore provider build artifacts
        id: providers-cache
        if: env.CI_USE_CACHE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            capsules/protected-content-protect-provider/target
            capsules/protected-content-decrypt-provider/target
            capsules/custody-provider/target
          key: providers-bd-target-${{ runner.os }}-${{ hashFiles('capsules/protected-content-protect-provider/Cargo.lock', 'capsules/protected-content-decrypt-provider/Cargo.lock', 'capsules/custody-provider/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            providers-bd-target-${{ runner.os }}-
      - name: build provider process binaries for tests
        run: |
          cargo build --release --manifest-path capsules/protected-content-protect-provider/Cargo.toml --target-dir capsules/protected-content-protect-provider/target
          cargo build --release --manifest-path capsules/protected-content-decrypt-provider/Cargo.toml --target-dir capsules/protected-content-decrypt-provider/target
          cargo build --release --manifest-path capsules/custody-provider/Cargo.toml --target-dir capsules/custody-provider/target
      - name: save provider build artifacts
        if: env.CI_USE_CACHE == 'true' && env.CI_SAVE_CACHE == 'true' && steps.providers-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            capsules/protected-content-protect-provider/target
            capsules/protected-content-decrypt-provider/target
            capsules/custody-provider/target
          key: providers-bd-target-${{ runner.os }}-${{ hashFiles('capsules/protected-content-protect-provider/Cargo.lock', 'capsules/protected-content-decrypt-provider/Cargo.lock', 'capsules/custody-provider/Cargo.lock', 'rust-toolchain.toml') }}
      - name: cargo test
        working-directory: elastos
        env:
          ELASTOS_TEST_PROTECT_PROVIDER_BIN: ${{ github.workspace }}/capsules/protected-content-protect-provider/target/release/protected-content-protect-provider
          ELASTOS_TEST_DECRYPT_PROVIDER_BIN: ${{ github.workspace }}/capsules/protected-content-decrypt-provider/target/release/protected-content-decrypt-provider
          ELASTOS_TEST_CUSTODY_PROVIDER_BIN: ${{ github.workspace }}/capsules/custody-provider/target/release/custody-provider
        run: cargo test --workspace --no-fail-fast
        # Network-sensitive tests are #[ignore] and won't run.
        # Run them explicitly with: cargo test --workspace -- --ignored

  test-capsules:
    name: test-capsules
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: source-gate
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: env.CI_USE_CACHE == 'true'
        with:
          # Registry/index cache only. The capsule build artifacts (about
          # 2.3 GB) are not cached: this job finishes well inside the
          # source-home critical path, and the develop caches that set wall
          # time must fit the 10 GB repository cap.
          workspaces: elastos
          prefix-key: ${{ runner.os }}-capsules-bd
          cache-targets: false
          save-if: ${{ env.CI_SAVE_CACHE == 'true' }}
      # The elastos workspace suite never builds or tests own-workspace
      # capsules; this mirrors `just test-capsules`.
      - name: test own-workspace capsules
        run: |
          set -uo pipefail
          failed=0
          for lock in capsules/*/Cargo.lock; do
              capsule="$(dirname "$lock")"
              echo "== testing $capsule =="
              (cd "$capsule" && cargo test --no-fail-fast) || failed=1
          done
          exit "$failed"

  # Rehearses the ELACITY-2298 dKMS ceremony (offline custody composition +
  # Carrier dial-proof preflight) against a fresh instance of the
  # deploy/custody-host 3-node compose harness -- scripts/custody-harness-ci-smoke.sh
  # owns all the logic (throwaway client identity, throwaway compose
  # project, receipt assertions, full teardown); this job is thin glue over
  # it. Gated to workflow_dispatch and PRs that actually touch the harness
  # image, the proof driver, or the protected-content/carrier crates it
  # exercises -- NOT every push, since the image build + 3-node bring-up
  # add real wall time.
  custody-harness-smoke:
    name: custody-harness-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: source-gate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    # The top-level `permissions: contents: read` above zeroes every other
    # scope for every job; dorny/paths-filter resolves a pull_request's
    # changed files via the GitHub API (this job's checkout is fetch-depth 1,
    # so there's no local base commit to diff against) and needs
    # `pull-requests: read` to do that -- without this, the filter step
    # (unconditional on pull_request) 403s and fails the job on every PR.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - name: detect custody/carrier-relevant changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            custody:
              - 'deploy/custody-host/**'
              - 'scripts/protected-content-installed-e2e-proof.sh'
              - 'scripts/protected-content-installed-static-audit.py'
              - 'scripts/custody-harness-ci-smoke.sh'
              - 'capsules/custody-provider/**'
              - 'capsules/availability-provider/**'
              - 'capsules/ipfs-provider/**'
              - 'elastos/crates/elastos-protected-content-*/**'
              # Targeted, not the whole elastos-server crate (which would
              # fire this 60-minute job on most PRs): exactly the modules
              # this smoke actually exercises -- Carrier transport/dial,
              # standalone provider hosting, and the custody
              # composition/chain-config CLI the ceremony drives.
              - 'elastos/crates/elastos-server/src/carrier.rs'
              - 'elastos/crates/elastos-server/src/carrier_service.rs'
              - 'elastos/crates/elastos-server/src/provider_host.rs'
              - 'elastos/crates/elastos-server/src/run_cmd.rs'
              - 'elastos/crates/elastos-server/src/server_infra.rs'
              - 'elastos/crates/elastos-server/src/node_cmd.rs'
              - 'elastos/crates/elastos-server/src/protected_content_config.rs'
      - id: should-run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.filter.outputs.custody }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no custody/carrier-relevant paths changed on this PR; skipping the smoke run" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.should-run.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@1.91.0
      # Builds the host `elastos` binary the smoke script itself invokes
      # (identity show, node peer add, node status) -- same cache shape as
      # the test-elastos/lint jobs above.
      - if: steps.should-run.outputs.run == 'true' && env.CI_USE_CACHE == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: elastos
          prefix-key: ${{ runner.os }}-custody-smoke-bd
          cache-directories: target-build
          save-if: ${{ env.CI_SAVE_CACHE == 'true' }}
      - if: steps.should-run.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3
      # Pre-warms the custody-host image's BuildKit layer cache via the GHA
      # cache backend, tagged/loaded exactly as deploy/custody-host/up.sh's
      # own `docker compose up -d --build` expects it -- that later build
      # then hits this same local layer cache instead of rebuilding cold.
      - name: pre-build custody-host image (GHA layer cache)
        if: steps.should-run.outputs.run == 'true'
        run: |
          cache_args=()
          if [[ "${CI_USE_CACHE}" == "true" ]]; then
            cache_args+=(--cache-from type=gha --cache-to type=gha,mode=max)
          fi
          docker buildx build \
            -f deploy/custody-host/Dockerfile \
            -t elastos-custody-host:latest \
            "${cache_args[@]}" \
            --load \
            .
      - name: custody harness smoke
        if: steps.should-run.outputs.run == 'true'
        run: scripts/custody-harness-ci-smoke.sh
      - name: upload evidence receipt on failure
        if: failure() && steps.should-run.outputs.run == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: custody-harness-smoke-evidence
          path: /tmp/custody-harness-ci-smoke-evidence/
          retention-days: 7
          if-no-files-found: ignore

  # The source-home jobs run after the cheap source gate, in parallel
  # with tests across the three architectures. They are the de-facto release builders:
  # setup-source-home compiles the runtime, shell, home-cli and every provider
  # in --release into the repo target dirs, so each job finishes by topping
  # that up to a full workspace release build (incremental at that point) and
  # packaging the binaries for its architecture — no separate cold
  # build-release job is needed.
  source-home-linux:
    name: source-home-linux (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    needs: [source-gate, engine-llama-arm64]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: env.CI_USE_CACHE == 'true'
        with:
          workspaces: elastos
          prefix-key: ${{ runner.os }}-${{ runner.arch }}-elastos-bd
          # Shared intermediate build dir (root .cargo/config.toml build-dir)
          cache-directories: target-build
          save-if: ${{ env.CI_SAVE_CACHE == 'true' }}
      - name: require 16 GiB free disk
        run: |
          set -euo pipefail
          df -Pk .
          df -Pk . | awk 'NR == 2 { if ($4 < 16 * 1024 * 1024) exit 1 }'
      # A stalled mirror once held this step until the 90-minute job limit.
      - name: install host prerequisites
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y coturn e2fsprogs ffmpeg musl-tools nasm pkg-config
      - name: source-home into isolated HOME
        env:
          ELASTOS_COLLABORATION_STARTUP_MODE: isolated
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/source-home-logs"
          USER_HOME="${HOME}"
          SOURCE_HOME="${RUNNER_TEMP}/elastos-source-home"
          mkdir -p "${SOURCE_HOME}"
          export CARGO_HOME="${CARGO_HOME:-${USER_HOME}/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-${USER_HOME}/.rustup}"
          export HOME="${SOURCE_HOME}"
          export XDG_DATA_HOME="${SOURCE_HOME}/.local/share"
          export PATH="${CARGO_HOME}/bin:${PATH}"
          MEDIA_TOOLS_DIR="${RUNNER_TEMP}/source-home-media-tools"
          install -d -m 700 "${MEDIA_TOOLS_DIR}"
          for tool in ffmpeg ffprobe; do
            install -m 700 "$(command -v "${tool}")" "${MEDIA_TOOLS_DIR}/${tool}"
          done
          export SETUP_SOURCE_HOME_MEDIA_TOOLS_DIR="${MEDIA_TOOLS_DIR}"
          scripts/setup-source-home.sh 2>&1 | tee "${RUNNER_TEMP}/source-home-logs/setup-source-home.log"
          ELASTOS_DATA_DIR="${XDG_DATA_HOME}/elastos" \
            scripts/installed-provider-verify.sh 2>&1 | tee "${RUNNER_TEMP}/source-home-logs/installed-provider-verify.log"
      - name: download pinned ARM64 engine input
        if: matrix.os == 'ubuntu-24.04-arm'
        uses: actions/download-artifact@v5
        with:
          name: llama-arm64-bundle
          path: ${{ runner.temp }}/llama-arm64-bundle
      - name: verify pinned ARM64 engine input
        if: matrix.os == 'ubuntu-24.04-arm'
        run: bash scripts/build/build-llama-server-bundle.sh --verify-archive "$RUNNER_TEMP/llama-arm64-bundle"
      - name: local-carrier setup smoke
        env:
          ELASTOS_LLAMA_ARM64_BUNDLE: ${{ runner.temp }}/llama-arm64-bundle/llama-b10516-bin-ubuntu22.04-arm64-cpu.tar.gz
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/source-home-logs"
          scripts/local-carrier-setup-smoke.sh 2>&1 | tee "${RUNNER_TEMP}/source-home-logs/local-carrier-setup-smoke.log"
      # Packages are uploaded only for tags, main and dispatch runs; PR runs
      # already proved the release build through setup-source-home.
      - name: build and package release binaries
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # Incremental on top of setup-source-home's release builds.
          cargo build --manifest-path elastos/Cargo.toml --workspace --release
          scripts/package-release-binaries.sh
      - name: upload release binaries
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: elastos-runtime-${{ matrix.os }}
          path: |
            elastos-runtime-*.tar.gz
            elastos-runtime-*.tar.gz.sha256
      - name: upload source-home logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: source-home-linux-${{ matrix.os }}-logs
          path: ${{ runner.temp }}/source-home-logs/
          retention-days: 7
          if-no-files-found: ignore

  source-home-macos:
    name: source-home-macos
    runs-on: macos-14
    timeout-minutes: 90
    needs: source-gate
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: env.CI_USE_CACHE == 'true'
        with:
          workspaces: elastos
          prefix-key: ${{ runner.os }}-elastos-bd
          # Shared intermediate build dir (root .cargo/config.toml build-dir)
          cache-directories: target-build
          save-if: ${{ env.CI_SAVE_CACHE == 'true' }}
      # dist.ipfs.tech is intermittently slow or unreachable from GitHub's
      # macOS runners, and setup's downloader makes a single 600s attempt.
      # Cache the verified release tarball and pre-seed bin/kubo so setup
      # skips the download entirely (ELACITY-2308).
      - name: cache kubo release
        if: env.CI_USE_CACHE == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kubo-cache
          key: kubo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('components.json') }}
      - name: seed kubo into the test HOME
        run: |
          set -euo pipefail
          scripts/seed-kubo-cache.sh \
            "${RUNNER_TEMP}/kubo-cache" \
            "${RUNNER_TEMP}/elastos-mac-test-home/Library/Application Support/elastos" \
            darwin-arm64
      - name: require 16 GiB free disk
        run: |
          set -euo pipefail
          df -Pk .
          df -Pk . | awk 'NR == 2 { if ($4 < 16 * 1024 * 1024) exit 1 }'
      - name: install host prerequisites
        timeout-minutes: 15
        run: brew install e2fsprogs coturn ffmpeg
      - name: source-home into isolated MAC_TEST_HOME
        env:
          ELASTOS_COLLABORATION_STARTUP_MODE: isolated
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/source-home-logs"
          USER_HOME="${HOME}"
          MAC_TEST_HOME="${RUNNER_TEMP}/elastos-mac-test-home"
          mkdir -p "${MAC_TEST_HOME}"
          export CARGO_HOME="${CARGO_HOME:-${USER_HOME}/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-${USER_HOME}/.rustup}"
          export HOME="${MAC_TEST_HOME}"
          export PATH="${CARGO_HOME}/bin:/opt/homebrew/bin:/opt/homebrew/opt/e2fsprogs/sbin:${PATH}"
          MEDIA_TOOLS_DIR="${RUNNER_TEMP}/source-home-media-tools"
          install -d -m 700 "${MEDIA_TOOLS_DIR}"
          for tool in ffmpeg ffprobe; do
            install -m 700 "$(command -v "${tool}")" "${MEDIA_TOOLS_DIR}/${tool}"
          done
          export SETUP_SOURCE_HOME_MEDIA_TOOLS_DIR="${MEDIA_TOOLS_DIR}"
          scripts/setup-source-home.sh 2>&1 | tee "${RUNNER_TEMP}/source-home-logs/setup-source-home.log"
          ELASTOS_DATA_DIR="${HOME}/Library/Application Support/elastos" \
            scripts/installed-provider-verify.sh 2>&1 | tee "${RUNNER_TEMP}/source-home-logs/installed-provider-verify.log"
      # Packages are uploaded only for tags, main and dispatch runs; PR runs
      # already proved the release build through setup-source-home.
      - name: build and package release binaries
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # Incremental on top of setup-source-home's release builds.
          cargo build --manifest-path elastos/Cargo.toml --workspace --release
          scripts/package-release-binaries.sh
      - name: upload release binaries
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: elastos-runtime-macos-14
          path: |
            elastos-runtime-*.tar.gz
            elastos-runtime-*.tar.gz.sha256
      - name: upload source-home logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: source-home-macos-logs
          path: ${{ runner.temp }}/source-home-logs/
          retention-days: 7
          if-no-files-found: ignore

  # Publish a GitHub Release for v* tags, attaching the per-architecture
  # binary packages built by the source-home jobs. Only runs when every
  # lint/test/source-home job is green.
  release:
    name: publish-github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - lint
      - test-elastos
      - test-capsules
      - source-home-linux
      - source-home-macos
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: elastos-runtime-*
          merge-multiple: true
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ElastOS Runtime ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            elastos-runtime-*.tar.gz
            elastos-runtime-*.tar.gz.sha256
