# Disposable proof workflow for #167. This branch is never a product merge candidate.
name: CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact 40-character source commit for the installed Home journey"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: installed-home-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Single-run core harness with the existing macOS data-root correction.
  CORE_HARNESS_SHA: cd00623c880f8260ea9dd710cc4b2d602303b721
  BOUNDED_REQUEST_SHA: aa9a2bdab03472cf7100af4833e846d0667a1b70

jobs:
  installed-home-macos:
    name: installed Home Marketplace and Assistant journey
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - name: validate exact source input and define isolated paths
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_COMMIT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_ACTIONS/$RUNNER_ENVIRONMENT/$RUNNER_OS" == true/github-hosted/macOS ]]
          echo "CI_SOURCE_HOME=${HOME}/.elastos-ci/source-home" >> "$GITHUB_ENV"
          echo "PROOF_OPERATOR_CARGO_HOME=${CARGO_HOME:-${HOME}/.cargo}" >> "$GITHUB_ENV"
          echo "PROOF_OPERATOR_RUSTUP_HOME=${RUSTUP_HOME:-${HOME}/.rustup}" >> "$GITHUB_ENV"
          echo "PROOF_EVIDENCE=${RUNNER_TEMP}/source-home-journeys" >> "$GITHUB_ENV"
          install -d -m 700 "${RUNNER_TEMP}/source-home-journeys"
      - name: check out exact candidate source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          path: source
          persist-credentials: false
      - name: check out existing core journey harness
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CORE_HARNESS_SHA }}
          path: harness
          persist-credentials: false
      - name: check out existing eight-token request
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.BOUNDED_REQUEST_SHA }}
          path: bounded-request
          persist-credentials: false
      - name: bind clean source identity
        env:
          SOURCE_COMMIT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ["PROOF_EVIDENCE"])
          identity = {"candidate": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                      "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
                      "source_clean_before_build": True}
          (root / "source-identity.json").write_text(json.dumps(identity, indent=2) + "\n")
          PYCODE
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.91.0
          targets: wasm32-unknown-unknown
      - name: restore Rust build cache only
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source/elastos
          prefix-key: macOS-elastos-bd
          cache-directories: source/target-build
          save-if: 'false'
      - name: restore Kubo archive cache only
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/kubo-cache
          key: kubo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('source/components.json') }}
      - name: seed recipe-verified licensed Kubo into isolated Home
        timeout-minutes: 15
        run: |
          set -euo pipefail
          umask 077
          python3 -I -S - <<'PYCODE'
          import hashlib, json, os, re, subprocess, tempfile
          from pathlib import Path
          from urllib.parse import urlsplit
          platform = "darwin-arm64"
          recipes = json.loads(Path("scripts/release-upstream-recipes.json").read_bytes())["recipes"]
          selected = [item for item in recipes if item["component"] == "kubo" and item["platform"] == platform]
          if len(selected) != 1:
              raise RuntimeError("Candidate requires exactly one native Kubo recipe")
          recipe = selected[0]
          info = recipe["source"]
          declared = urlsplit(info["url"])
          if (declared.scheme, declared.netloc) != ("https", "github.com") or declared.query or declared.fragment:
              raise RuntimeError("Kubo build input must use its pinned official GitHub archive")
          expected_path = "/ipfs/kubo/releases/download/v" + recipe["version"] + "/kubo_v" + recipe["version"] + "_darwin-arm64.tar.gz"
          if declared.path != expected_path or not re.fullmatch(r"sha512:[0-9a-f]{128}", info["checksum"]):
              raise RuntimeError("Candidate Kubo archive pin differs")
          algorithm, expected = info["checksum"].split(":", 1)
          filename = algorithm + "-" + expected
          with tempfile.TemporaryDirectory(prefix="kubo-refused-", dir=os.environ["RUNNER_TEMP"]) as tmp:
              cache, data = Path(tmp) / "cache", Path(tmp) / "data"
              cache.mkdir(mode=0o700)
              (cache / filename).write_bytes(b"tampered archive")
              refused = subprocess.run(["scripts/seed-kubo-cache.sh", str(cache), str(data), platform],
                                       capture_output=True, text=True)
              if refused.returncode == 0 or "cached upstream input failed its recorded checksum or bound" not in refused.stderr:
                  raise RuntimeError("Candidate accepted the tampered Kubo cache input")
              if (data / "bin/kubo").exists():
                  raise RuntimeError("Tampered input installed a Kubo executable")
          (Path(os.environ["PROOF_EVIDENCE"]) / "kubo-input-refusal.json").write_text(
              json.dumps({"tampered_archive": "refused", "installed_binary": "absent", "candidate_checksum": info["checksum"],
                          "recipe_sha256": hashlib.sha256(Path("scripts/release-upstream-recipes.json").read_bytes()).hexdigest()}, indent=2) + "\n")
          cache = Path(os.environ["RUNNER_TEMP"]) / "kubo-cache"
          cache.mkdir(mode=0o700, exist_ok=True)
          archive = cache / filename
          if not archive.exists():
              partial = archive.with_suffix(".partial")
              subprocess.run(["curl", "-fLsS", "--retry", "3", "--retry-delay", "5", "--retry-all-errors",
                              "--connect-timeout", "20", "--max-time", "180", "--max-filesize", str(info["max_bytes"]),
                              "-o", str(partial), info["url"]], check=True)
              if hashlib.sha512(partial.read_bytes()).hexdigest() != expected:
                  raise RuntimeError("Downloaded Kubo archive differs from the candidate checksum")
              partial.replace(archive)
          PYCODE
          scripts/seed-kubo-cache.sh "${RUNNER_TEMP}/kubo-cache" \
            "${CI_SOURCE_HOME}/Library/Application Support/elastos" darwin-arm64
          scripts/seed-kubo-cache.sh "${RUNNER_TEMP}/kubo-cache" \
            "${CI_SOURCE_HOME}/Library/Application Support/elastos" darwin-arm64 --verify-installed
      - name: reclaim unused stock Xcode and require build headroom
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os, re, shutil, stat, subprocess
          from pathlib import Path

          def unused_xcodes(applications, selected):
              applications = applications.resolve(strict=True)
              protected = set()
              for path in selected:
                  resolved = path.resolve(strict=True)
                  for bundle in (resolved, *resolved.parents):
                      if bundle.parent == applications and bundle.suffix == ".app":
                          protected.add(bundle)
                          break
              return sorted(path for path in applications.iterdir()
                            if re.fullmatch(r"Xcode_[0-9]+(?:\.[0-9]+)*\.app", path.name)
                            and not path.is_symlink() and path.is_dir()
                            and path.resolve(strict=True) not in protected)

          def identity(path):
              value = path.lstat()
              return value.st_dev, value.st_ino, value.st_mode

          def selected_xcodes():
              selected = [Path(subprocess.check_output(["xcode-select", "-p"], text=True).strip())]
              if os.environ.get("DEVELOPER_DIR"):
                  selected.append(Path(os.environ["DEVELOPER_DIR"]))
              generic = Path("/Applications/Xcode.app")
              if generic.exists() or generic.is_symlink():
                  selected.append(generic)
              return selected

          if (os.environ.get("GITHUB_ACTIONS"), os.environ.get("RUNNER_ENVIRONMENT"),
              os.environ.get("RUNNER_OS")) != ("true", "github-hosted", "macOS"):
              raise SystemExit("stock Xcode reclaim requires a GitHub-hosted Mac")
          applications = Path("/Applications")
          root_identity = identity(applications)
          if not stat.S_ISDIR(root_identity[2]):
              raise SystemExit("/Applications must be a physical directory")
          selected = selected_xcodes()
          candidates = {path: identity(path) for path in unused_xcodes(applications, selected)}
          usage = shutil.disk_usage(".")
          # setup-source-home documents a roughly 10 GiB cold-build footprint.
          # Leave 12 GiB for that build and retain 12% for installed journeys.
          required = max((usage.total * 15 + 99) // 100,
                         (usage.total * 12 + 99) // 100 + 12 * 1024**3)
          print(json.dumps({"stage": "before", "total_bytes": usage.total,
                            "available_bytes": usage.free, "required_bytes": required,
                            "selected": [str(path.resolve(strict=True)) for path in selected],
                            "unused_stock_xcode": [path.name for path in candidates]}), flush=True)
          for path in candidates:
              if usage.free >= required:
                  break
              still_unused = unused_xcodes(applications, selected_xcodes())
              if identity(applications) != root_identity or identity(path) != candidates[path]:
                  raise SystemExit("stock Xcode reclaim scope identity changed")
              if not stat.S_ISDIR(identity(path)[2]) or path not in still_unused:
                  raise SystemExit("stock Xcode reclaim candidate became protected or changed type")
              print("Reclaim unused stock Xcode: " + path.name, flush=True)
              subprocess.run(["sudo", "rm", "-rf", "--", str(path)], check=True)
              usage = shutil.disk_usage(".")
          print(json.dumps({"stage": "after", "total_bytes": usage.total,
                            "available_bytes": usage.free, "required_bytes": required}), flush=True)
          if usage.free < required:
              raise SystemExit("stock Xcode reclaim did not provide build headroom")
          PYCODE
      - name: install host prerequisites
        timeout-minutes: 15
        run: brew install e2fsprogs coturn ffmpeg
      - name: build and install exact source before adding the harness
        env:
          ELASTOS_COLLABORATION_STARTUP_MODE: isolated
          SETUP_SOURCE_HOME_INSTALL_LLAMA_SERVER: "1"
        run: |
          set -euo pipefail
          umask 077
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          install -d -m 700 "$CI_SOURCE_HOME"
          media_tools="${RUNNER_TEMP}/source-home-media-tools"
          install -d -m 700 "$media_tools"
          for tool in ffmpeg ffprobe; do
            install -m 700 "$(command -v "$tool")" "${media_tools}/${tool}"
          done
          python3 - <<'PYCODE'
          import json, shutil
          usage = shutil.disk_usage(".")
          required = max((usage.total * 15 + 99) // 100,
                         (usage.total * 12 + 99) // 100 + 12 * 1024**3)
          print(json.dumps({"stage": "before_source_home", "total_bytes": usage.total,
                            "available_bytes": usage.free, "required_bytes": required}), flush=True)
          if usage.free < required:
              raise SystemExit("source-home build headroom is unavailable after host prerequisites")
          PYCODE
          env HOME="$CI_SOURCE_HOME" \
            CARGO_HOME="$PROOF_OPERATOR_CARGO_HOME" \
            RUSTUP_HOME="$PROOF_OPERATOR_RUSTUP_HOME" \
            PATH="${PROOF_OPERATOR_CARGO_HOME}/bin:/opt/homebrew/bin:/opt/homebrew/opt/e2fsprogs/sbin:${PATH}" \
            SETUP_SOURCE_HOME_MEDIA_TOOLS_DIR="$media_tools" \
            scripts/setup-source-home.sh > "${CI_SOURCE_HOME}/setup-source-home.private.log" 2>&1
          ELASTOS_DATA_DIR="${CI_SOURCE_HOME}/Library/Application Support/elastos" \
            scripts/installed-provider-verify.sh --require-verified model-provider
      - name: verify installation receipt and artifact parity
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib, json, os, subprocess
          from pathlib import Path
          data = Path(os.environ["CI_SOURCE_HOME"]) / "Library/Application Support/elastos"
          root = Path(os.environ["PROOF_EVIDENCE"])
          identity = json.loads((root / "source-identity.json").read_text())
          receipt = json.loads((data / "receipts/source-home-installation.json").read_text())
          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()
          def built_binary(manifest, name):
              metadata = json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1",
                                                           "--manifest-path", manifest], text=True))
              return Path(metadata["target_directory"]) / "release" / name
          assert receipt["source"] == {"commit": identity["candidate"], "tree": identity["source_tree"], "clean": True}
          assert not subprocess.check_output(["git", "status", "--porcelain=v1", "--untracked-files=all"])
          installed_sha = digest(data / "bin/elastos")
          assert receipt["runtime"]["parity"] is True
          assert receipt["runtime"]["built_sha256"] == receipt["runtime"]["installed_sha256"] == "sha256:" + installed_sha
          assert digest(built_binary("elastos/Cargo.toml", "elastos")) == installed_sha
          provider_sha = digest(data / "bin/model-provider")
          assert digest(built_binary("capsules/model-provider/Cargo.toml", "model-provider")) == provider_sha
          proof = {**identity, "runtime_built_sha256": receipt["runtime"]["built_sha256"],
                   "runtime_installed_sha256": "sha256:" + installed_sha,
                   "built_model_provider_sha256": provider_sha,
                   "installed_model_provider_sha256": provider_sha,
                   "installation_receipt_sha256": digest(data / "receipts/source-home-installation.json"),
                   "installed_components_sha256": digest(data / "components.json"),
                   "installation_time_utc": receipt["installation_time_utc"]}
          (root / "installation-parity.json").write_text(json.dumps(proof, indent=2) + "\n")
          PYCODE
      - name: add only the pinned existing journey harness after installation
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          source = Path.cwd()
          rows = []
          files = {"ci-installed-journeys.sh": ("harness", os.environ["CORE_HARNESS_SHA"]),
                   "ci-installed-journeys.py": ("harness", os.environ["CORE_HARNESS_SHA"]),
                   "ci-model-package.mjs": ("harness", os.environ["CORE_HARNESS_SHA"]),
                   "ci-installed-home-journey.mjs": ("bounded-request", os.environ["BOUNDED_REQUEST_SHA"])}
          for name, (checkout, expected) in files.items():
              checkout = source.parent / checkout
              actual = subprocess.check_output(["git", "-C", str(checkout), "rev-parse", "HEAD"], text=True).strip()
              assert actual == expected
              original = checkout / "scripts" / name
              destination = source / "scripts" / name
              assert not destination.exists(), "candidate already owns harness path"
              original_bytes = original.read_bytes()
              shutil.copy2(original, destination)
              adaptation = None
              if name == "ci-model-package.mjs":
                  previous = 'for (const field of ["url", "checksum", "extract_path"]) assert.equal(info[field], sourceInfo[field], `Kubo ${field} matches the archive-verifying seed contract`);'
                  replacement = """// Proof adapter: source-home stamps the executable hash; the licensed
          // capsule archive and candidate recipe retain separate provenance.
          execFileSync("scripts/seed-kubo-cache.sh", [join(process.env.RUNNER_TEMP, "kubo-cache"), data, host, "--verify-installed"], { stdio: "pipe" });
          const kuboBuildBytes = readFileSync(join(data, "receipts/kubo-build.json"));
          const kuboBuild = JSON.parse(kuboBuildBytes);
          const recipeBytes = readFileSync("scripts/release-upstream-recipes.json");
          const kuboRecipes = JSON.parse(recipeBytes).recipes.filter(row => row.component === "kubo" && row.platform === host);
          assert.equal(kuboRecipes.length, 1, "candidate supplies one native Kubo recipe");
          const kuboRecipe = kuboRecipes[0];
          assert.equal(kuboBuild.component, "kubo");
          assert.equal(kuboBuild.platform, host);
          assert.equal(kuboBuild.capsule_manifest.version, kuboRecipe.version);
          assert.equal(sourceInfo.strategy, "source-build");
          for (const field of ["release_path", "extract_path", "install_path"]) assert.equal(kuboBuild[field], sourceInfo[field], `Kubo ${field} matches the candidate template`);
          assert.deepEqual(component.capsule_metadata.platforms[host], kuboBuild.capsule_metadata, "installed licensed Kubo capsule matches its receipt");
          const installedKuboBytes = readFileSync(join(data, "bin/kubo"));
          assert.equal(info.checksum, `sha256:${sha(installedKuboBytes)}`, "installed Kubo executable matches its stamped checksum");
          assert.equal(info.size, installedKuboBytes.length, "installed Kubo executable matches its stamped size");"""
                  text = original_bytes.decode()
                  if text.count(previous) != 1:
                      raise RuntimeError("Pinned Kubo harness adaptation point differs")
                  text = text.replace(previous, replacement)
                  text = text.replace('archive_checksum: info.checksum,', 'archive_checksum: kuboBuild.checksum, recipe_sha256: sha(recipeBytes), build_receipt_sha256: sha(kuboBuildBytes),')
                  destination.write_text(text)
                  adaptation = "Kubo proof uses candidate licensed recipe/capsule receipt, offline installed verification, and stamped executable identity"
              rows.append({"path": "scripts/" + name, "source_commit": actual,
                           "original_sha256": hashlib.sha256(original_bytes).hexdigest(),
                           "sha256": hashlib.sha256(destination.read_bytes()).hexdigest(),
                           "adaptation": adaptation})
          provenance = {"files": rows, "scope": "single installed Home core journey; historical wrapper without timing-series requirement; current eight-token request"}
          (Path(os.environ["PROOF_EVIDENCE"]) / "harness-provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          PYCODE
          git diff --exit-code
      # The pinned Playwright 1.59.1 installer uses Node 24 to avoid its Node 26 ZIP hang.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: prepare pinned model and browser fixture
        timeout-minutes: 15
        run: |
          set -euo pipefail
          scripts/ci-installed-journeys.sh prepare
          npm install --ignore-scripts --no-package-lock --prefix elastos/tools/browser-playwright-engine
          PLAYWRIGHT_BROWSERS_PATH="${HOME}/.elastos-ci/playwright" \
            elastos/tools/browser-playwright-engine/node_modules/.bin/playwright install chromium
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - name: record fixture processes before the journey
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          home = os.environ["CI_SOURCE_HOME"] + "/"
          rows, selected = {}, set()
          for line in subprocess.check_output(["ps", "-axo", "pid=,ppid=,pgid=,lstart=,args="], text=True).splitlines():
              fields = line.strip().split(None, 8)
              if len(fields) != 9:
                  continue
              pid = int(fields[0])
              rows[pid] = {"pid": pid, "ppid": int(fields[1]), "pgid": int(fields[2]), "start_time": " ".join(fields[3:8])}
              if home in fields[8]:
                  selected.add(pid)
          while True:
              descendants = {pid for pid, row in rows.items() if row["ppid"] in selected}
              if descendants <= selected:
                  break
              selected.update(descendants)
          snapshot = {"fixture_processes": [rows[pid] for pid in sorted(selected)]}
          (Path(os.environ["PROOF_EVIDENCE"]) / "processes-before.json").write_text(json.dumps(snapshot, indent=2) + "\n")
          PYCODE
      - name: signed-in Home Marketplace admission and Assistant real reply
        run: |
          set -euo pipefail
          PLAYWRIGHT_BROWSERS_PATH="${HOME}/.elastos-ci/playwright" scripts/ci-installed-journeys.sh home
          git diff --exit-code
      - name: installed journey summary
        if: always()
        run: |
          if [[ -f scripts/ci-installed-journeys.sh ]]; then
            scripts/ci-installed-journeys.sh summary
          else
            echo 'Installed journey blocked before harness preparation; inspect the first failed step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: stop remaining fixture-owned processes and record cleanup
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PYCODE'
          import json, os, signal, subprocess, time
          from pathlib import Path
          home = os.environ.get("CI_SOURCE_HOME")
          evidence = Path(os.environ.get("PROOF_EVIDENCE", os.environ["RUNNER_TEMP"] + "/source-home-journeys"))
          evidence.mkdir(mode=0o700, parents=True, exist_ok=True)
          baseline = evidence / "processes-before.json"
          known = {row["pid"]: row["start_time"] for row in json.loads(baseline.read_text())["fixture_processes"]} if baseline.exists() else {}
          def owned():
              if not home:
                  return []
              rows, selected = {}, set()
              for line in subprocess.check_output(["ps", "-axo", "pid=,ppid=,pgid=,lstart=,args="], text=True).splitlines():
                  fields = line.strip().split(None, 8)
                  if len(fields) != 9:
                      continue
                  pid, started = int(fields[0]), " ".join(fields[3:8])
                  rows[pid] = {"pid": pid, "ppid": int(fields[1]), "pgid": int(fields[2]), "start_time": started}
                  if home + "/" in fields[8] or known.get(pid) == started:
                      selected.add(pid)
              while True:
                  descendants = {pid for pid, row in rows.items() if row["ppid"] in selected}
                  if descendants <= selected:
                      break
                  selected.update(descendants)
              for pid in selected:
                  known[pid] = rows[pid]["start_time"]
              return [rows[pid] for pid in sorted(selected)]
          before = owned()
          for row in before:
              try:
                  os.kill(row["pid"], signal.SIGTERM)
              except ProcessLookupError:
                  pass
          deadline = time.monotonic() + 5
          while owned() and time.monotonic() < deadline:
              time.sleep(.25)
          forced = owned()
          for row in forced:
              try:
                  os.kill(row["pid"], signal.SIGKILL)
              except ProcessLookupError:
                  pass
          deadline = time.monotonic() + 5
          while owned() and time.monotonic() < deadline:
              time.sleep(.25)
          after = owned()
          receipt = {"selection": "processes naming this run's isolated Home, their observed descendants, and matching pre-journey PID/start-time identities",
                     "before_cleanup": before, "forced_stop": forced, "after_cleanup": after,
                     "status": "passed" if not after else "failed",
                     "retention": "disposable GitHub-hosted runner; public JSON/PNG retained seven days; Home and private logs removed with runner"}
          (evidence / "process-cleanup.json").write_text(json.dumps(receipt, indent=2) + "\n")
          if after:
              raise SystemExit("fixture-owned processes remain")
          PYCODE
      - name: upload public identity, journey and cleanup proof
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: installed-home-macos-${{ inputs.ref }}
          path: |
            ${{ runner.temp }}/source-home-journeys/*.json
            ${{ runner.temp }}/source-home-journeys/*.png
          retention-days: 7
          if-no-files-found: error
