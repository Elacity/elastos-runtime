              'runtime_source_commit': os.environ['SOURCE_COMMIT'], 'runtime_source_tree': os.environ['SOURCE_TREE'],
              'management': 'operator-managed-local-overlay',
              'provider_build_sha256': hashlib.sha256((output / 'provider-build.json').read_bytes()).hexdigest(),
              'operator_gate': 'Preserve existing manifest fields; replace only the linux-amd64 IPFS binary pin after approval.'}, indent=2) + '\n')
          shutil.copyfile(output / 'holder-idle.json', package / 'holder-idle.json')
          shutil.copyfile(output / 'accepted-build.json', package / 'accepted-build.json')
          shutil.copyfile(output / 'admission.json', package / 'admission.json')
          shutil.copyfile(output / 'provider-build.json', package / 'provider-build.json')
          sums = []
          for path in sorted(package.iterdir()):
              with path.open('rb') as stream:
                  sums.append(hashlib.file_digest(stream, 'sha256').hexdigest() + '  ' + path.name + '\n')
          (package / 'SHA256SUMS').write_text(''.join(sums))
          with tarfile.open(output / 'qualified-holder.tar.gz', 'w:gz') as archive:
              archive.add(package, arcname='qualified-holder')
          with (output / 'qualified-holder.tar.gz').open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          (output / 'qualified-holder.tar.gz.sha256').write_text(digest + '  qualified-holder.tar.gz\n')
          PY
      - name: upload passed operator provider handoff
        if: ${{ env.PACKAGE_MERGED == 'true' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: qualified-holder-linux-${{ env.PROVIDER_COMMIT }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/holder-output/qualified-holder.tar.gz
            ${{ runner.temp }}/holder-output/qualified-holder.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - name: upload qualification observations
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: holder-idle-observations-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/holder-output/*.json
            ${{ runner.temp }}/holder-output/gateway-source.tar.gz
            ${{ runner.temp }}/holder-output/*.stdout
            ${{ runner.temp }}/holder-output/*.stderr
          if-no-files-found: warn
          retention-days: 7
