[package]
name = "ddrm-consumer-smoke"
version = "0.1.0"
edition = "2021"
publish = false

# Dev-only orchestrator (NOT a capsule, never shipped): drives the REAL key-provider
# and decrypt-provider binaries over their stdin/stdout JSON protocol to prove the
# consumer half of the dDRM chain runs end to end — no Lit, no dKMS, no chain.
# See scripts/ddrm-consumer-smoke.sh and docs/convergence/SYSTEM_ARCHITECTURE_MAP.md.

[[bin]]
name = "ddrm-consumer-smoke"
path = "src/main.rs"

[dependencies]
# The SAME shared transcript encoder both rail sides bind (Day 54): the orchestrator
# computes the canonical AAD the key authority seals to and the decrypt boundary
# rebuilds. No private re-implementation -> no drift.
ddrm-envelope = { path = "../../../capsules/ddrm-envelope" }
serde_json = "1.0"
base64 = "0.22"
