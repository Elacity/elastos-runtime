[package]
name = "ddrm-viewer-demo"
version = "0.1.0"
edition = "2021"
publish = false

# Local, end-to-end VIEWER-SEAM demo (dev driver, NOT a capsule, never shipped):
# takes a real video, CENC-encrypts it as a multi-segment fMP4 asset under a fresh
# CEK, launches a REAL rail decrypt-provider (rail-stream + rail-mint), seals the
# CEK to the boundary's in-VM-minted session key (the exact ddrm-envelope handshake
# the key authority uses), and serves the REAL elacity-player + the scoped media
# routes so the owned video PLAYS in the browser — segment bytes decrypted in-VM,
# the CEK/IV NEVER crossing to the browser. The "local KMS producer" made runnable.

[[bin]]
name = "ddrm-viewer-demo"
path = "src/main.rs"

[dependencies]
# The shared local media-prep building blocks (CENC packaging + transcript-bound
# CEK seal + rail decrypt-provider client). The gateway uses the SAME crate, so the
# demo and the product seal/serve owned video through one implementation.
ddrm-media = { path = "../../../capsules/ddrm-media" }
serde_json = "1.0"

[profile.dev]
opt-level = 1

[workspace]
